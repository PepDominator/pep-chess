.achs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .ach { display:flex; gap:10px; align-items:center; background:var(--k-surf); border:1px solid var(--k-line); padding:10px 12px; } .ach i { font-style:normal; font-size:24px; } .ach b { display:block; font-size:13.5px; } .ach small { color:var(--k-mu); font-size:12px; }
.more { display:inline-block; margin-top:10px; border:1px solid var(--k-line); background:var(--k-panel); padding:8px 14px; font:600 13px 'Noto Sans',sans-serif; color:var(--k-tx); cursor:pointer; }
@media (max-width:760px) { .tiles, .games { grid-template-columns:repeat(2,1fr); } .achs { grid-template-columns:1fr; } .rank { margin-left:0; text-align:left; width:100%; } .fav div { grid-template-columns:120px 1fr 44px; } body { padding:10px; } .panel { padding:14px; } }

html[data-theme="dark"] { --navy:#5B76B8; }

html[data-theme="dark"] .cell.wrong .v { color:#FF9A8E; }
html[data-theme="dark"] .cell.hinted .v { color:#8CC3A0; }
html[data-theme="dark"] #pad button, html[data-theme="dark"] #kb button { background:#252C27; border-color:#39443C; color:#CBD6F2; }
html[data-theme="dark"] #pad button:disabled, html[data-theme="dark"] #kb button:disabled { color:#5A6760; }

/* шахматная и шашечная доски чуть приглушены, чтобы не слепили */

/* кружок «чёрных» шашек и подобные тёмные значки не должны сливаться с тёмным фоном */

<body>
<div class="wrap">
  <div class="top"><a href="../">← Все игры</a></div>
  <div class="panel"><div class="who"><div class="ava" id="ava">?</div><div><h1 class="serif" id="name">Профиль</h1><div class="sub" id="since"></div></div>
    <div class="rank"><small>Звание</small><b id="rank"></b><div class="bar"><i id="rankbar"></i></div><small id="ranknext"></small></div></div>
    <div id="pf-sync" style="margin-top:14px"></div></div>
  <div class="panel"><div class="tiles" id="tiles"></div></div>
  <div class="panel"><h2>Календарь игр <small id="heat-wk">последние 18 недель</small></h2><div class="heat" id="heat"></div>
    <div class="legend">меньше <i style="background:var(--k-hover)"></i><i style="background:#C9D9C6"></i><i style="background:#94B79A"></i><i style="background:#5E8A6A"></i><i style="background:var(--k-acc)"></i> больше</div></div>
  <div class="panel"><h2>Сыграно по дням <small>последние 30 дней</small></h2><div id="perday"></div></div>
  <div class="panel"><h2>Любимые игры <small>в сколько дней вы в них играли</small></h2><div class="fav" id="fav"></div></div>
  <div class="panel"><h2>Игры</h2><div class="games" id="games"></div></div>
  <div class="panel"><h2>Время решения ежедневных головоломок <small>последние 14 решённых</small></h2><div class="seg" id="dsel"></div><div id="dchart"></div></div>
  <div class="panel"><h2>Последние достижения</h2><div class="achs" id="achs"></div><button class="more" id="all-ach" type="button">Все достижения</button></div>
</div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (sec) => { sec = Math.round(sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
  const keyOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
  const GAMES = [[1, 'chess', '♞', 'Шахматы'], [2, 'draughts', '⛀', 'Шашки'], [4, 'sudoku', '🔢', 'Судоку'], [8, 'crossword', '🔤', 'Кроссворды'], [16, 'nonogram', '🧩', 'Японские кроссворды'], [32, 'sto', '🎤', 'Сто к одному'], [64, 'words', '🔍', 'Филворд'], [128, 'code', '🔑', 'Ключворд']];
  let dsel = 'sudoku';
  function render() {
    const A = load('pgAch', { u: {}, c: {}, d: {} }), c = A.c || {}, u = A.u || {}, d = A.d || {}, C = (k) => c[k] | 0;
    const X = window.PGA ? PGA.stats() : { days: Object.keys(d).length, best: 0, cur: 0, qTotal: 0 };
    // ---- кто ----
    const user = window.PGSync && PGSync.state && PGSync.state.user; const nm = user && user.name ? user.name : 'Гость';
    $('name').textContent = nm; $('ava').textContent = nm.trim()[0] ? nm.trim()[0].toUpperCase() : '?';
    const days = Object.keys(d).sort(); $('since').textContent = days.length ? `Играет с ${+days[0].slice(8)} ${months[+days[0].slice(5, 7) - 1]} ${days[0].slice(0, 4)}` + (user ? '' : ' · войдите, чтобы прогресс был на всех устройствах') : 'Сыграйте первую партию — и здесь появится ваша статистика';
    const got = Object.keys(u).length, total = window.PGA ? PGA.defs.length : got, R = window.PGA ? PGA.rankOf(got) : { name: '—', next: 0 };
    $('rank').textContent = R.name; const nextAt = got + (R.next || 0), prevRank = window.PGA ? [0, 5, 15, 30, 50, 75, 100, 115].filter((x) => x <= got).pop() : 0;
    $('rankbar').style.width = (R.next ? Math.round(100 * (got - prevRank) / Math.max(1, nextAt - prevRank)) : 100) + '%';
    $('ranknext').textContent = R.next ? `ещё ${R.next} ${plural(R.next, 'достижение', 'достижения', 'достижений')} до следующего звания` : 'высшее звание!';
    // ---- сводка ----
    const totalN = Object.values(d).reduce((a, x) => a + (x.n | 0), 0);
    $('tiles').innerHTML = [[X.days || days.length, plural(X.days || days.length, 'день с играми', 'дня с играми', 'дней с играми')], [X.cur || 0, 'дней подряд сейчас'], [X.best || 0, 'лучшая серия'], [totalN, plural(totalN, 'завершённая игра', 'завершённые игры', 'завершённых игр')], [`${got}/${total}`, 'достижений'], [X.qTotal || 0, 'дней со всеми заданиями'], [C('chW') + C('drW'), 'побед в шахматах и шашках'], [C('sd') + C('cw') + C('jp') + C('ws') + C('kw'), 'решённых головоломок']]
      .map(([v, t]) => `<div class="tile"><b>${v}</b><span>${t}</span></div>`).join('');
    // ---- календарь ----
    const today = new Date(); today.setHours(12, 0, 0, 0); const WK = Math.max(12, Math.min(52, Math.floor((($('heat').clientWidth || 300) + 3) / 17)));     // столько недель, сколько помещается по ширине
    const start = new Date(today); start.setDate(start.getDate() - 7 * (WK - 1) - ((today.getDay() + 6) % 7)); if ($('heat-wk')) $('heat-wk').textContent = `последние ${WK} ${plural(WK, 'неделя', 'недели', 'недель')}`;
    let h = ''; for (let k = 0; k < WK * 7; k++) { const dt = new Date(start); dt.setDate(start.getDate() + k); const key = keyOf(dt), n = d[key] ? d[key].n | 0 : 0, fut = dt > today;
      const l = fut ? 'future' : n === 0 ? '' : n === 1 ? 'l1' : n <= 3 ? 'l2' : n <= 6 ? 'l3' : 'l4'; h += `<i class="${l}" title="${dt.getDate()} ${months[dt.getMonth()]}: ${n} ${plural(n, 'игра', 'игры', 'игр')}"></i>`; }
    $('heat').innerHTML = h;
    // ---- по дням ----
    const pts = []; for (let k = 29; k >= 0; k--) { const dt = new Date(today); dt.setDate(today.getDate() - k); pts.push([dt, d[keyOf(dt)] ? d[keyOf(dt)].n | 0 : 0]); }
    const mx = Math.max(3, ...pts.map((p) => p[1])), W = 600, H = 150, bw = W / 30;
    $('perday').innerHTML = totalN ? `<svg class="chart" viewBox="0 0 ${W} ${H + 22}"><line class="ax" x1="0" y1="${H}" x2="${W}" y2="${H}"/>` + pts.map(([dt, n], i) => `<rect class="bar2" x="${i * bw + 3}" y="${H - (n / mx) * (H - 10)}" width="${bw - 6}" height="${(n / mx) * (H - 10)}"><title>${dt.getDate()} ${months[dt.getMonth()]}: ${n}</title></rect>` + (i % 5 === 0 || i === 29 ? `<text x="${i * bw + bw / 2}" y="${H + 16}" text-anchor="middle">${dt.getDate()}.${String(dt.getMonth() + 1).padStart(2, '0')}</text>` : '')).join('') + `<text x="2" y="12">${mx}</text></svg>` : '<div class="empty">Пока пусто — сыграйте во что-нибудь.</div>';
    // ---- любимые игры ----
    const cnt = GAMES.map(([bit, , ic, n]) => [ic + ' ' + n, Object.values(d).filter((x) => (x.g | 0) & bit).length]).sort((a, b) => b[1] - a[1]); const top = Math.max(1, cnt[0][1]);
    $('fav').innerHTML = cnt[0][1] ? cnt.filter((x) => x[1]).map(([n, v]) => `<div><span>${n}</span><span class="b"><i style="width:${Math.round(100 * v / top)}%"></i></span><span>${v} ${plural(v, 'день', 'дня', 'дней')}</span></div>`).join('') : '<div class="empty">Здесь появятся игры, в которые вы играете чаще всего.</div>';
    // ---- игры ----
    const st = (k) => load(k, {}), sto = st('stoStats'), ws = st('wordsStats'), code = st('codeStats');
    const pct = (w, p) => (p ? Math.round(100 * w / p) + '%' : '—'), sumS = (o) => Object.values((o && o.solved) || {}).reduce((a, b) => a + (+b || 0), 0);
    const daily = (k) => { const o = st(k).daily || {}; return `${o.streak || 0} ${plural(o.streak || 0, 'день', 'дня', 'дней')}`; };
    const cards = [
      ['chess', '♞ Шахматы', [['Партий', C('chP')], ['Побед', C('chW')], ['Ничьих', C('chD')], ['Доля побед', pct(C('chW'), C('chP'))]]],
      ['draughts', '⛀ Шашки', [['Партий', C('drP')], ['Побед', C('drW')], ['Ничьих', C('drD')], ['Доля побед', pct(C('drW'), C('drP'))]]],
      ['sudoku', '🔢 Судоку', [['Решено', C('sd')], ['Без ошибок', C('sdclean')], ['Серия судоку дня', daily('sudokuStats')]]],
      ['crossword', '🔤 Кроссворды', [['Решено', C('cw')], ['Без подсказок', C('cwclean')], ['Суперкроссвордов', C('cwweek')], ['Серия кроссворда дня', daily('crosswordStats')]]],
      ['nonogram', '🧩 Японские', [['Картинок', C('jp')], ['Без подсказок', C('jpclean')], ['Больших полей', C('jpbig')], ['Серия картинки дня', daily('nonogramStats')]]],
      ['sto', '🎤 Сто к одному', [['Игр', sto.games || 0], ['Лучший счёт', sto.best || 0], ['Побед в большой игре', sto.bigWins || 0], ['Полных табло', sto.fullBoards || 0]]],
      ['words', '🔍 Филворд', [['Филвордов', sumS(ws.fil)], ['«Поиск слов»', sumS(ws)], ['Тайных слов', ws.secrets || 0], ['Серия филворда дня', daily('wordsStats')]]],
      ['code', '🔑 Ключворд', [['Разгадано', sumS(code)], ['Сложных', (code.solved || {})[3] || 0], ['Серия ключворда дня', daily('codeStats')]]]];
    $('games').innerHTML = cards.map(([href, n, rows]) => `<a class="game" href="../${href}/"><div class="n">${n}</div><dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl></a>`).join('');
    // ---- время ежедневных ----
    const DS = [['sudoku', 'Судоку', 'sudokuStats', 1000], ['crossword', 'Кроссворд', 'crosswordStats', 1000], ['nonogram', 'Картинка', 'nonogramStats', 1000], ['words', 'Филворд', 'wordsStats', 1], ['code', 'Ключворд', 'codeStats', 1]];
    $('dsel').innerHTML = DS.map(([id, n]) => `<button type="button" data-g="${id}" class="${dsel === id ? 'on' : ''}">${n}</button>`).join('');
    $('dsel').querySelectorAll('button').forEach((b) => { b.onclick = () => { dsel = b.dataset.g; render(); }; });
    const [, , key, div] = DS.find((x) => x[0] === dsel), res = (st(key).daily || {}).results || {};
    const list = Object.keys(res).sort().slice(-14).map((k) => [k, (+res[k] || 0) / (div === 1000 && res[k] > 5000 ? 1000 : 1)]);
    if (list.length < 2) $('dchart').innerHTML = `<div class="empty">${list.length ? 'Решите ещё хотя бы одну ежедневную головоломку — и появится график.' : 'Решайте ежедневную головоломку — здесь появится график вашего времени.'}</div>`;
    else { const W2 = 600, H2 = 160, mxT = Math.max(...list.map((x) => x[1])) * 1.15, step = W2 / (list.length - 1), y = (t) => H2 - (t / mxT) * (H2 - 14);
      const avg = list.reduce((a, x) => a + x[1], 0) / list.length, best = Math.min(...list.map((x) => x[1]));
      $('dchart').innerHTML = `<svg class="chart" viewBox="-30 0 ${W2 + 50} ${H2 + 24}"><line class="ax" x1="0" y1="${H2}" x2="${W2}" y2="${H2}"/><polyline class="ln" points="${list.map(([, t], i) => `${i * step},${y(t)}`).join(' ')}"/>` + list.map(([k, t], i) => `<circle class="pt" cx="${i * step}" cy="${y(t)}" r="4"><title>${+k.slice(8)} ${months[+k.slice(5, 7) - 1]}: ${fmt(t)}</title></circle>` + (i % 3 === 0 || i === list.length - 1 ? `<text x="${i * step}" y="${H2 + 17}" text-anchor="middle">${+k.slice(8)}.${k.slice(5, 7)}</text>` : '')).join('') + `<text x="-28" y="${y(mxT / 1.15) + 4}">${fmt(mxT / 1.15)}</text></svg><div class="empty">Среднее время — ${fmt(avg)}, лучшее — ${fmt(best)}.</div>`; }
    // ---- достижения ----
    const defs = window.PGA ? PGA.defs : [], recent = Object.entries(u).sort((a, b) => b[1] - a[1]).map(([id, t]) => [defs.find((x) => x.id === id), t]).filter((x) => x[0]).slice(0, 6);      // сначала отбор известных, потом шесть последних
    $('achs').innerHTML = recent.length ? recent.map(([df, t]) => { const dt = new Date(t); return `<div class="ach"><i>${df.icon}</i><div><b>${esc(df.title)}</b><small>${dt.getDate()} ${months[dt.getMonth()]} · ${esc(df.desc)}</small></div></div>`; }).join('') : '<div class="empty">Пока ни одного — первое ждёт после первой партии.</div>';
  }
  $('all-ach').onclick = () => { if (window.PGA) PGA.open(); };
  window.addEventListener('storage', render); window.addEventListener('pgr-user', render); window.addEventListener('pgs-change', render);
  // вход через Google подтверждается через секунду-другую после открытия — перерисовываем, когда модуль синхронизации сообщит об этом
  window.addEventListener('pgsync-state', render); window.addEventListener('pgsync-applied', render);
  if (window.PGSync) PGSync.mountRow($('pf-sync'), true);
  render(); setTimeout(render, 1500);
  window.__pf = { render };
})();
</script>
</body>
</html>
