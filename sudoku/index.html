<script type="text/plain" id="sdk-engine">
// ============ Судоку: движок (генерация, решатель, оценка сложности) ============
// Сложность определяется тем, какие приёмы нужны человеку:
//  1 «Легко»   — только одиночки (в клетке один кандидат)
//  2 «Средне»  — нужны скрытые одиночки (цифра возможна только в одной клетке ряда/столбца/блока)
//  3 «Сложно»  — нужны пары, «указующие» пары/тройки и взаимодействие блока и линии
//  4 «Эксперт» — перечисленных приёмов недостаточно (нужны более сложные)
var SDK = (function () {
  const ROW = new Int8Array(81), COL = new Int8Array(81), BOX = new Int8Array(81);
  for (let i = 0; i < 81; i++) { ROW[i] = (i / 9) | 0; COL[i] = i % 9; BOX[i] = ((((i / 27) | 0) * 3) + (((i % 9) / 3) | 0)); }
  const UNITS = [];
  for (let r = 0; r < 9; r++) UNITS.push(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) UNITS.push(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let b = 0; b < 9; b++) UNITS.push(Array.from({ length: 9 }, (_, k) => (((b / 3) | 0) * 3 + ((k / 3) | 0)) * 9 + (b % 3) * 3 + (k % 3)));
  const PEERS = Array.from({ length: 81 }, (_, i) => { const s = new Set(); for (const u of UNITS) if (u.includes(i)) u.forEach((j) => j !== i && s.add(j)); return Array.from(s); });
  const POP = new Int8Array(512); for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

  // Считает решения (до limit). rnd — случайный порядок перебора цифр (для генерации полного поля).
  function solveCount(grid, limit, rnd) {
    const rows = new Int16Array(9), cols = new Int16Array(9), boxes = new Int16Array(9), cells = Array.from(grid);
    for (let i = 0; i < 81; i++) { const v = cells[i]; if (v) { const b = 1 << (v - 1); if ((rows[ROW[i]] | 0) & b || (cols[COL[i]] | 0) & b || (boxes[BOX[i]] | 0) & b) return { count: 0, solution: null }; rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b; } }
    let count = 0, first = null;
    function rec() {
      let best = -1, bestMask = 0, bestN = 10;
      for (let i = 0; i < 81; i++) if (!cells[i]) { const m = ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & 511, n = POP[m]; if (n < bestN) { bestN = n; best = i; bestMask = m; if (n <= 1) break; } }
      if (best < 0) { count++; if (!first) first = cells.slice(); return count >= limit; }
      if (bestN === 0) return false;
      const digits = []; for (let d = 0; d < 9; d++) if ((bestMask >> d) & 1) digits.push(d + 1);
      if (rnd) shuffle(digits, rnd);
      for (const d of digits) {
        const b = 1 << (d - 1); cells[best] = d; rows[ROW[best]] |= b; cols[COL[best]] |= b; boxes[BOX[best]] |= b;
        if (rec()) return true;
        cells[best] = 0; rows[ROW[best]] &= ~b; cols[COL[best]] &= ~b; boxes[BOX[best]] &= ~b;
      }
      return false;
    }
    rec(); return { count, solution: first };
  }

  // Кандидаты каждой клетки (битовые маски) для текущего поля
  function candidates(grid) {
    const cand = new Array(81).fill(0);
    for (let i = 0; i < 81; i++) if (!grid[i]) { let m = 511; for (const p of PEERS[i]) if (grid[p]) m &= ~(1 << (grid[p] - 1)); cand[i] = m; }
    return cand;
  }
  const digitOf = (m) => 32 - Math.clz32(m);          // единственный бит маски -> цифра

  // «Человеческий» решатель: возвращает { solved, level } — какой самый сложный приём понадобился
  function logic(grid) {
    const g = Array.from(grid), cand = candidates(g); let level = 1;
    const place = (i, d) => { g[i] = d; cand[i] = 0; const b = ~(1 << (d - 1)); for (const p of PEERS[i]) cand[p] &= b; };
    const remove = (i, mask) => { const had = cand[i] & mask; if (had) cand[i] &= ~mask; return !!had; };
    for (;;) {
      let progress = false;
      for (let i = 0; i < 81; i++) { if (!g[i]) { if (cand[i] === 0) return { solved: false, level: 9 }; if (POP[cand[i]] === 1) { place(i, digitOf(cand[i])); progress = true; } } }
      if (progress) continue;
      for (const u of UNITS) for (let d = 1; d <= 9; d++) {
        const bit = 1 << (d - 1); let where = -1, n = 0;
        for (const i of u) if (!g[i] && (cand[i] & bit)) { n++; where = i; }
        if (n === 1) { place(where, d); level = Math.max(level, 2); progress = true; }
      }
      if (progress) continue;
      // уровень 3: пары, указующие пары, блок-линия
      let did = false;
      for (const u of UNITS) {
        const two = u.filter((i) => !g[i] && POP[cand[i]] === 2);
        for (let a = 0; a < two.length; a++) for (let b = a + 1; b < two.length; b++) if (cand[two[a]] === cand[two[b]]) {
          for (const i of u) if (!g[i] && i !== two[a] && i !== two[b] && remove(i, cand[two[a]])) did = true;
        }
      }
      for (let b = 0; b < 9; b++) for (let d = 1; d <= 9; d++) {                  // «указующие»: цифра блока лежит на одной линии
        const bit = 1 << (d - 1), cells = UNITS[18 + b].filter((i) => !g[i] && (cand[i] & bit)); if (cells.length < 2) continue;
        if (cells.every((i) => ROW[i] === ROW[cells[0]])) { for (const i of UNITS[ROW[cells[0]]]) if (BOX[i] !== b && !g[i] && remove(i, bit)) did = true; }
        if (cells.every((i) => COL[i] === COL[cells[0]])) { for (const i of UNITS[9 + COL[cells[0]]]) if (BOX[i] !== b && !g[i] && remove(i, bit)) did = true; }
      }
      for (let l = 0; l < 18; l++) for (let d = 1; d <= 9; d++) {                 // блок-линия: цифра линии лежит в одном блоке
        const bit = 1 << (d - 1), cells = UNITS[l].filter((i) => !g[i] && (cand[i] & bit)); if (cells.length < 2) continue;
        if (cells.every((i) => BOX[i] === BOX[cells[0]])) { for (const i of UNITS[18 + BOX[cells[0]]]) if (!UNITS[l].includes(i) && !g[i] && remove(i, bit)) did = true; }
      }
      if (did) { level = Math.max(level, 3); continue; }
      break;
    }
    const solved = g.every((v) => v);
    return { solved, level: solved ? level : 4 };
  }

  const TARGET = { easy: { lvl: 1, floor: 38 }, medium: { lvl: 2, floor: 32 }, hard: { lvl: 3, floor: 28 }, expert: { lvl: 4, floor: 22 } };
  // Генерирует головоломку нужной сложности. rnd — генератор случайных чисел (для «судоку дня» — по дате).
  function makePuzzle(difficulty, rnd, maxAttempts) {
    const T = TARGET[difficulty] || TARGET.medium; let best = null;
    for (let attempt = 0; attempt < (maxAttempts || 40); attempt++) {
      const full = solveCount(new Array(81).fill(0), 1, rnd).solution, grid = full.slice(), order = shuffle(Array.from({ length: 81 }, (_, i) => i), rnd); let clues = 81;
      const floor = T.floor + (T.lvl < 4 ? ((rnd() * 3) | 0) - 1 : 0);        // небольшой разброс числа подсказок
      for (const i of order) {
        if (clues <= floor) break;
        const v = grid[i]; grid[i] = 0;
        if (solveCount(grid, 2).count !== 1) { grid[i] = v; continue; }
        if (T.lvl < 4) { const r = logic(grid); if (!r.solved || r.level > T.lvl) { grid[i] = v; continue; } }
        clues--;
      }
      const r = logic(grid), level = r.solved ? r.level : 4, res = { puzzle: grid.join(''), solution: full.join(''), clues, level, difficulty, attempts: attempt + 1 };
      if (level === T.lvl) return res;
      if (!best || Math.abs(level - T.lvl) < Math.abs(best.level - T.lvl)) best = res;
    }
    best.approx = true; return best;
  }

  // Следующий логический шаг для подсказки: { i, d, kind } или null
  function nextStep(grid) {
    const cand = candidates(grid);
    for (let i = 0; i < 81; i++) if (!grid[i] && POP[cand[i]] === 1) return { i, d: digitOf(cand[i]), kind: 'single' };
    for (const u of UNITS) for (let d = 1; d <= 9; d++) { const bit = 1 << (d - 1); let where = -1, n = 0; for (const i of u) if (!grid[i] && (cand[i] & bit)) { n++; where = i; } if (n === 1) return { i: where, d, kind: 'hidden' }; }
    return null;
  }

  return { ROW, COL, BOX, UNITS, PEERS, POP, mulberry32, shuffle, solveCount, candidates, logic, makePuzzle, nextStep, TARGET };
})();
if (typeof module !== 'undefined') module.exports = SDK;

</script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const SDK = new Function($('sdk-engine').textContent + '\nreturn SDK;')();
const BUILD = '2.1 · 23 октября 2026';

const LS = { save: 'sudokuSave', stats: 'sudokuStats', prefs: 'sudokuPrefs' };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const readPrefs = () => Object.assign({ autoCheck: true, hlSame: true, hlPeers: true, autoNotes: true, showNotes: true }, load(LS.prefs, {}));
let prefs = readPrefs();
const readStats = () => { const s = load(LS.stats, {}); s.solved = Object.assign({ easy: 0, medium: 0, hard: 0, expert: 0 }, s.solved); s.best = s.best || {}; s.daily = Object.assign({ last: null, streak: 0, results: {} }, s.daily); return s; };
let stats = readStats();
let S = null, level = 'medium', lastTick = 0;
$('ver').textContent = 'Версия ' + BUILD;

const pad2 = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const dayBefore = (key) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d - 1)); };
const fmt = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s % 60); };
let toastT = null; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

/* ---------- размеры ---------- */
function resize() {
  const stacked = innerWidth <= 820, availW = stacked ? innerWidth - 20 : innerWidth - 24 - 340, availH = stacked ? innerHeight - 20 - 52 - 250 : innerHeight - 24 - 52;
  const cell = Math.max(30, Math.floor(Math.min((stacked ? innerWidth - 24 : availW - 6) / 9, availH / 9, 62)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
addEventListener('resize', resize); resize();

/* ---------- построение поля ---------- */
const cells = [];
(function build() {
  const b = $('sboard');
  for (let i = 0; i < 81; i++) {
    const r = SDK.ROW[i], c = SDK.COL[i], d = document.createElement('div');
    d.className = 'cell' + ((((r / 3) | 0) + ((c / 3) | 0)) % 2 ? ' alt' : '') + (c % 3 === 2 && c < 8 ? ' br' : '') + (r % 3 === 2 && r < 8 ? ' bb' : '');
    d.innerHTML = '<span class="v"></span><div class="notes">' + '<i></i>'.repeat(9) + '</div>';
    d.onclick = () => select(i); b.appendChild(d); cells.push(d);
  }
  const pad = $('pad');
  for (let n = 1; n <= 9; n++) { const bt = document.createElement('button'); bt.dataset.n = n; bt.innerHTML = n + '<small></small>'; bt.onclick = () => setDigit(n); pad.appendChild(bt); }
})();

/* ---------- генерация (в фоне, чтобы страница не «подвисала») ---------- */
function generate(diff, seed) {
  return new Promise((resolve) => {
    const fallback = () => resolve(SDK.makePuzzle(diff, SDK.mulberry32(seed)));
    try {

  return `сюда подходит только <b>${d}</b>`;

    { text: '', target: () => rectOf(cells[P]), enter: () => { select(P); const b = document.querySelector('#pgt .pgt-t'); if (b) b.innerHTML = `А вот здесь точно сказать нельзя: в выделенную клетку подходят <b>две</b> цифры — ${candsOf(P).join(' и ')}. <b>Не угадывайте!</b> Включите «Писать заметки» и отметьте обе цифры маленькими — это напоминание себе.`; }, done: () => candsOf(P).every((d) => S.notes[P] & (1 << (d - 1))), demo: async (h) => { await h.path([centerOf($('t-notes')), centerOf(cells[P])].concat(candsOf(P).map((d) => centerOf(padBtn(d)))), (k) => { if (k === 0 && !S.notesMode) toggleNotes(); if (k === 1) select(P); if (k >= 2) setDigit(candsOf(P)[k - 2]); }); } },

    { text: 'Запомните порядок рассуждения: 1) ищите строку, столбец или квадрат, где не хватает одной-двух цифр; 2) для каждой недостающей цифры смотрите, <b>куда она может встать</b>; 3) для трудной клетки считайте, <b>что в неё подходит</b>; 4) если вариантов два — пишите заметки и возвращайтесь позже. Неверная цифра краснеет. Кнопка «Подсказка» всегда показывает следующий <b>логичный</b> ход.', target: grid, button: 'Понятно' },
    { text: 'Ваш черёд: решите оставшиеся клетки сами. Для каждой есть причина — используйте два приёма. Застряли — нажмите «Подсказка» или «👆 Покажи».', target: grid, done: () => S.done, praise: 'Судоку решено без угадывания!', demo: async (h) => { if (S.notesMode) toggleNotes(); const st = SDK.nextStep(S.val.map((v, k) => (v === S.sol[k] ? v : 0))); if (st) await demoDigit(h, st.i, st.d); } },
    { text: 'Готово! 🎉 Теперь вы решаете судоку как опытные игроки: только рассуждением. На лёгком уровне хватает этих двух приёмов, на трудных чаще помогают заметки и кнопка «Все заметки».', target: grid, button: 'Решить первое судоку (лёгкое)' }
