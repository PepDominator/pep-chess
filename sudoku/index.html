<script>
// ============ Общие настройки Pep Games (одни и те же во всех трёх страницах: общее меню, шахматы, шашки) ============
(function () {
  if (window.PGS) return;
  const KEY = 'pgSettings';
  const THEMES = {
    classic: { n: 'Классика', l: '#F6F4EB', d: '#C7CAB4' },
    green: { n: 'Зелёная', l: '#EEEED2', d: '#769656' },
    blue: { n: 'Голубая', l: '#DEE3E6', d: '#8CA2AD' },
    wood: { n: 'Дерево', l: '#F0D9B5', d: '#B58863' }
  };
  const DEFAULTS = { sound: true, confirm: false, board: 'classic', nums: true, chat: true, showGames: true, theme: 'auto' };
  function get() { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return Object.assign({}, DEFAULTS); } }
  // Тема оформления: светлая, тёмная или как в системе
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const isDark = (th) => th === 'dark' || ((th || 'auto') === 'auto' && !!(mq && mq.matches));
  function applyTheme() {
    const dark = isDark(get().theme), r = document.documentElement; r.dataset.theme = dark ? 'dark' : 'light';
    let m = document.querySelector('meta[name="theme-color"]'); if (!m && document.head) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); } if (m) m.content = dark ? '#131815' : '#EEF0E7';
  }
  if (mq) { const h = () => applyTheme(); if (mq.addEventListener) mq.addEventListener('change', h); else if (mq.addListener) mq.addListener(h); }
  function apply() {
    const s = get(), t = THEMES[s.board] || THEMES.classic, r = document.documentElement;
    r.style.setProperty('--sq-light', t.l); r.style.setProperty('--sq-dark', t.d); r.classList.toggle('no-nums', !s.nums); applyTheme();
  }
  function set(patch) { const v = Object.assign(get(), patch); try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} apply(); window.dispatchEvent(new Event('pgs-change')); return v; }
  window.PGS = { get, set, apply, THEMES, isDark };
  const THEME_OPTS = [['light', 'Светлая'], ['dark', 'Тёмная'], ['auto', 'Как в системе']];
  // Строка выбора темы оформления; используется и в панели настроек, и в судоку с кроссвордами
  window.PGS.mountThemeRow = function (host) {
    if (!host) return; const cur = get().theme || 'auto';
    host.innerHTML = '<div class="pg-row" style="flex-wrap:wrap"><div><b>Тема оформления</b><span class="d">Светлая, тёмная или как настроено в телефоне и компьютере</span></div><div class="pg-seg" role="group" aria-label="Тема оформления">' + THEME_OPTS.map(([k, n]) => '<button type="button" data-th="' + k + '" class="' + (cur === k ? 'on' : '') + '">' + n + '</button>').join('') + '</div></div>';
    host.querySelectorAll('.pg-seg button').forEach((b) => { b.onclick = () => { set({ theme: b.dataset.th }); window.PGS.mountThemeRow(host); }; });
  };
  // Звук: одно место, через которое проходят все звуки приложения.
  const origPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () { if (!get().sound) return Promise.resolve(); return origPlay.apply(this, arguments); };
  apply(); window.addEventListener('storage', (e) => { if (e.key === KEY) apply(); });
  window.addEventListener('pgsync-applied', (e) => { if (e.detail && e.detail.key === KEY) { apply(); window.dispatchEvent(new Event('pgs-change')); } });

  const css = `
.pg-gear { position:absolute; top:12px; right:14px; background:none; border:none; font-size:20px; line-height:1; color:var(--k-mu2); cursor:pointer; padding:4px 8px; z-index:3; font-family:inherit; }
.pg-gear:hover { color:var(--k-tx); background:var(--k-hover); } .pg-gear.static { position:static; }

.pg-panel { background:var(--k-panel); border:1px solid var(--k-line); width:100%; max-width:420px; max-height:calc(100dvh - 32px); overflow-y:auto; box-shadow:0 30px 80px rgba(42,46,36,.3); color:var(--k-tx); }

.pg-sw { position:relative; width:44px; height:24px; flex-shrink:0; background:var(--k-line2); border:none; cursor:pointer; transition:background .15s; padding:0; }
.pg-sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:var(--k-panel); transition:transform .15s; }
.pg-sw.on { background:#3B5D4A; } .pg-sw.on::after { transform:translateX(20px); }
.pg-themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:6px 24px 16px; }

.pg-th.on { border-color:#3B5D4A; color:var(--k-tx); font-weight:700; }
.pg-th i { display:block; aspect-ratio:1/1; margin-bottom:4px; box-shadow:0 0 0 1px rgba(42,46,36,.15); }
.pg-title2 { padding:14px 24px 0; font-size:14px; font-weight:600; }
.pg-seg { display:flex; width:100%; border:1px solid var(--k-line); } .pg-seg button { flex:1; background:var(--k-surf); border:none; border-right:1px solid var(--k-line); padding:8px 6px; font:600 12.5px 'Noto Sans',sans-serif; color:var(--k-mu); cursor:pointer; } .pg-seg button:last-child { border-right:none; } .pg-seg button.on { background:#3B5D4A; color:#fff; }
.pg-small { background:var(--k-surf); border:1px solid var(--k-line); padding:7px 12px; font:700 12.5px 'Noto Sans',sans-serif; color:var(--k-tx); cursor:pointer; flex-shrink:0; } .pg-small:hover { background:var(--k-hover); }
.pg-close { display:block; width:calc(100% - 48px); margin:18px 24px 22px; padding:12px; background:#3B5D4A; color:#fff; border:none; font:700 14px inherit; cursor:pointer; }
#pg-confirm { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:350; display:none; align-items:center; gap:10px; background:#2F3A56; color:#fff; padding:10px 12px 10px 16px; box-shadow:0 10px 30px rgba(0,0,0,.35); font:600 14px 'Noto Sans',system-ui,sans-serif; max-width:calc(100vw - 20px); }
#pg-confirm button { border:none; padding:9px 14px; font:700 13px inherit; cursor:pointer; }
#pg-confirm .ok { background:#3B5D4A; color:#fff; } #pg-confirm .no { background:var(--k-hover); color:var(--k-tx); }
.snd-btn { background:none; border:none; font-size:15px; line-height:1; color:var(--k-mu); cursor:pointer; width:28px; height:28px; padding:0; border-radius:2px; } .snd-btn:hover { background:var(--k-hover); color:var(--k-tx); }
.pg-pending { box-shadow:inset 0 0 0 1000px rgba(47,58,86,.38) !important; }
.no-nums .sq .num { display:none !important; }`;
  const st = document.createElement('style'); st.textContent = css; (document.head || document.documentElement).appendChild(st);

  // ---- кнопка звука внутри партии: любая кнопка с классом snd-btn включает и выключает звук ----
  function paintSnd() { const on = get().sound; document.querySelectorAll('.snd-btn').forEach((b) => { b.textContent = on ? '🔊' : '🔇'; b.title = on ? 'Звук включён. Нажмите, чтобы выключить' : 'Звук выключен. Нажмите, чтобы включить'; b.setAttribute('aria-pressed', String(on)); }); }
  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('.snd-btn'); if (b) set({ sound: !get().sound }); });
  window.addEventListener('pgs-change', paintSnd); window.addEventListener('storage', (e) => { if (e.key === KEY) paintSnd(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paintSnd); else paintSnd();

  // ---- панель «Настройки» ----
  window.openPgSettings = function () {
    if (document.getElementById('pg-ov')) return;
    const ov = document.createElement('div'); ov.className = 'pg-ov'; ov.id = 'pg-ov';
    const isDr = !!window.PG_DRAUGHTS;
    function paint() {
      const s = get();
      const sw = (k) => `<button class="pg-sw ${s[k] ? 'on' : ''}" data-k="${k}" role="switch" aria-checked="${s[k]}"></button>`;
      ov.innerHTML = `<div class="pg-panel" role="dialog" aria-modal="true"><h3>Настройки</h3>
        <div id="pg-theme-row"></div>
        <div class="pg-row"><div><b>Звук</b><span class="d">Звуки ходов, взятий и окончания партии</span></div>${sw('sound')}</div>
        <div class="pg-row"><div><b>Подтверждать ход</b><span class="d">После хода появляется кнопка «Подтвердить» — удобно на телефоне, чтобы не ходить случайно</span></div>${sw('confirm')}</div>
        <div class="pg-row"><div><b>Чат в партии</b><span class="d">Кнопка чата и сообщения соперника в онлайн-партиях. Выключите, если не хотите видеть сообщения</span></div>${sw('chat')}</div>
        <div id="pg-sync-row"></div>
        <div class="pg-row"><div><b>Показывать мои партии другим</b><span class="d">Ваши онлайн-партии (когда оба игрока вошли через Google и согласны) видны в профиле и в списке «Идущие партии». Действует на новые партии</span></div>${sw('showGames')}</div>
                ${isDr ? `<div class="pg-row"><div><b>Номера клеток</b><span class="d">Стандартная нумерация 1–50 на тёмных клетках</span></div>${sw('nums')}</div>` : ''}
        <div class="pg-row" id="pg-hide-row" style="display:none"><div><b>Скрыть прошлые партии</b><span class="d">Удалить публичные копии ваших прошлых партий (в профиле и по ссылкам)</span></div><button class="pg-small" id="pg-hide-btn">Скрыть</button></div>
        <div class="pg-title2">Оформление доски</div>
        <div class="pg-themes">${Object.entries(THEMES).map(([k, t]) => `<button class="pg-th ${s.board === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
        <button class="pg-close">Готово</button></div>`;
      window.PGS.mountThemeRow(ov.querySelector('#pg-theme-row'));
      if (window.PGSync) window.PGSync.mountRow(ov.querySelector('#pg-sync-row'));
      ov.querySelectorAll('.pg-sw').forEach((b) => { b.onclick = () => { const k = b.dataset.k; set({ [k]: !get()[k] }); paint(); }; });
      ov.querySelectorAll('.pg-th').forEach((b) => { b.onclick = () => { set({ board: b.dataset.b }); paint(); }; });
      const hideRow = ov.querySelector('#pg-hide-row'); if (hideRow && typeof window.pgHideMine === 'function') { hideRow.style.display = 'flex'; ov.querySelector('#pg-hide-btn').onclick = async (e) => { const b = e.target; b.disabled = true; b.textContent = '…'; try { const n = await window.pgHideMine(); b.textContent = n ? 'Скрыто: ' + n : 'Нечего скрывать'; } catch (err) { console.error(err); b.textContent = 'Не удалось'; } }; }
      ov.querySelector('.pg-close').onclick = close;
    }
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); }); document.addEventListener('keydown', onKey);
    paint(); document.body.appendChild(ov);
  };

  // ---- плашка «Подтвердить ход» ----
  let bar = null;
  window.pgConfirm = {
    show(text, ok, cancel) {
      if (!bar) { bar = document.createElement('div'); bar.id = 'pg-confirm'; document.body.appendChild(bar); }
      bar.innerHTML = '<span></span><button class="ok">✓ Подтвердить</button><button class="no">✕</button>';
      bar.firstChild.textContent = text; bar.style.display = 'flex';
      bar.querySelector('.ok').onclick = () => { ok(); }; bar.querySelector('.no').onclick = () => { cancel(); };
    },
    hide() { if (bar) bar.style.display = 'none'; },
    get visible() { return !!bar && bar.style.display !== 'none'; }
  };
})();

</script>
<script>
// ============ Синхронизация данных между устройствами (вход через Google, хранилище — Firestore) ============
// Принципы: данные по-прежнему лежат в браузере (всё работает офлайн), а облако — копия.
// Настройки и незавершённые партии: побеждает более поздняя правка. Статистика и история партий сливаются без потерь.
(function () {
  if (window.PGSync) return;
  const SDK = 'https://www.gstatic.com/firebasejs/10.13.0/';
  const CFG = { apiKey: 'AIzaSyDpce_OyUUijQajza3tIKQjcTBzAtGbQrY', authDomain: 'pep-chess-2026.firebaseapp.com', projectId: 'pep-chess-2026', storageBucket: 'pep-chess-2026.firebasestorage.app', messagingSenderId: '170856560854', appId: '1:170856560854:web:d9b6b766cbd56780ecf177' };
  // Что синхронизируем: m — способ слияния, slow — не чаще раза в 15 секунд (часто перезаписываемые сохранения)
  const REG = {
    pgSettings: { m: 'lww' }, draughtsSettings: { m: 'lww' }, draughtsNickname: { m: 'lww' }, chessNickname: { m: 'lww' },
    sudokuPrefs: { m: 'lww' }, sudokuLevel: { m: 'lww' }, crosswordPrefs: { m: 'lww' },
    sudokuSave: { m: 'lww', slow: true }, crosswordSave: { m: 'lww', slow: true }, crosswordWeekSave: { m: 'lww', slow: true },
    sudokuStats: { m: 'stats' }, crosswordStats: { m: 'stats' },
    chessGameHistory: { m: 'history', limit: 100 }, draughtsHistory: { m: 'history', limit: 100 },
    chessCurrent: { m: 'lww', delay: 2500 }, draughtsCurrent: { m: 'lww', delay: 2500 }       // идущая партия с компьютером: продолжить можно на другом устройстве
  };
  const META = 'pgSyncMeta', UIDK = 'pgSyncUid', DEVK = 'pgDevId';
  const ls = window.localStorage, rawSet = Storage.prototype.setItem, rawRem = Storage.prototype.removeItem;
  const getL = (k) => { try { return ls.getItem(k); } catch (e) { return null; } };
  const st = { status: 'off', user: null, last: 0, error: '' };
  let backend = null, uid = null, unsub = null, applying = false, timers = {}, started = false, firstDone = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms || 9000))]);
  const emit = () => window.dispatchEvent(new CustomEvent('pgsync-state', { detail: Object.assign({}, st) }));
  const setSt = (patch) => { Object.assign(st, patch); emit(); };
  const devId = () => { let d = getL(DEVK); if (!d) { d = Math.random().toString(36).slice(2, 10); try { rawSet.call(ls, DEVK, d); } catch (e) {} } return d; };
  const getMeta = () => { try { return JSON.parse(getL(META) || '{}'); } catch (e) { return {}; } };
  const putMeta = (m) => { try { rawSet.call(ls, META, JSON.stringify(m)); } catch (e) {} };
  const parse = (s) => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };

  // ---------- слияние ----------
  const pad2 = (n) => String(n).padStart(2, '0'), keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const dayBefore = (key) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d - 1)); };
  function mergeHistory(a, b, limit) {
    const map = new Map(); [].concat(parse(b) || [], parse(a) || []).forEach((r) => { if (r && r.date && !map.has(r.date)) map.set(r.date, r); });
    return JSON.stringify(Array.from(map.values()).sort((x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : 0)).slice(0, limit || 100));
  }
  function mergeStats(a, b) {
    const A = parse(a) || {}, B = parse(b) || {}, out = JSON.parse(JSON.stringify(A));
    out.solved = {}; for (const k of new Set(Object.keys(A.solved || {}).concat(Object.keys(B.solved || {})))) out.solved[k] = Math.max((A.solved || {})[k] || 0, (B.solved || {})[k] || 0);
    out.best = {}; for (const k of new Set(Object.keys(A.best || {}).concat(Object.keys(B.best || {})))) { const x = (A.best || {})[k], y = (B.best || {})[k]; out.best[k] = x == null ? y : y == null ? x : Math.min(x, y); }
    const ra = (A.daily && A.daily.results) || {}, rb = (B.daily && B.daily.results) || {}, res = {};
    for (const k of new Set(Object.keys(ra).concat(Object.keys(rb)))) res[k] = ra[k] == null ? rb[k] : rb[k] == null ? ra[k] : Math.min(ra[k], rb[k]);
    const last = Object.keys(res).sort().pop() || null; let streak = 0;
    if (last) { let d = last; while (res[d] != null) { streak++; d = dayBefore(d); } }
    out.daily = { last, streak, results: res };
    const wa = (A.weekly && A.weekly.results) || {}, wb = (B.weekly && B.weekly.results) || {}, wr = {};            // суперкроссворд недели: результаты объединяются
    for (const k of new Set(Object.keys(wa).concat(Object.keys(wb)))) wr[k] = wa[k] == null ? wb[k] : wb[k] == null ? wa[k] : Math.min(wa[k], wb[k]);
    if (Object.keys(wr).length) out.weekly = { results: wr };
    return JSON.stringify(out);
  }
  // Решает, что делать с ключом при сравнении локальных данных с облачными
  function reconcile(k, cloud) {
    const spec = REG[k], local = getL(k), m = getMeta()[k] || {}, lt = m.t || (local != null ? 1 : 0);
    if (!cloud) return local != null ? { push: true, val: local } : {};
    const cv = cloud.del ? null : cloud.v, ct = cloud.t || 0;
    if (spec.m === 'lww') {
      if (cv === local) return { t: Math.max(ct, lt) };
      if (ct > lt) return { apply: true, val: cv, t: ct };
      return { push: true, val: local };
    }
    const merged = spec.m === 'history' ? mergeHistory(local, cv, spec.limit) : mergeStats(local, cv);
    return { apply: merged !== local, val: merged, push: merged !== cv, t: Math.max(ct, lt) };
  }
  function applyLocal(k, val, t) {
    applying = true; try { if (val == null) rawRem.call(ls, k); else rawSet.call(ls, k, val); } catch (e) {} applying = false;
    const m = getMeta(); m[k] = { t: t || Date.now() }; putMeta(m);
    window.dispatchEvent(new CustomEvent('pgsync-applied', { detail: { key: k } }));
  }

  // ---------- облако ----------
  async function pushKey(k, forced) {
    if (!backend || !uid) return; const spec = REG[k]; let val = getL(k), t = (getMeta()[k] || {}).t || Date.now();
    try {
      if (spec.m !== 'lww') {                                            // слияние: сначала смотрим, что в облаке
        const cloud = await withTimeout(backend.get(uid, k)); const r = reconcile(k, cloud); if (r.apply) applyLocal(k, r.val, r.t); val = r.val != null ? r.val : val; if (cloud && !r.push) { setSt({ status: 'ok', last: Date.now() }); return; }
      }
      await withTimeout(backend.set(uid, k, { k, v: val == null ? '' : val, del: val == null, t, dev: devId() }));
      const m = getMeta(); m[k] = { t }; putMeta(m); setSt({ status: 'ok', last: Date.now(), error: '' });
    } catch (e) { setSt({ status: 'error', error: String(e && e.message || e) }); }
  }
  function schedule(k) {
    if (!uid || !backend) return; clearTimeout(timers[k]); const slow = REG[k].slow && getL(k) != null;      // удаление (партию закончили) отправляем сразу
    timers[k] = setTimeout(() => { setSt({ status: 'syncing' }); pushKey(k); }, slow ? (window.__pgSyncSlowMs || 15000) : (REG[k].delay ? (window.__pgSyncGameMs || REG[k].delay) : 1200));
  }
  function flush() { Object.keys(timers).forEach((k) => { clearTimeout(timers[k]); delete timers[k]; if (uid && backend) pushKey(k); }); }
  function onLocalChange(k) { const m = getMeta(); m[k] = { t: Date.now() }; putMeta(m); schedule(k); }

  // Любая запись в наши ключи localStorage в этой вкладке отправляется в облако
  Storage.prototype.setItem = function (k, v) { const prev = this === ls && REG[k] ? getL(k) : undefined; rawSet.apply(this, arguments); if (this === ls && REG[k] && !applying && prev !== String(v)) onLocalChange(k); };
  Storage.prototype.removeItem = function (k) { const had = this === ls && REG[k] ? getL(k) !== null : false; rawRem.apply(this, arguments); if (this === ls && REG[k] && !applying && had) onLocalChange(k); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); }); window.addEventListener('pagehide', flush);
  window.addEventListener('online', () => { if (uid) syncNow(); });

  async function handleChanges(changes, isFirst) {
    const seen = new Set();
    for (const ch of changes) {
      const k = ch.key; if (!REG[k]) continue; seen.add(k); const r = reconcile(k, ch.data);
      if (r.apply) applyLocal(k, r.val, r.t); else if (r.t) { const m = getMeta(); m[k] = { t: r.t }; putMeta(m); }
      if (r.push) pushKey(k, true);
    }

<script type="text/plain" id="sdk-engine">
// ============ Судоку: движок (генерация, решатель, оценка сложности) ============
// Сложность определяется тем, какие приёмы нужны человеку:
//  1 «Легко»   — только одиночки (в клетке один кандидат)
//  2 «Средне»  — нужны скрытые одиночки (цифра возможна только в одной клетке ряда/столбца/блока)
//  3 «Сложно»  — нужны пары, «указующие» пары/тройки и взаимодействие блока и линии
//  4 «Эксперт» — перечисленных приёмов недостаточно (нужны более сложные)
var SDK = (function () {
  const ROW = new Int8Array(81), COL = new Int8Array(81), BOX = new Int8Array(81);
  for (let i = 0; i < 81; i++) { ROW[i] = (i / 9) | 0; COL[i] = i % 9; BOX[i] = ((((i / 27) | 0) * 3) + (((i % 9) / 3) | 0)); }
  const UNITS = [];
  for (let r = 0; r < 9; r++) UNITS.push(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) UNITS.push(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let b = 0; b < 9; b++) UNITS.push(Array.from({ length: 9 }, (_, k) => (((b / 3) | 0) * 3 + ((k / 3) | 0)) * 9 + (b % 3) * 3 + (k % 3)));
  const PEERS = Array.from({ length: 81 }, (_, i) => { const s = new Set(); for (const u of UNITS) if (u.includes(i)) u.forEach((j) => j !== i && s.add(j)); return Array.from(s); });
  const POP = new Int8Array(512); for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

  // Считает решения (до limit). rnd — случайный порядок перебора цифр (для генерации полного поля).
  function solveCount(grid, limit, rnd) {
    const rows = new Int16Array(9), cols = new Int16Array(9), boxes = new Int16Array(9), cells = Array.from(grid);
    for (let i = 0; i < 81; i++) { const v = cells[i]; if (v) { const b = 1 << (v - 1); if ((rows[ROW[i]] | 0) & b || (cols[COL[i]] | 0) & b || (boxes[BOX[i]] | 0) & b) return { count: 0, solution: null }; rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b; } }
    let count = 0, first = null;
    function rec() {
      let best = -1, bestMask = 0, bestN = 10;
      for (let i = 0; i < 81; i++) if (!cells[i]) { const m = ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & 511, n = POP[m]; if (n < bestN) { bestN = n; best = i; bestMask = m; if (n <= 1) break; } }
      if (best < 0) { count++; if (!first) first = cells.slice(); return count >= limit; }
      if (bestN === 0) return false;
      const digits = []; for (let d = 0; d < 9; d++) if ((bestMask >> d) & 1) digits.push(d + 1);
      if (rnd) shuffle(digits, rnd);
      for (const d of digits) {
        const b = 1 << (d - 1); cells[best] = d; rows[ROW[best]] |= b; cols[COL[best]] |= b; boxes[BOX[best]] |= b;
        if (rec()) return true;
        cells[best] = 0; rows[ROW[best]] &= ~b; cols[COL[best]] &= ~b; boxes[BOX[best]] &= ~b;
      }
      return false;
    }
    rec(); return { count, solution: first };
  }

  // Кандидаты каждой клетки (битовые маски) для текущего поля
  function candidates(grid) {
    const cand = new Array(81).fill(0);
    for (let i = 0; i < 81; i++) if (!grid[i]) { let m = 511; for (const p of PEERS[i]) if (grid[p]) m &= ~(1 << (grid[p] - 1)); cand[i] = m; }
    return cand;
  }
  const digitOf = (m) => 32 - Math.clz32(m);          // единственный бит маски -> цифра

  // «Человеческий» решатель: возвращает { solved, level } — какой самый сложный приём понадобился
  function logic(grid) {
    const g = Array.from(grid), cand = candidates(g); let level = 1;
    const place = (i, d) => { g[i] = d; cand[i] = 0; const b = ~(1 << (d - 1)); for (const p of PEERS[i]) cand[p] &= b; };
    const remove = (i, mask) => { const had = cand[i] & mask; if (had) cand[i] &= ~mask; return !!had; };
    for (;;) {
      let progress = false;
      for (let i = 0; i < 81; i++) { if (!g[i]) { if (cand[i] === 0) return { solved: false, level: 9 }; if (POP[cand[i]] === 1) { place(i, digitOf(cand[i])); progress = true; } } }
      if (progress) continue;
      for (const u of UNITS) for (let d = 1; d <= 9; d++) {
        const bit = 1 << (d - 1); let where = -1, n = 0;
        for (const i of u) if (!g[i] && (cand[i] & bit)) { n++; where = i; }
        if (n === 1) { place(where, d); level = Math.max(level, 2); progress = true; }
      }
      if (progress) continue;
      // уровень 3: пары, указующие пары, блок-линия
      let did = false;
      for (const u of UNITS) {
        const two = u.filter((i) => !g[i] && POP[cand[i]] === 2);
        for (let a = 0; a < two.length; a++) for (let b = a + 1; b < two.length; b++) if (cand[two[a]] === cand[two[b]]) {
          for (const i of u) if (!g[i] && i !== two[a] && i !== two[b] && remove(i, cand[two[a]])) did = true;
        }
      }
      for (let b = 0; b < 9; b++) for (let d = 1; d <= 9; d++) {                  // «указующие»: цифра блока лежит на одной линии
        const bit = 1 << (d - 1), cells = UNITS[18 + b].filter((i) => !g[i] && (cand[i] & bit)); if (cells.length < 2) continue;
        if (cells.every((i) => ROW[i] === ROW[cells[0]])) { for (const i of UNITS[ROW[cells[0]]]) if (BOX[i] !== b && !g[i] && remove(i, bit)) did = true; }
        if (cells.every((i) => COL[i] === COL[cells[0]])) { for (const i of UNITS[9 + COL[cells[0]]]) if (BOX[i] !== b && !g[i] && remove(i, bit)) did = true; }
      }
      for (let l = 0; l < 18; l++) for (let d = 1; d <= 9; d++) {                 // блок-линия: цифра линии лежит в одном блоке
        const bit = 1 << (d - 1), cells = UNITS[l].filter((i) => !g[i] && (cand[i] & bit)); if (cells.length < 2) continue;
        if (cells.every((i) => BOX[i] === BOX[cells[0]])) { for (const i of UNITS[18 + BOX[cells[0]]]) if (!UNITS[l].includes(i) && !g[i] && remove(i, bit)) did = true; }
      }
      if (did) { level = Math.max(level, 3); continue; }
      break;
    }
    const solved = g.every((v) => v);
    return { solved, level: solved ? level : 4 };
  }

  const TARGET = { easy: { lvl: 1, floor: 38 }, medium: { lvl: 2, floor: 32 }, hard: { lvl: 3, floor: 28 }, expert: { lvl: 4, floor: 22 } };
  // Генерирует головоломку нужной сложности. rnd — генератор случайных чисел (для «судоку дня» — по дате).
  function makePuzzle(difficulty, rnd, maxAttempts) {
    const T = TARGET[difficulty] || TARGET.medium; let best = null;
    for (let attempt = 0; attempt < (maxAttempts || 40); attempt++) {
      const full = solveCount(new Array(81).fill(0), 1, rnd).solution, grid = full.slice(), order = shuffle(Array.from({ length: 81 }, (_, i) => i), rnd); let clues = 81;
      const floor = T.floor + (T.lvl < 4 ? ((rnd() * 3) | 0) - 1 : 0);        // небольшой разброс числа подсказок
      for (const i of order) {
        if (clues <= floor) break;
        const v = grid[i]; grid[i] = 0;
        if (solveCount(grid, 2).count !== 1) { grid[i] = v; continue; }
        if (T.lvl < 4) { const r = logic(grid); if (!r.solved || r.level > T.lvl) { grid[i] = v; continue; } }
        clues--;
      }
      const r = logic(grid), level = r.solved ? r.level : 4, res = { puzzle: grid.join(''), solution: full.join(''), clues, level, difficulty, attempts: attempt + 1 };
      if (level === T.lvl) return res;
      if (!best || Math.abs(level - T.lvl) < Math.abs(best.level - T.lvl)) best = res;
    }
    best.approx = true; return best;
  }

  // Следующий логический шаг для подсказки: { i, d, kind } или null
  function nextStep(grid) {
    const cand = candidates(grid);
    for (let i = 0; i < 81; i++) if (!grid[i] && POP[cand[i]] === 1) return { i, d: digitOf(cand[i]), kind: 'single' };
    for (const u of UNITS) for (let d = 1; d <= 9; d++) { const bit = 1 << (d - 1); let where = -1, n = 0; for (const i of u) if (!grid[i] && (cand[i] & bit)) { n++; where = i; } if (n === 1) return { i: where, d, kind: 'hidden' }; }
    return null;
  }

  return { ROW, COL, BOX, UNITS, PEERS, POP, mulberry32, shuffle, solveCount, candidates, logic, makePuzzle, nextStep, TARGET };
})();
if (typeof module !== 'undefined') module.exports = SDK;

</script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const SDK = new Function($('sdk-engine').textContent + '\nreturn SDK;')();
const BUILD = '1.18 · 8 октября 2026';
const DIFF = { easy: 'Легко', medium: 'Средне', hard: 'Сложно', expert: 'Эксперт' };
const HINTS = { easy: 'Хватает «одиночек»: в клетке остаётся единственная цифра.', medium: 'Понадобятся «скрытые одиночки» — цифра, которая возможна только в одной клетке ряда, столбца или блока.', hard: 'Нужны пары, «указующие» пары и взаимодействие блоков и линий.', expert: 'Простых приёмов не хватит. Только для опытных.' };
const LS = { save: 'sudokuSave', stats: 'sudokuStats', prefs: 'sudokuPrefs' };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const readPrefs = () => Object.assign({ autoCheck: true, hlSame: true, hlPeers: true, autoNotes: true }, load(LS.prefs, {}));
let prefs = readPrefs();
const readStats = () => { const s = load(LS.stats, {}); s.solved = Object.assign({ easy: 0, medium: 0, hard: 0, expert: 0 }, s.solved); s.best = s.best || {}; s.daily = Object.assign({ last: null, streak: 0, results: {} }, s.daily); return s; };
let stats = readStats();
let S = null, level = 'medium', lastTick = 0;
$('ver').textContent = 'Версия ' + BUILD;

const pad2 = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const dayBefore = (key) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d - 1)); };
const fmt = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s % 60); };
let toastT = null; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

/* ---------- размеры ---------- */
function resize() {
  const stacked = innerWidth <= 820, availW = stacked ? innerWidth - 20 : innerWidth - 24 - 340, availH = stacked ? innerHeight - 20 - 52 - 250 : innerHeight - 24 - 52;
  const cell = Math.max(30, Math.floor(Math.min((stacked ? innerWidth - 24 : availW - 6) / 9, availH / 9, 62)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
addEventListener('resize', resize); resize();

/* ---------- построение поля ---------- */
const cells = [];
(function build() {
  const b = $('sboard');
  for (let i = 0; i < 81; i++) {
    const r = SDK.ROW[i], c = SDK.COL[i], d = document.createElement('div');
    d.className = 'cell' + ((((r / 3) | 0) + ((c / 3) | 0)) % 2 ? ' alt' : '') + (c % 3 === 2 && c < 8 ? ' br' : '') + (r % 3 === 2 && r < 8 ? ' bb' : '');
    d.innerHTML = '<span class="v"></span><div class="notes">' + '<i></i>'.repeat(9) + '</div>';
    d.onclick = () => select(i); b.appendChild(d); cells.push(d);
  }
  const pad = $('pad');
  for (let n = 1; n <= 9; n++) { const bt = document.createElement('button'); bt.dataset.n = n; bt.innerHTML = n + '<small></small>'; bt.onclick = () => setDigit(n); pad.appendChild(bt); }
})();

/* ---------- генерация (в фоне, чтобы страница не «подвисала») ---------- */
function generate(diff, seed) {
  return new Promise((resolve) => {
    const fallback = () => resolve(SDK.makePuzzle(diff, SDK.mulberry32(seed)));
    try {
      const src = $('sdk-engine').textContent + '\nonmessage = (e) => { postMessage(SDK.makePuzzle(e.data.diff, SDK.mulberry32(e.data.seed))); };';
      const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' })), w = new Worker(url);
      w.onmessage = (e) => { w.terminate(); URL.revokeObjectURL(url); resolve(e.data); }; w.onerror = () => { w.terminate(); fallback(); };
      w.postMessage({ diff, seed });
    } catch (e) { fallback(); }
  });
}
function showLoading(on) { let el = $('loading'); if (on && !el) { el = document.createElement('div'); el.id = 'loading'; el.className = 'loading'; el.textContent = 'Готовим головоломку…'; document.body.appendChild(el); } else if (!on && el) el.remove(); }

async function startNew(diff, daily) {
  showLoading(true); const dateKey = daily ? todayKey() : null;
  const seed = daily ? (Number(dateKey.replace(/-/g, '')) ^ 0x5bd1e995) >>> 0 : (Math.random() * 4294967296) >>> 0;
  const p = await generate(daily ? 'medium' : diff, seed); showLoading(false);
  const puz = Array.from(p.puzzle, Number), sol = Array.from(p.solution, Number);
  S = { diff: daily ? 'medium' : diff, daily: !!daily, dateKey, puz, sol, val: puz.slice(), notes: new Array(81).fill(0), hinted: new Array(81).fill(false), sel: -1, notesMode: false, time: 0, mistakes: 0, hints: 0, hist: [], redo: [], paused: false, done: false, checked: false };
  openGame(); persist();
}

/* ---------- сохранение ---------- */
function persist() { if (!S || S.done) return; store(LS.save, { v: 1, diff: S.diff, daily: S.daily, dateKey: S.dateKey, puz: S.puz, sol: S.sol, val: S.val, notes: S.notes, hinted: S.hinted, time: S.time, mistakes: S.mistakes, hints: S.hints }); }
function resume() {
  const d = load(LS.save, null); if (!d || !d.puz) return false;
  S = Object.assign({ sel: -1, notesMode: false, hist: [], redo: [], paused: false, done: false, checked: false }, d); openGame(); return true;
}

/* ---------- ход ---------- */
function select(i) { if (!S || S.paused) return; S.sel = i; render(); }
function apply(changes, mist) {
  for (const c of changes) { S.val[c.i] = c.v1; S.notes[c.i] = c.n1; }
  S.hist.push({ changes, mist: mist || 0 }); if (S.hist.length > 500) S.hist.shift(); S.redo = []; S.checked = false; after();
}
function after() { render(); persist(); if (S.val.every((v, i) => v === S.sol[i])) win(); }
function setDigit(d) {
  if (!S || S.done || S.paused || S.sel < 0) return; const i = S.sel; if (S.puz[i]) return;
  if (S.notesMode) { if (S.val[i]) return; apply([{ i, v0: 0, n0: S.notes[i], v1: 0, n1: S.notes[i] ^ (1 << (d - 1)) }]); return; }
  if (S.val[i] === d) { erase(); return; }
  const ch = [{ i, v0: S.val[i], n0: S.notes[i], v1: d, n1: 0 }], bit = 1 << (d - 1);
  if (prefs.autoNotes) for (const p of SDK.PEERS[i]) if (S.notes[p] & bit) ch.push({ i: p, v0: S.val[p], n0: S.notes[p], v1: S.val[p], n1: S.notes[p] & ~bit });
  const wrong = d !== S.sol[i]; if (wrong) S.mistakes++;
  apply(ch, wrong ? 1 : 0);
}
function erase() { if (!S || S.done || S.paused || S.sel < 0) return; const i = S.sel; if (S.puz[i] || (!S.val[i] && !S.notes[i])) return; apply([{ i, v0: S.val[i], n0: S.notes[i], v1: 0, n1: 0 }]); }
function undo() { if (!S || S.done || S.paused || !S.hist.length) return; const h = S.hist.pop(); for (const c of h.changes) { S.val[c.i] = c.v0; S.notes[c.i] = c.n0; } S.redo.push(h); S.checked = false; render(); persist(); }
function redo() { if (!S || S.done || S.paused || !S.redo.length) return; const h = S.redo.pop(); for (const c of h.changes) { S.val[c.i] = c.v1; S.notes[c.i] = c.n1; } S.hist.push(h); render(); persist(); if (S.val.every((v, i) => v === S.sol[i])) win(); }
function toggleNotes() { if (!S) return; S.notesMode = !S.notesMode; render(); }
function hint() {
  if (!S || S.done || S.paused) return; let i = S.sel, d;
  if (i >= 0 && !S.puz[i] && S.val[i] !== S.sol[i]) d = S.sol[i];
  else {
    const st = SDK.nextStep(S.val.map((v, k) => (v === S.sol[k] ? v : 0)));
    if (st) { i = st.i; d = st.d; } else { i = S.val.findIndex((v, k) => v !== S.sol[k]); if (i < 0) return; d = S.sol[i]; }
  }
  S.sel = i; S.hints++; S.hinted[i] = true; const ch = [{ i, v0: S.val[i], n0: S.notes[i], v1: d, n1: 0 }], bit = 1 << (d - 1);
  if (prefs.autoNotes) for (const p of SDK.PEERS[i]) if (S.notes[p] & bit) ch.push({ i: p, v0: S.val[p], n0: S.notes[p], v1: S.val[p], n1: S.notes[p] & ~bit });
  apply(ch, 0); const el = cells[i]; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
function fillNotes() {
  if (!S || S.done || S.paused) return; const grid = S.val.map((v, k) => (v === S.sol[k] ? v : 0)), cand = SDK.candidates(grid), ch = [];
  for (let i = 0; i < 81; i++) if (!S.val[i] && S.notes[i] !== cand[i]) ch.push({ i, v0: 0, n0: S.notes[i], v1: 0, n1: cand[i] });
  if (ch.length) apply(ch, 0); else toast('Заметки уже заполнены');
}
function check() { if (!S || S.done || S.paused) return; S.checked = true; render(); const n = S.val.filter((v, i) => v && v !== S.sol[i]).length; toast(n ? 'Неверных цифр: ' + n : 'Ошибок нет — всё верно'); }

/* ---------- победа ---------- */
function win() {
  S.done = true; localStorage.removeItem(LS.save); const t = S.time; render();
  stats.solved[S.diff] = (stats.solved[S.diff] || 0) + 1; const noAid = S.hints === 0;
  if (!stats.best[S.diff] || t < stats.best[S.diff]) stats.best[S.diff] = t;
  let extra = '';
  if (S.daily) {
    const d = stats.daily; if (!d.results[S.dateKey]) { d.streak = d.last === dayBefore(S.dateKey) ? d.streak + 1 : 1; d.last = S.dateKey; d.results[S.dateKey] = t; }
    extra = `<br>Серия дней подряд: <b>${d.streak}</b>`;
  }
  store(LS.stats, stats);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'win-ov';
  ov.innerHTML = `<div class="win"><h3>Готово!</h3><div class="big-t">${fmt(t)}</div><div class="sub">${S.daily ? 'Судоку дня' : DIFF[S.diff]} решено${stats.best[S.diff] === t ? ' — <b>новый рекорд!</b>' : ''}<br>Ошибок: <b>${S.mistakes}</b> · Подсказок: <b>${S.hints}</b>${extra}</div>
    <button class="big" id="w-again">${S.daily ? 'Новая игра' : 'Ещё одну (' + DIFF[S.diff] + ')'}</button><button class="big light" id="w-menu">В меню</button></div>`;
  document.body.appendChild(ov);
  $('w-again').onclick = () => { ov.remove(); startNew(S.daily ? level : S.diff, false); }; $('w-menu').onclick = () => { ov.remove(); showMenu(); };
}

/* ---------- отрисовка ---------- */
function render() {
  if (!S) return; const sel = S.sel, sv = sel >= 0 ? S.val[sel] : 0, peers = sel >= 0 ? new Set(SDK.PEERS[sel]) : null;
  const showWrong = prefs.autoCheck || S.checked, cnt = new Array(10).fill(0), cntOk = new Array(10).fill(0); let left = 0;
  for (let i = 0; i < 81; i++) {
    const el = cells[i], v = S.val[i]; if (v) { cnt[v]++; if (v === S.sol[i]) cntOk[v]++; } else left++;
    el.className = el.className.replace(/ (given|sel|peer|same|wrong|hinted)\b/g, '');
    let cls = ''; if (S.puz[i]) cls += ' given'; if (S.hinted[i]) cls += ' hinted';
    if (i === sel) cls += ' sel'; else if (prefs.hlSame && sv && v === sv) cls += ' same'; else if (prefs.hlPeers && peers && (peers.has(i))) cls += ' peer';
    if (v && v !== S.sol[i] && showWrong) cls += ' wrong';
    el.className += cls; el.firstChild.textContent = v || '';
    const nodes = el.lastChild.children, m = v ? 0 : S.notes[i]; for (let k = 0; k < 9; k++) nodes[k].textContent = (m >> k) & 1 ? k + 1 : '';
  }
  $('mist').textContent = S.mistakes; $('hints').textContent = S.hints; $('left-n').textContent = left;
  $('lv').innerHTML = (S.daily ? 'Судоку дня' : DIFF[S.diff]) + (S.daily ? '<small>' + S.dateKey + '</small>' : '');
  $('t-notes').classList.toggle('on', S.notesMode); $('notes-state').textContent = S.notesMode ? 'вкл' : 'выкл';
  $('t-undo').disabled = !S.hist.length; $('t-redo').disabled = !S.redo.length;
  document.querySelectorAll('#pad button').forEach((b) => { const n = +b.dataset.n; b.disabled = cntOk[n] >= 9; b.lastChild.textContent = 9 - cnt[n] > 0 ? 9 - cnt[n] : ''; });
  $('timer').textContent = fmt(S.time);
}

/* ---------- таймер и пауза ---------- */
setInterval(() => { const now = performance.now(); if (S && !S.paused && !S.done && !$('game').classList.contains('hidden')) { S.time += now - lastTick; $('timer').textContent = fmt(S.time); } lastTick = now; }, 250);
setInterval(() => { if (S && !S.done && !$('game').classList.contains('hidden')) persist(); }, 5000);
function setPause(p) { if (!S || S.done) return; S.paused = p; $('pause-ov').style.display = p ? 'flex' : 'none'; $('pause-btn').textContent = p ? 'Играть' : 'Пауза'; if (!p) lastTick = performance.now(); persist(); }
$('pause-btn').onclick = () => setPause(!S.paused); $('pause-ov').onclick = () => setPause(false);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.done && !$('game').classList.contains('hidden')) setPause(true); });

/* ---------- клавиатура ---------- */
document.addEventListener('keydown', (e) => {
  if (!S || $('game').classList.contains('hidden') || document.querySelector('.ov')) return;
  if (S.paused) { if (e.key === ' ' || e.key === 'Enter') setPause(false); return; }
  if (e.ctrlKey || e.metaKey) { if (e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); } else if (e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); } return; }
  if (/^[1-9]$/.test(e.key)) { setDigit(+e.key); return; }
  const mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -9, ArrowDown: 9 }[e.key];
  if (mv !== undefined) { e.preventDefault(); let i = S.sel < 0 ? 40 : S.sel; const r = SDK.ROW[i], c = SDK.COL[i]; if ((mv === -1 && c === 0) || (mv === 1 && c === 8) || (mv === -9 && r === 0) || (mv === 9 && r === 8)) return; select(i + mv); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); return; }
  const k = e.key.toLowerCase(); if (k === 'n' || k === 'т') toggleNotes(); else if (k === 'h' || k === 'р') hint(); else if (k === ' ') { e.preventDefault(); setPause(true); }
});
$('t-undo').onclick = undo; $('t-redo').onclick = redo; $('t-erase').onclick = erase; $('t-notes').onclick = toggleNotes; $('t-hint').onclick = hint; $('t-auto').onclick = fillNotes; $('t-check').onclick = check;

/* ---------- меню ---------- */
function openGame() { $('menu').classList.add('hidden'); $('game').classList.remove('hidden'); $('pause-ov').style.display = S.paused ? 'flex' : 'none'; $('pause-btn').textContent = S.paused ? 'Играть' : 'Пауза'; lastTick = performance.now(); resize(); render(); }
function showMenu() { if (S && !S.done) { persist(); } $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
$('menu-btn').onclick = showMenu;
function renderMenu() {
  const sv = load(LS.save, null), rc = $('resume-card');
  rc.classList.toggle('hidden', !sv);
  if (sv) { const filled = sv.val.filter(Boolean).length; $('resume-info').textContent = `${sv.daily ? 'Судоку дня' : DIFF[sv.diff]} · ${fmt(sv.time)} · заполнено ${filled} из 81`; }
  const tk = todayKey(), d = stats.daily;
  $('daily-info').innerHTML = d.results[tk] != null ? `Решено сегодня за ${fmt(d.results[tk])} ✓ · серия: ${d.streak}` : (d.streak && d.last === dayBefore(tk) ? `Не прерывайте серию: ${d.streak} дн. подряд` : 'Одна и та же головоломка для всех, каждый день новая');
  $('daily-btn').textContent = d.results[tk] != null ? 'Ещё раз' : 'Играть';
  $('level-hint').textContent = HINTS[level];
  document.querySelectorAll('#levels button').forEach((b) => b.classList.toggle('on', b.dataset.d === level));
  $('stats').innerHTML = '<tr><th>Сложность</th><th>Решено</th><th>Лучшее время</th></tr>' + Object.keys(DIFF).map((k) => `<tr><td>${DIFF[k]}</td><td>${stats.solved[k] || 0}</td><td>${stats.best[k] != null ? fmt(stats.best[k]) : '—'}</td></tr>`).join('');
}
document.querySelectorAll('#levels button').forEach((b) => { b.onclick = () => { level = b.dataset.d; try { localStorage.setItem('sudokuLevel', level); } catch (e) {} renderMenu(); }; });
$('new-btn').onclick = () => startNew(level, false);
$('daily-btn').onclick = () => startNew('medium', true);
$('resume-btn').onclick = () => { if (!resume()) renderMenu(); };
try { const l = localStorage.getItem('sudokuLevel'); if (DIFF[l]) level = l; } catch (e) {}
// Данные пришли из облака (другое устройство): перечитываем настройки и статистику
window.addEventListener('pgsync-applied', (e) => {
  const k = e.detail && e.detail.key;
  if (k === 'sudokuStats') stats = readStats(); else if (k === 'sudokuPrefs') { prefs = readPrefs(); if (S) render(); } else if (k === 'sudokuLevel') { try { const l = localStorage.getItem('sudokuLevel'); if (DIFF[l]) level = l; } catch (err) {} }
  if ($('game').classList.contains('hidden')) renderMenu();
});
if (window.PGSync) PGSync.mountRow($('sync-row'), true);

/* ---------- настройки ---------- */
$('open-prefs').onclick = () => {
  if ($('prefs-ov')) return; const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'prefs-ov';
  const rows = [['autoCheck', 'Показывать ошибки сразу', 'Неверная цифра подсвечивается красным, как только вы её поставили'], ['hlSame', 'Подсвечивать одинаковые цифры', 'Выберите клетку с цифрой — такие же цифры на поле выделятся'], ['hlPeers', 'Подсвечивать ряд, столбец и блок', 'Помогает не пропустить конфликт'], ['autoNotes', 'Убирать заметки автоматически', 'Когда вы ставите цифру, она пропадает из заметок соседних клеток']];
  function paint() {
    const th = window.PGS ? PGS.THEMES : {}, cur = window.PGS ? PGS.get().board : 'classic';
    ov.innerHTML = `<div class="panel"><h3>Настройки</h3><div id="pg-theme-row"></div>${rows.map(([k, t, d]) => `<div class="srow"><div><b>${t}</b><span class="d">${d}</span></div><button class="sw ${prefs[k] ? 'on' : ''}" data-k="${k}"></button></div>`).join('')}
      <div style="padding:14px 24px 0;font-size:14px;font-weight:600">Оформление</div><div class="themes">${Object.entries(th).map(([k, t]) => `<button class="th ${cur === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
      <button class="big" id="prefs-close" style="width:calc(100% - 48px);margin:6px 24px 22px;box-shadow:none">Готово</button></div>`;
    ov.querySelectorAll('.sw').forEach((b) => { b.onclick = () => { prefs[b.dataset.k] = !prefs[b.dataset.k]; store(LS.prefs, prefs); paint(); render(); }; });
    ov.querySelectorAll('.th').forEach((b) => { b.onclick = () => { PGS.set({ board: b.dataset.b }); paint(); }; });
    if (window.PGS && PGS.mountThemeRow) PGS.mountThemeRow(ov.querySelector('#pg-theme-row'));
    $('prefs-close').onclick = () => ov.remove();
  }
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); }); document.body.appendChild(ov); paint();      // сначала в страницу, потом рисуем: иначе $() не найдёт кнопки панели
};

/* ---------- PWA и тестовые хуки ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('service-worker.js').catch(() => {});
window.__sdk = { get S() { return S; }, SDK, startNew, select, setDigit, erase, undo, redo, hint, check, fillNotes, toggleNotes, get prefs() { return prefs; }, get stats() { return stats; }, todayKey, showMenu, setPause };
renderMenu();
})();
</script>
</body>
</html>
