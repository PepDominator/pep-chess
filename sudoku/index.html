<style>
:root { --bg:#EEF0E7; --panel:#FBFBF8; --green:#3B5D4A; --navy:#2F3A56; --text:#2A2E24; --muted:#6E7568; --border:#D9DBCC; --sq-light:#F6F4EB; --sq-dark:#C7CAB4; --cell:52px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; }
body { font-family:'Noto Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; display:flex; justify-content:center; align-items:center; padding:12px; }
.serif { font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif; }
.hidden { display:none !important; }
button { font-family:inherit; }

/* ---------- меню ---------- */
.modal { position:relative; background:var(--k-panel); width:560px; max-width:calc(100vw - 24px); border:1px solid var(--border); box-shadow:0 18px 50px rgba(42,46,36,.10),0 2px 8px rgba(42,46,36,.06); padding-bottom:22px; }
.back-hub { position:absolute; top:14px; left:16px; font-size:12px; color:var(--muted); text-decoration:none; } .back-hub:hover { color:var(--text); }
.rec-btn { display:block; width:100%; margin:-2px 0 14px; padding:8px; background:none; border:1px dashed var(--border); color:var(--muted); font:600 13px inherit; cursor:pointer; } .rec-btn:hover { color:var(--text); background:var(--k-hover); }
.gear { position:absolute; top:10px; right:12px; background:none; border:none; font-size:20px; color:var(--k-mu2); cursor:pointer; padding:4px 8px; } .gear:hover { color:var(--text); background:var(--k-hover); }
.brand { text-align:center; font-size:13px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--green); padding-top:30px; display:flex; align-items:center; justify-content:center; gap:10px; }
.brand::before,.brand::after { content:''; width:24px; height:1px; background:var(--border); }
h2 { font-weight:400; font-style:italic; font-size:27px; margin:0; padding:8px 0 20px; text-align:center; }
.content { padding:0 28px; }
.title { font-size:13px; color:var(--muted); margin:18px 0 8px; text-align:center; }
.big { display:block; width:100%; padding:15px; border:none; font-size:16px; font-weight:700; cursor:pointer; background:var(--green); color:#fff; box-shadow:0 6px 16px rgba(59,93,74,.25); } .big:hover { filter:brightness(1.08); }
.big.alt { background:var(--navy); box-shadow:0 6px 16px rgba(47,58,86,.22); margin-top:10px; }
.big.light { background:var(--k-surf); color:var(--text); box-shadow:none; border:1px solid var(--border); margin-top:10px; font-size:14px; padding:12px; }
.levels { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); background:var(--k-surf); }
.levels button { border:none; border-right:1px solid var(--border); background:none; padding:11px 0; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; } .levels button:last-child { border-right:none; }
.levels button.on { background:var(--green); color:#fff; } .levels button:hover:not(.on) { background:var(--k-hover); }
.card { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border); background:var(--k-surf); padding:12px 14px; margin-bottom:10px; }
.card b { font-size:15px; } .card small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.card button { background:var(--navy); color:#fff; border:none; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; } .card button:hover { filter:brightness(1.12); }
.stats { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px; } .stats th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 6px; } .stats td { padding:6px; border-top:1px solid var(--border); } .stats td:not(:first-child), .stats th:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.ver { font-size:11px; color:var(--k-mu2); text-align:center; margin-top:14px; }

/* ---------- игра ---------- */
#game { display:flex; gap:22px; align-items:flex-start; justify-content:center; width:100%; }
#left { display:flex; flex-direction:column; align-items:stretch; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px 10px; }
.topbar .lv { font-weight:700; font-size:14px; } .topbar .lv small { color:var(--muted); font-weight:400; margin-left:6px; }
.tb { background:none; border:1px solid var(--border); background:var(--k-panel); color:var(--text); padding:6px 11px; font-size:13px; font-weight:600; cursor:pointer; } .tb:hover { background:var(--k-hover); }
#timer { font-family:'Roboto Mono',ui-monospace,Menlo,monospace; font-size:20px; letter-spacing:1px; min-width:64px; text-align:center; }
#board-wrap { position:relative; width:calc(var(--cell)*var(--sz,9) + 4px); height:calc(var(--cell)*var(--sz,9) + 4px); border:2px solid #2A2E24; background:#2A2E24; box-shadow:0 2px 14px rgba(42,46,36,.14); }
#sboard { display:grid; grid-template-columns:repeat(var(--sz,9),var(--cell)); grid-template-rows:repeat(var(--sz,9),var(--cell)); gap:0; user-select:none; touch-action:manipulation; }
.cell { position:relative; width:var(--cell); height:var(--cell); background:var(--sq-light); border-right:1px solid var(--k-line2); border-bottom:1px solid var(--k-line2); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.cell.alt { background:color-mix(in srgb, var(--sq-dark) 40%, var(--sq-light)); }
.cell.br { border-right:2px solid #2A2E24; } .cell.bb { border-bottom:2px solid #2A2E24; } html:not([data-sz="12"]) .cell:nth-child(9n) { border-right:none; } html:not([data-sz="12"]) .cell:nth-child(n+73) { border-bottom:none; }
html[data-sz="12"] .cell:nth-child(12n) { border-right:none; } html[data-sz="12"] .cell:nth-child(n+133) { border-bottom:none; }      /* у края поля — без внутренней линии; для каждого размера своё */
.cell .v { font-size:calc(var(--cell)*.58); line-height:1; font-weight:500; color:var(--navy); pointer-events:none; }
.cell.given .v { color:var(--k-tx); font-weight:700; }
.cell.peer { background:color-mix(in srgb, var(--k-acc) 14%, var(--sq-light)); } .cell.alt.peer { background:color-mix(in srgb, var(--k-acc) 14%, color-mix(in srgb, var(--sq-dark) 40%, var(--sq-light))); }
.cell.same { background:color-mix(in srgb, #2F3A56 24%, var(--sq-light)) !important; }
.cell.sel { background:color-mix(in srgb, #C49A36 58%, var(--sq-light)) !important; }
.cell.wrong { background:color-mix(in srgb, #A23B33 24%, var(--sq-light)) !important; } .cell.wrong .v { color:var(--k-rt); }
.cell.hinted .v { color:var(--green); }
.cell .notes { position:absolute; inset:2px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); pointer-events:none; }
.cell .notes i { font-style:normal; font-size:calc(var(--cell)*.22); line-height:1; color:var(--k-mu); display:flex; align-items:center; justify-content:center; }
.cell.flash { animation:flash .6s; } @keyframes flash { 0%,100% { filter:none; } 50% { filter:brightness(1.18); } }
#pause-ov { position:absolute; inset:0; background:rgba(253,253,250,.97); display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; cursor:pointer; font-size:18px; z-index:5; }
#pause-ov small { color:var(--muted); font-size:13px; }
#right { width:320px; display:flex; flex-direction:column; gap:12px; }
.stat-row { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); } .stat-row b { color:var(--text); }
.tools { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.tool { background:var(--k-panel); border:1px solid var(--border); padding:8px 0 6px; cursor:pointer; font-size:11.5px; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }
.tool span.i { font-size:19px; line-height:1; } .tool:hover { background:var(--k-hover); } .tool.on { background:var(--green); color:#fff; border-color:var(--green); } .tool:disabled { opacity:.35; cursor:default; }
.tool .bd { position:absolute; top:2px; right:4px; font-size:10.5px; font-weight:700; color:var(--muted); } .tool.on .bd { color:#fff; }
#pad { display:grid; grid-template-columns:repeat(var(--padcols,9),1fr); gap:5px; }
html[data-sz="12"] .cell .notes { grid-template-columns:repeat(4,1fr); column-gap:2px; inset:1px 2px; } html[data-sz="12"] .cell .notes i { font-size:calc(var(--cell)*.2); } html[data-sz="12"] .cell .v { font-size:calc(var(--cell)*.48); letter-spacing:-.04em; }
.sizes { display:flex; gap:6px; margin-bottom:10px; } .sizes button { flex:1; }
#pad button { position:relative; background:var(--k-panel); border:1px solid var(--border); font-size:calc(var(--cell)*.5); font-weight:500; color:var(--navy); padding:0; height:calc(var(--cell)*1.05); cursor:pointer; touch-action:manipulation; }
#pad button:hover { background:var(--k-hover); } #pad button:disabled { opacity:.25; cursor:default; }
#pad button small { position:absolute; bottom:1px; right:3px; font-size:10px; color:var(--muted); font-weight:600; }
#pad.notes button { background:#FBF3D6; border-color:#D9C58E; font-size:calc(var(--cell)*.4); font-style:italic; } .tool { line-height:1.15; text-align:center; }
#t-view.on { background:var(--k-warm); border-color:#C49A36; color:var(--text); }
.card.offer { background:#FBF3D6; border-color:#D9C58E; } .cell.tutmark { box-shadow:inset 0 0 0 3px #E0A82E; } .cell.tutblock { background-image:repeating-linear-gradient(45deg, rgba(170,70,60,.22) 0 4px, transparent 4px 8px); } :root[data-theme="dark"] .card.offer { background:#33301F; border-color:#6B5E33; }
#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2F3A56; color:#fff; padding:10px 18px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .25s; z-index:300; } #toast.on { opacity:1; }
.ov { position:fixed; inset:0; z-index:200; background:rgba(42,46,36,.4); display:flex; align-items:center; justify-content:center; padding:16px; }
.win { background:var(--k-panel); border:1px solid var(--border); width:100%; max-width:380px; text-align:center; padding:28px 26px 24px; box-shadow:0 30px 80px rgba(42,46,36,.3); animation:pop .35s cubic-bezier(.3,1.4,.5,1) both; } @keyframes pop { from { transform:scale(.85); opacity:0; } }
.win h3 { margin:0 0 4px; font:italic 400 30px Georgia,serif; } .win .big-t { font-family:'Roboto Mono',monospace; font-size:38px; font-weight:700; margin:10px 0 4px; }
.win .sub { color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:16px; }
.panel { background:var(--k-panel); border:1px solid var(--border); width:100%; max-width:400px; box-shadow:0 30px 80px rgba(42,46,36,.3); max-height:calc(100dvh - 32px); overflow-y:auto; }      /* окно настроек выше экрана — прокручивается, «Готово» всегда достижимо */
.panel h3 { margin:0; padding:20px 24px 6px; font:italic 400 24px Georgia,serif; }
.srow { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 24px; border-bottom:1px solid var(--k-line); } .srow b { font-size:14px; font-weight:600; display:block; } .srow span.d { font-size:12px; color:var(--muted); display:block; margin-top:2px; }
.sw { width:44px; height:24px; flex-shrink:0; background:var(--k-line2); border:none; position:relative; cursor:pointer; padding:0; } .sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:var(--k-panel); transition:transform .15s; } .sw.on { background:var(--green); } .sw.on::after { transform:translateX(20px); }
.themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 24px 14px; } .th { border:2px solid transparent; background:none; padding:4px; cursor:pointer; font-size:11.5px; color:var(--muted); } .th.on { border-color:var(--green); color:var(--text); font-weight:700; } .th i { display:block; aspect-ratio:1/1; margin-bottom:4px; box-shadow:0 0 0 1px rgba(42,46,36,.15); }
.loading { position:fixed; inset:0; z-index:250; background:rgba(238,240,231,.9); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-size:15px; color:var(--muted); }
.loading::before { content:''; width:34px; height:34px; border-radius:50%; border:3px solid var(--k-line); border-top-color:var(--k-acc); animation:spin .8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }

@media (max-width:820px) {
  body { align-items:flex-start; padding:8px; }
  #game { flex-direction:column; align-items:center; gap:10px; }
  #right { width:max(calc(var(--cell)*var(--sz,9) + 4px), min(calc(100vw - 16px), 380px)); }
  #pad { gap:3px; } #pad button { height:max(calc(var(--cell)*1.05), 46px); }
  .content { padding:0 16px; }
}
/*PGDARK-VARS*/
:root{--k-bg:#EEF0E7;--k-panel:#FDFDFA;--k-surf:#F3F2EA;--k-hover:#EAEADF;--k-line:#D9DBCC;--k-line2:#B7BAA5;--k-tx:#2A2E24;--k-mu:#6E7568;--k-mu2:#9A9D8E;--k-gt:#3B5D4A;--k-rt:#A23B33;--k-nt:#2F3A56;--k-warm:#F3EEDD;--k-acc:#3B5D4A;color-scheme:light}
html[data-theme="dark"]{--k-bg:#131815;--k-panel:#1C221E;--k-surf:#252C27;--k-hover:#2E372F;--k-line:#39443C;--k-line2:#4D5A50;--k-tx:#E5E9DE;--k-mu:#A5AC9B;--k-mu2:#7E8677;--k-gt:#8CC3A0;--k-rt:#E8887E;--k-nt:#A9B9E0;--k-warm:#2B291E;--k-acc:#3B5D4A;--bg:#131815;--panel:#1C221E;--side-bg:#1C221E;--text:#E5E9DE;--muted:#A5AC9B;--ink-muted:#A5AC9B;--border:#39443C;--highlight:#2B3A2E;--green2:#8CC3A0;color-scheme:dark}

/* кнопки-переключатели и «светлые острова» в тёмной теме */
html[data-theme="dark"] .pg-sw::after, html[data-theme="dark"] .sw::after, html[data-theme="dark"] .toggle::after { background:#F1F3EA !important; }
html[data-theme="dark"] img.piece, html[data-theme="dark"] .piece img { filter:none; }
html[data-theme="dark"] ::selection { background:#3E6B52; color:#fff; }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { color-scheme:dark; }
/* судоку: тёмные клетки вместо палитры светлой доски */
html[data-theme="dark"] .cell { background:#1F2622; border-right-color:#38443B; border-bottom-color:#38443B; }
html[data-theme="dark"] .cell.alt { background:#262E29; }
html[data-theme="dark"] .cell.peer { background:color-mix(in srgb, #4C7A5C 34%, #1F2622); }
html[data-theme="dark"] .cell.alt.peer { background:color-mix(in srgb, #4C7A5C 34%, #262E29); }
html[data-theme="dark"] .cell.same { background:color-mix(in srgb, #5878B8 42%, #1F2622) !important; }
html[data-theme="dark"] .cell.sel { background:color-mix(in srgb, #C49A36 46%, #1F2622) !important; }
html[data-theme="dark"] .cell.wrong { background:color-mix(in srgb, #C0463C 48%, #1F2622) !important; }
/* кроссворд */
html[data-theme="dark"] .c.l { background:#222A25; border-color:rgba(229,233,222,.38); box-shadow:0 1px 1px rgba(0,0,0,.4); }
html[data-theme="dark"] .c.l.aw { background:color-mix(in srgb, #C49A36 30%, #222A25); border-color:rgba(214,180,90,.6); }
html[data-theme="dark"] .c.l.ac { background:color-mix(in srgb, #C49A36 56%, #222A25); box-shadow:0 0 0 2px #8CC3A0, 0 2px 4px rgba(0,0,0,.45); }
html[data-theme="dark"] .c.l.bad { background:color-mix(in srgb, #C0463C 46%, #222A25); }
html[data-theme="dark"] { --navy:#5B76B8; }
html[data-theme="dark"] .cell .v, html[data-theme="dark"] .c.l .ch { color:#9DB4EE; }
html[data-theme="dark"] .cell.given .v { color:#EEF1E6; font-weight:700; }
html[data-theme="dark"] .cell.wrong .v { color:#FF9A8E; }
html[data-theme="dark"] .cell.hinted .v { color:#8CC3A0; }
html[data-theme="dark"] #pad button, html[data-theme="dark"] #kb button { background:#252C27; border-color:#39443C; color:#CBD6F2; }
html[data-theme="dark"] #pad button:disabled, html[data-theme="dark"] #kb button:disabled { color:#5A6760; }
html[data-theme="dark"] #minimap { background:rgba(28,34,30,.93); border-color:rgba(229,233,222,.45); box-shadow:0 4px 14px rgba(0,0,0,.5); }
/* шахматная и шашечная доски чуть приглушены, чтобы не слепили */
html[data-theme="dark"] #board, html[data-theme="dark"] .board, html[data-theme="dark"] #chessboard { filter:brightness(.86) contrast(1.02); }
/* кружок «чёрных» шашек и подобные тёмные значки не должны сливаться с тёмным фоном */
html[data-theme="dark"] .side i.b { box-shadow:0 0 0 1px #6B766D; }

<script type="text/plain" id="sdk-engine">
// ============ Судоку: движок (генерация, решатель, оценка сложности) ============
// Сложность определяется тем, какие приёмы нужны человеку:
//  1 «Легко»   — только одиночки (в клетке один кандидат)
//  2 «Средне»  — нужны скрытые одиночки (цифра возможна только в одной клетке ряда/столбца/блока)
//  3 «Сложно»  — нужны пары, «указующие» пары/тройки и взаимодействие блока и линии
//  4 «Эксперт» — перечисленных приёмов недостаточно (нужны более сложные)
// Один движок для полей разного размера: N×N, блок BR строк × BC столбцов (9×9 — блоки 3×3, 12×12 — блоки 3×4).
function makeSDK(N, BR, BC) {
  const C = N * N, FULL = (1 << N) - 1, BPR = N / BC;          // клеток, маска «все цифры», блоков в ряду
  const ROW = new Int8Array(C), COL = new Int8Array(C), BOX = new Int8Array(C);
  for (let i = 0; i < C; i++) { ROW[i] = (i / N) | 0; COL[i] = i % N; BOX[i] = ((ROW[i] / BR) | 0) * BPR + ((COL[i] / BC) | 0); }
  const UNITS = [];
  for (let r = 0; r < N; r++) UNITS.push(Array.from({ length: N }, (_, c) => r * N + c));
  for (let c = 0; c < N; c++) UNITS.push(Array.from({ length: N }, (_, r) => r * N + c));
  for (let b = 0; b < N; b++) UNITS.push(Array.from({ length: N }, (_, k) => (((b / BPR) | 0) * BR + ((k / BC) | 0)) * N + (b % BPR) * BC + (k % BC)));
  const PEERS = Array.from({ length: C }, (_, i) => { const s = new Set(); for (const u of UNITS) if (u.includes(i)) u.forEach((j) => j !== i && s.add(j)); return Array.from(s); });
  const POP = new Int8Array(FULL + 1); for (let m = 1; m <= FULL; m++) POP[m] = POP[m >> 1] + (m & 1);

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

  // Считает решения (до limit). rnd — случайный порядок перебора цифр (для генерации полного поля).
  function solveCount(grid, limit, rnd) {
    const rows = new Int16Array(N), cols = new Int16Array(N), boxes = new Int16Array(N), cells = Array.from(grid);
    for (let i = 0; i < C; i++) { const v = cells[i]; if (v) { const b = 1 << (v - 1); if ((rows[ROW[i]] | 0) & b || (cols[COL[i]] | 0) & b || (boxes[BOX[i]] | 0) & b) return { count: 0, solution: null }; rows[ROW[i]] |= b; cols[COL[i]] |= b; boxes[BOX[i]] |= b; } }
    let count = 0, first = null;
    function rec() {
      let best = -1, bestMask = 0, bestN = N + 1;
      for (let i = 0; i < C; i++) if (!cells[i]) { const m = ~(rows[ROW[i]] | cols[COL[i]] | boxes[BOX[i]]) & FULL, n = POP[m]; if (n < bestN) { bestN = n; best = i; bestMask = m; if (n <= 1) break; } }
      if (best < 0) { count++; if (!first) first = cells.slice(); return count >= limit; }
      if (bestN === 0) return false;
      const digits = []; for (let d = 0; d < N; d++) if ((bestMask >> d) & 1) digits.push(d + 1);
      if (rnd) shuffle(digits, rnd);
      for (const d of digits) {
        const b = 1 << (d - 1); cells[best] = d; rows[ROW[best]] |= b; cols[COL[best]] |= b; boxes[BOX[best]] |= b;
        if (rec()) return true;
        cells[best] = 0; rows[ROW[best]] &= ~b; cols[COL[best]] &= ~b; boxes[BOX[best]] &= ~b;
      }
      return false;
    }
    rec(); return { count, solution: first };
  }

  // Кандидаты каждой клетки (битовые маски) для текущего поля
  function candidates(grid) {
    const cand = new Array(C).fill(0);
    for (let i = 0; i < C; i++) if (!grid[i]) { let m = FULL; for (const p of PEERS[i]) if (grid[p]) m &= ~(1 << (grid[p] - 1)); cand[i] = m; }
    return cand;
  }
  const digitOf = (m) => 32 - Math.clz32(m);          // единственный бит маски -> цифра

  // «Человеческий» решатель: возвращает { solved, level } — какой самый сложный приём понадобился
  function logic(grid) {
    const g = Array.from(grid), cand = candidates(g); let level = 1;
    const place = (i, d) => { g[i] = d; cand[i] = 0; const b = ~(1 << (d - 1)); for (const p of PEERS[i]) cand[p] &= b; };
    const remove = (i, mask) => { const had = cand[i] & mask; if (had) cand[i] &= ~mask; return !!had; };
    for (;;) {
      let progress = false;
      for (let i = 0; i < C; i++) { if (!g[i]) { if (cand[i] === 0) return { solved: false, level: 9 }; if (POP[cand[i]] === 1) { place(i, digitOf(cand[i])); progress = true; } } }
      if (progress) continue;
      for (const u of UNITS) for (let d = 1; d <= N; d++) {
        const bit = 1 << (d - 1); let where = -1, n = 0;
        for (const i of u) if (!g[i] && (cand[i] & bit)) { n++; where = i; }
        if (n === 1) { place(where, d); level = Math.max(level, 2); progress = true; }
      }
      if (progress) continue;
      // уровень 3: пары, указующие пары, блок-линия
      let did = false;
      for (const u of UNITS) {
        const two = u.filter((i) => !g[i] && POP[cand[i]] === 2);
        for (let a = 0; a < two.length; a++) for (let b = a + 1; b < two.length; b++) if (cand[two[a]] === cand[two[b]]) {
          for (const i of u) if (!g[i] && i !== two[a] && i !== two[b] && remove(i, cand[two[a]])) did = true;
        }
      }
      for (let b = 0; b < N; b++) for (let d = 1; d <= N; d++) {                  // «указующие»: цифра блока лежит на одной линии
        const bit = 1 << (d - 1), cells = UNITS[2 * N + b].filter((i) => !g[i] && (cand[i] & bit)); if (cells.length < 2) continue;
        if (cells.every((i) => ROW[i] === ROW[cells[0]])) { for (const i of UNITS[ROW[cells[0]]]) if (BOX[i] !== b && !g[i] && remove(i, bit)) did = true; }
        if (cells.every((i) => COL[i] === COL[cells[0]])) { for (const i of UNITS[N + COL[cells[0]]]) if (BOX[i] !== b && !g[i] && remove(i, bit)) did = true; }
      }
      for (let l = 0; l < 2 * N; l++) for (let d = 1; d <= N; d++) {                 // блок-линия: цифра линии лежит в одном блоке
        const bit = 1 << (d - 1), cells = UNITS[l].filter((i) => !g[i] && (cand[i] & bit)); if (cells.length < 2) continue;
        if (cells.every((i) => BOX[i] === BOX[cells[0]])) { for (const i of UNITS[2 * N + BOX[cells[0]]]) if (!UNITS[l].includes(i) && !g[i] && remove(i, bit)) did = true; }
      }
      if (did) { level = Math.max(level, 3); continue; }
      break;
    }
    const solved = g.every((v) => v);
    return { solved, level: solved ? level : 4 };
  }

  // сколько подсказок оставлять (нижняя граница) и какой приём нужен; для 12×12 — свои числа (поле 144 клетки)
  const TARGET = N === 9 ? { easy: { lvl: 1, floor: 38 }, medium: { lvl: 2, floor: 32 }, hard: { lvl: 3, floor: 28 }, expert: { lvl: 4, floor: 22 } }
    : { easy: { lvl: 1, floor: 70 }, medium: { lvl: 2, floor: 58 }, hard: { lvl: 3, floor: 50 } };
  // Генерирует головоломку нужной сложности. rnd — генератор случайных чисел (для «судоку дня» — по дате).
  function makePuzzle(difficulty, rnd, maxAttempts) {
    const T = TARGET[difficulty] || TARGET.medium; let best = null;
    for (let attempt = 0; attempt < (maxAttempts || 40); attempt++) {
      const full = solveCount(new Array(C).fill(0), 1, rnd).solution, grid = full.slice(), order = shuffle(Array.from({ length: C }, (_, i) => i), rnd); let clues = C;
      const floor = T.floor + (T.lvl < 4 ? ((rnd() * 3) | 0) - 1 : 0);        // небольшой разброс числа подсказок
      for (const i of order) {
        if (clues <= floor) break;
        const v = grid[i]; grid[i] = 0;
        if (solveCount(grid, 2).count !== 1) { grid[i] = v; continue; }
        if (T.lvl < 4) { const r = logic(grid); if (!r.solved || r.level > T.lvl) { grid[i] = v; continue; } }
        clues--;
      }
      const r = logic(grid), level = r.solved ? r.level : 4, res = N === 9 ? { puzzle: grid.join(''), solution: full.join(''), clues, level, difficulty, attempts: attempt + 1 }
        : { puzzle: grid.slice(), solution: full.slice(), clues, level, difficulty, attempts: attempt + 1, size: N };      // 12×12: массивы (числа больше 9)
      if (level === T.lvl) return res;
      if (!best || Math.abs(level - T.lvl) < Math.abs(best.level - T.lvl)) best = res;
    }
    best.approx = true; return best;
  }

  // Следующий логический шаг для подсказки: { i, d, kind } или null
  function nextStep(grid) {
    const cand = candidates(grid);
    for (let i = 0; i < C; i++) if (!grid[i] && POP[cand[i]] === 1) return { i, d: digitOf(cand[i]), kind: 'single' };
    for (const u of UNITS) for (let d = 1; d <= N; d++) { const bit = 1 << (d - 1); let where = -1, n = 0; for (const i of u) if (!grid[i] && (cand[i] & bit)) { n++; where = i; } if (n === 1) return { i: where, d, kind: 'hidden' }; }
    return null;
  }

  return { N, BR, BC, C, ROW, COL, BOX, UNITS, PEERS, POP, mulberry32, shuffle, solveCount, candidates, logic, makePuzzle, nextStep, TARGET };
}
var SDK = makeSDK(9, 3, 3);              // обычное судоку — как и было (судоку дня у всех то же)
var SDK12 = makeSDK(12, 3, 4);           // 12×12: цифры 1–12, блоки 3 строки × 4 столбца
SDK.v12 = SDK12;
if (typeof module !== 'undefined') module.exports = SDK;

</script>
<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const { SDK, SDK12 } = new Function($('sdk-engine').textContent + '\nreturn { SDK, SDK12 };')();      // 9×9 и 12×12
const BUILD = '2.10.2 · 9 ноября 2026';
const DIFF = { easy: 'Легко', medium: 'Средне', hard: 'Сложно', expert: 'Эксперт' };
const HINTS = { easy: 'Хватает «одиночек»: в клетке остаётся единственная цифра.', medium: 'Понадобятся «скрытые одиночки» — цифра, которая возможна только в одной клетке ряда, столбца или блока.', hard: 'Нужны пары, «указующие» пары и взаимодействие блоков и линий.', expert: 'Простых приёмов не хватит. Только для опытных.' };
const LS = { save: 'sudokuSave', stats: 'sudokuStats', prefs: 'sudokuPrefs' };
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const readPrefs = () => Object.assign({ autoCheck: true, hlSame: true, hlPeers: true, autoNotes: true, showNotes: true }, load(LS.prefs, {}));
let prefs = readPrefs();
const readStats = () => { const s = load(LS.stats, {}); s.solved = Object.assign({ easy: 0, medium: 0, hard: 0, expert: 0 }, s.solved); s.best = s.best || {}; s.daily = Object.assign({ last: null, streak: 0, results: {} }, s.daily); return s; };
let stats = readStats();
let S = null, level = 'medium', lastTick = 0;
$('ver').textContent = 'Версия ' + BUILD;

const pad2 = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const dayBefore = (key) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d - 1)); };
const fmt = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s % 60); };
let toastT = null; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }

/* ---------- размеры ---------- */
function resize() {
  const stacked = innerWidth <= 820, availW = stacked ? innerWidth - 20 : innerWidth - 24 - 340, availH = stacked ? innerHeight - 20 - 52 - 250 : innerHeight - 24 - 52;
  const n = curSz || 9, cell = Math.max(n === 12 ? 26 : 30, Math.floor(Math.min((stacked ? innerWidth - 24 : availW - 6) / n, (availH - 8) / n, n === 12 ? 52 : 62)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
addEventListener('resize', resize);

/* ---------- построение поля ---------- */
const cells = []; let curSz = 0;
const eng = (sz) => ((sz || (S && S.size) || 9) === 12 ? SDK12 : SDK);      // движок текущего размера
function buildBoard(sz) {
  if (curSz === sz && cells.length) return; curSz = sz; const E = eng(sz), b = $('sboard'), pad = $('pad'); b.innerHTML = ''; pad.innerHTML = ''; cells.length = 0;
  document.documentElement.style.setProperty('--sz', sz); document.documentElement.style.setProperty('--padcols', sz === 12 ? 6 : 9); document.documentElement.dataset.sz = sz;
  for (let i = 0; i < sz * sz; i++) {
    const r = E.ROW[i], c = E.COL[i], d = document.createElement('div');
    d.className = 'cell' + ((((r / E.BR) | 0) + ((c / E.BC) | 0)) % 2 ? ' alt' : '') + (c % E.BC === E.BC - 1 && c < sz - 1 ? ' br' : '') + (r % E.BR === E.BR - 1 && r < sz - 1 ? ' bb' : '');
    d.innerHTML = '<span class="v"></span><div class="notes">' + '<i></i>'.repeat(sz) + '</div>';

    { text: '', target: () => unionRect(cellsAt(rowIdx(nr).concat(colIdx(nc), boxIdx(nb)))), enter: () => { clearTutMarks(); const b = document.querySelector('#pgt .pgt-t'); if (b) b.innerHTML = `Второй приём — <b>«что подходит в клетку»</b>. Посмотрите на клетку на пересечении подсвеченных строки и столбца. В её строке уже есть: ${listOf(rowIdx(nr))}. В столбце: ${listOf(colIdx(nc))}. В квадрате: ${listOf(boxIdx(nb))}. Какой цифры нет нигде? Её и ставьте.`; select(N); }, done: () => S.val[N] === S.sol[N], demo: (h) => demoDigit(h, N, S.sol[N]) },
    { text: '', target: () => rectOf(cells[P]), enter: () => { select(P); const b = document.querySelector('#pgt .pgt-t'); if (b) b.innerHTML = `А вот здесь точно сказать нельзя: в выделенную клетку подходят <b>две</b> цифры — ${candsOf(P).join(' и ')}. <b>Не угадывайте!</b> Включите «Писать заметки» и отметьте обе цифры маленькими — это напоминание себе.`; }, done: () => candsOf(P).every((d) => S.notes[P] & (1 << (d - 1))), demo: async (h) => { await h.path([centerOf($('t-notes')), centerOf(cells[P])].concat(candsOf(P).map((d) => centerOf(padBtn(d)))), (k) => { if (k === 0 && !S.notesMode) toggleNotes(); if (k === 1) select(P); if (k >= 2) setDigit(candsOf(P)[k - 2]); }); } },
