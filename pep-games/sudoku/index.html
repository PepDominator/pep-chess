:root { --bg:#EEF0E7; --panel:#FBFBF8; --green:#3B5D4A; --navy:#2F3A56; --text:#2A2E24; --muted:#6E7568; --border:#D9DBCC; --sq-light:#F6F4EB; --sq-dark:#C7CAB4; --cell:52px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; }
body { font-family:'Noto Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; display:flex; justify-content:center; align-items:center; padding:12px; }
.serif { font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif; }
.hidden { display:none !important; }
button { font-family:inherit; }

/* ---------- меню ---------- */
.modal { position:relative; background:var(--k-panel); width:560px; max-width:calc(100vw - 24px); border:1px solid var(--border); box-shadow:0 18px 50px rgba(42,46,36,.10),0 2px 8px rgba(42,46,36,.06); padding-bottom:22px; }
.back-hub { position:absolute; top:14px; left:16px; font-size:12px; color:var(--muted); text-decoration:none; } .back-hub:hover { color:var(--text); }
.rec-btn { display:block; width:100%; margin:-2px 0 14px; padding:8px; background:none; border:1px dashed var(--border); color:var(--muted); font:600 13px inherit; cursor:pointer; } .rec-btn:hover { color:var(--text); background:var(--k-hover); }
.gear { position:absolute; top:10px; right:12px; background:none; border:none; font-size:20px; color:var(--k-mu2); cursor:pointer; padding:4px 8px; } .gear:hover { color:var(--text); background:var(--k-hover); }
.brand { text-align:center; font-size:13px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--green); padding-top:30px; display:flex; align-items:center; justify-content:center; gap:10px; }
.brand::before,.brand::after { content:''; width:24px; height:1px; background:var(--border); }
h2 { font-weight:400; font-style:italic; font-size:27px; margin:0; padding:8px 0 20px; text-align:center; }
.content { padding:0 28px; }
.title { font-size:13px; color:var(--muted); margin:18px 0 8px; text-align:center; }
.big { display:block; width:100%; padding:15px; border:none; font-size:16px; font-weight:700; cursor:pointer; background:var(--green); color:#fff; box-shadow:0 6px 16px rgba(59,93,74,.25); } .big:hover { filter:brightness(1.08); }
.big.alt { background:var(--navy); box-shadow:0 6px 16px rgba(47,58,86,.22); margin-top:10px; }
.big.light { background:var(--k-surf); color:var(--text); box-shadow:none; border:1px solid var(--border); margin-top:10px; font-size:14px; padding:12px; }
.levels { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid var(--border); background:var(--k-surf); }
.levels button { border:none; border-right:1px solid var(--border); background:none; padding:11px 0; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; } .levels button:last-child { border-right:none; }
.levels button.on { background:var(--green); color:#fff; } .levels button:hover:not(.on) { background:var(--k-hover); }
.card { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border); background:var(--k-surf); padding:12px 14px; margin-bottom:10px; }
.card b { font-size:15px; } .card small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.card button { background:var(--navy); color:#fff; border:none; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; } .card button:hover { filter:brightness(1.12); }
.stats { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px; } .stats th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 6px; } .stats td { padding:6px; border-top:1px solid var(--border); } .stats td:not(:first-child), .stats th:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.ver { font-size:11px; color:var(--k-mu2); text-align:center; margin-top:14px; }

/* ---------- игра ---------- */
#game { display:flex; gap:22px; align-items:flex-start; justify-content:center; width:100%; }
#left { display:flex; flex-direction:column; align-items:stretch; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px 10px; }
.topbar .lv { font-weight:700; font-size:14px; } .topbar .lv small { color:var(--muted); font-weight:400; margin-left:6px; }
.tb { background:none; border:1px solid var(--border); background:var(--k-panel); color:var(--text); padding:6px 11px; font-size:13px; font-weight:600; cursor:pointer; } .tb:hover { background:var(--k-hover); }
#timer { font-family:'Roboto Mono',ui-monospace,Menlo,monospace; font-size:20px; letter-spacing:1px; min-width:64px; text-align:center; }
#board-wrap { position:relative; width:calc(var(--cell)*9 + 4px); height:calc(var(--cell)*9 + 4px); border:2px solid #2A2E24; background:#2A2E24; box-shadow:0 2px 14px rgba(42,46,36,.14); }
#sboard { display:grid; grid-template-columns:repeat(9,var(--cell)); grid-template-rows:repeat(9,var(--cell)); gap:0; user-select:none; touch-action:manipulation; }
.cell { position:relative; width:var(--cell); height:var(--cell); background:var(--sq-light); border-right:1px solid var(--k-line2); border-bottom:1px solid var(--k-line2); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.cell.alt { background:color-mix(in srgb, var(--sq-dark) 40%, var(--sq-light)); }
.cell.br { border-right:2px solid #2A2E24; } .cell.bb { border-bottom:2px solid #2A2E24; } .cell:nth-child(9n) { border-right:none; } .cell:nth-child(n+73) { border-bottom:none; }
.cell .v { font-size:calc(var(--cell)*.58); line-height:1; font-weight:500; color:var(--navy); pointer-events:none; }
.cell.given .v { color:var(--k-tx); font-weight:700; }
.cell.peer { background:color-mix(in srgb, #3B5D4A 14%, var(--sq-light)); } .cell.alt.peer { background:color-mix(in srgb, #3B5D4A 14%, color-mix(in srgb, var(--sq-dark) 40%, var(--sq-light))); }
.cell.same { background:color-mix(in srgb, #2F3A56 24%, var(--sq-light)) !important; }
.cell.sel { background:color-mix(in srgb, #C49A36 58%, var(--sq-light)) !important; }
.cell.wrong { background:color-mix(in srgb, #A23B33 24%, var(--sq-light)) !important; } .cell.wrong .v { color:var(--k-rt); }
.cell.hinted .v { color:var(--green); }
.cell .notes { position:absolute; inset:2px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); pointer-events:none; }
.cell .notes i { font-style:normal; font-size:calc(var(--cell)*.22); line-height:1; color:var(--k-mu); display:flex; align-items:center; justify-content:center; }
.cell.flash { animation:flash .6s; } @keyframes flash { 0%,100% { filter:none; } 50% { filter:brightness(1.18); } }
#pause-ov { position:absolute; inset:0; background:rgba(253,253,250,.97); display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; cursor:pointer; font-size:18px; z-index:5; }
#pause-ov small { color:var(--muted); font-size:13px; }
#right { width:320px; display:flex; flex-direction:column; gap:12px; }
.stat-row { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); } .stat-row b { color:var(--text); }
.tools { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.tool { background:var(--k-panel); border:1px solid var(--border); padding:8px 0 6px; cursor:pointer; font-size:11.5px; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }
.tool span.i { font-size:19px; line-height:1; } .tool:hover { background:var(--k-hover); } .tool.on { background:var(--green); color:#fff; border-color:var(--green); } .tool:disabled { opacity:.35; cursor:default; }
.tool .bd { position:absolute; top:2px; right:4px; font-size:10.5px; font-weight:700; color:var(--muted); } .tool.on .bd { color:#fff; }
#pad { display:grid; grid-template-columns:repeat(9,1fr); gap:5px; }
#pad button { position:relative; background:var(--k-panel); border:1px solid var(--border); font-size:calc(var(--cell)*.5); font-weight:500; color:var(--navy); padding:0; height:calc(var(--cell)*1.05); cursor:pointer; touch-action:manipulation; }
#pad button:hover { background:var(--k-hover); } #pad button:disabled { opacity:.25; cursor:default; }
#pad button small { position:absolute; bottom:1px; right:3px; font-size:10px; color:var(--muted); font-weight:600; }
#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2F3A56; color:#fff; padding:10px 18px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .25s; z-index:300; } #toast.on { opacity:1; }
.ov { position:fixed; inset:0; z-index:200; background:rgba(42,46,36,.4); display:flex; align-items:center; justify-content:center; padding:16px; }
.win { background:var(--k-panel); border:1px solid var(--border); width:100%; max-width:380px; text-align:center; padding:28px 26px 24px; box-shadow:0 30px 80px rgba(42,46,36,.3); animation:pop .35s cubic-bezier(.3,1.4,.5,1) both; } @keyframes pop { from { transform:scale(.85); opacity:0; } }
.win h3 { margin:0 0 4px; font:italic 400 30px Georgia,serif; } .win .big-t { font-family:'Roboto Mono',monospace; font-size:38px; font-weight:700; margin:10px 0 4px; }
.win .sub { color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:16px; }
.panel { background:var(--k-panel); border:1px solid var(--border); width:100%; max-width:400px; box-shadow:0 30px 80px rgba(42,46,36,.3); }
.panel h3 { margin:0; padding:20px 24px 6px; font:italic 400 24px Georgia,serif; }
.srow { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 24px; border-bottom:1px solid var(--k-line); } .srow b { font-size:14px; font-weight:600; display:block; } .srow span.d { font-size:12px; color:var(--muted); display:block; margin-top:2px; }
.sw { width:44px; height:24px; flex-shrink:0; background:var(--k-line2); border:none; position:relative; cursor:pointer; padding:0; } .sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:var(--k-panel); transition:transform .15s; } .sw.on { background:var(--green); } .sw.on::after { transform:translateX(20px); }
.themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 24px 14px; } .th { border:2px solid transparent; background:none; padding:4px; cursor:pointer; font-size:11.5px; color:var(--muted); } .th.on { border-color:var(--green); color:var(--text); font-weight:700; } .th i { display:block; aspect-ratio:1/1; margin-bottom:4px; box-shadow:0 0 0 1px rgba(42,46,36,.15); }
.loading { position:fixed; inset:0; z-index:250; background:rgba(238,240,231,.9); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-size:15px; color:var(--muted); }
.loading::before { content:''; width:34px; height:34px; border-radius:50%; border:3px solid var(--k-line); border-top-color:#3B5D4A; animation:spin .8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }

@media (max-width:820px) {
  body { align-items:flex-start; padding:8px; }
  #game { flex-direction:column; align-items:center; gap:10px; }
  #right { width:max(calc(var(--cell)*9 + 4px), min(calc(100vw - 16px), 380px)); }
  #pad { gap:3px; } #pad button { height:max(calc(var(--cell)*1.05), 46px); }
  .content { padding:0 16px; }
}
/*PGDARK-VARS*/
:root{--k-bg:#EEF0E7;--k-panel:#FDFDFA;--k-surf:#F3F2EA;--k-hover:#EAEADF;--k-line:#D9DBCC;--k-line2:#B7BAA5;--k-tx:#2A2E24;--k-mu:#6E7568;--k-mu2:#9A9D8E;--k-gt:#3B5D4A;--k-rt:#A23B33;--k-nt:#2F3A56;--k-warm:#F3EEDD;color-scheme:light}
html[data-theme="dark"]{--k-bg:#131815;--k-panel:#1C221E;--k-surf:#252C27;--k-hover:#2E372F;--k-line:#39443C;--k-line2:#4D5A50;--k-tx:#E5E9DE;--k-mu:#A5AC9B;--k-mu2:#7E8677;--k-gt:#8CC3A0;--k-rt:#E8887E;--k-nt:#A9B9E0;--k-warm:#2B291E;--bg:#131815;--panel:#1C221E;--side-bg:#1C221E;--text:#E5E9DE;--muted:#A5AC9B;--ink-muted:#A5AC9B;--border:#39443C;--highlight:#2B3A2E;--green2:#8CC3A0;color-scheme:dark}

/* кнопки-переключатели и «светлые острова» в тёмной теме */
html[data-theme="dark"] .pg-sw::after, html[data-theme="dark"] .sw::after, html[data-theme="dark"] .toggle::after { background:#F1F3EA !important; }
html[data-theme="dark"] img.piece, html[data-theme="dark"] .piece img { filter:none; }
html[data-theme="dark"] ::selection { background:#3E6B52; color:#fff; }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { color-scheme:dark; }
/* судоку: тёмные клетки вместо палитры светлой доски */
html[data-theme="dark"] .cell { background:#1F2622; border-right-color:#38443B; border-bottom-color:#38443B; }
html[data-theme="dark"] .cell.alt { background:#262E29; }
html[data-theme="dark"] .cell.peer { background:color-mix(in srgb, #4C7A5C 34%, #1F2622); }
html[data-theme="dark"] .cell.alt.peer { background:color-mix(in srgb, #4C7A5C 34%, #262E29); }
html[data-theme="dark"] .cell.same { background:color-mix(in srgb, #5878B8 42%, #1F2622) !important; }
html[data-theme="dark"] .cell.sel { background:color-mix(in srgb, #C49A36 46%, #1F2622) !important; }
html[data-theme="dark"] .cell.wrong { background:color-mix(in srgb, #C0463C 48%, #1F2622) !important; }
/* кроссворд */
html[data-theme="dark"] .c.l { background:#222A25; border-color:rgba(229,233,222,.38); box-shadow:0 1px 1px rgba(0,0,0,.4); }
html[data-theme="dark"] .c.l.aw { background:color-mix(in srgb, #C49A36 30%, #222A25); border-color:rgba(214,180,90,.6); }
html[data-theme="dark"] .c.l.ac { background:color-mix(in srgb, #C49A36 56%, #222A25); box-shadow:0 0 0 2px #8CC3A0, 0 2px 4px rgba(0,0,0,.45); }
html[data-theme="dark"] .c.l.bad { background:color-mix(in srgb, #C0463C 46%, #222A25); }
html[data-theme="dark"] { --navy:#5B76B8; }
html[data-theme="dark"] .cell .v, html[data-theme="dark"] .c.l .ch { color:#9DB4EE; }
html[data-theme="dark"] .cell.given .v { color:#EEF1E6; font-weight:700; }
html[data-theme="dark"] .cell.wrong .v { color:#FF9A8E; }
html[data-theme="dark"] .cell.hinted .v { color:#8CC3A0; }
html[data-theme="dark"] #pad button, html[data-theme="dark"] #kb button { background:#252C27; border-color:#39443C; color:#CBD6F2; }
html[data-theme="dark"] #pad button:disabled, html[data-theme="dark"] #kb button:disabled { color:#5A6760; }
html[data-theme="dark"] #minimap { background:rgba(28,34,30,.93); border-color:rgba(229,233,222,.45); box-shadow:0 4px 14px rgba(0,0,0,.5); }
/* шахматная и шашечная доски чуть приглушены, чтобы не слепили */
html[data-theme="dark"] #board, html[data-theme="dark"] .board, html[data-theme="dark"] #chessboard { filter:brightness(.86) contrast(1.02); }
/* кружок «чёрных» шашек и подобные тёмные значки не должны сливаться с тёмным фоном */
html[data-theme="dark"] .side i.b { box-shadow:0 0 0 1px #6B766D; }
</style>
</head>

<div id="toast"></div>

<script type="text/plain" id="sdk-engine">
// ============ Судоку: движок (генерация, решатель, оценка сложности) ============
// Сложность определяется тем, какие приёмы нужны человеку:
//  1 «Легко»   — только одиночки (в клетке один кандидат)
//  2 «Средне»  — нужны скрытые одиночки (цифра возможна только в одной клетке ряда/столбца/блока)
//  3 «Сложно»  — нужны пары, «указующие» пары/тройки и взаимодействие блока и линии
//  4 «Эксперт» — перечисленных приёмов недостаточно (нужны более сложные)
var SDK = (function () {
  const ROW = new Int8Array(81), COL = new Int8Array(81), BOX = new Int8Array(81);
  for (let i = 0; i < 81; i++) { ROW[i] = (i / 9) | 0; COL[i] = i % 9; BOX[i] = ((((i / 27) | 0) * 3) + (((i % 9) / 3) | 0)); }
  const UNITS = [];
  for (let r = 0; r < 9; r++) UNITS.push(Array.from({ length: 9 }, (_, c) => r * 9 + c));
  for (let c = 0; c < 9; c++) UNITS.push(Array.from({ length: 9 }, (_, r) => r * 9 + c));
  for (let b = 0; b < 9; b++) UNITS.push(Array.from({ length: 9 }, (_, k) => (((b / 3) | 0) * 3 + ((k / 3) | 0)) * 9 + (b % 3) * 3 + (k % 3)));
  const PEERS = Array.from({ length: 81 }, (_, i) => { const s = new Set(); for (const u of UNITS) if (u.includes(i)) u.forEach((j) => j !== i && s.add(j)); return Array.from(s); });
  const POP = new Int8Array(512); for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);

  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }

  // Считает решения (до limit). rnd — случайный порядок перебора цифр (для генерации полного поля).
  function solveCount(grid, limit, rnd) {

  if (mv !== undefined) { e.preventDefault(); let i = S.sel < 0 ? 40 : S.sel; const r = SDK.ROW[i], c = SDK.COL[i]; if ((mv === -1 && c === 0) || (mv === 1 && c === 8) || (mv === -9 && r === 0) || (mv === 9 && r === 8)) return; select(i + mv); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); return; }
  const k = e.key.toLowerCase(); if (k === 'n' || k === 'т') toggleNotes(); else if (k === 'h' || k === 'р') hint(); else if (k === ' ') { e.preventDefault(); setPause(true); }
});
$('t-undo').onclick = undo; $('t-redo').onclick = redo; $('t-erase').onclick = erase; $('t-notes').onclick = toggleNotes; $('t-hint').onclick = hint; $('t-auto').onclick = fillNotes; $('t-check').onclick = check;

/* ---------- меню ---------- */
function openGame() { $('menu').classList.add('hidden'); $('game').classList.remove('hidden'); $('pause-ov').style.display = S.paused ? 'flex' : 'none'; $('pause-btn').textContent = S.paused ? 'Играть' : 'Пауза'; lastTick = performance.now(); resize(); render(); }
function showMenu() { if (S && !S.done) { persist(); } $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
$('menu-btn').onclick = showMenu;
function renderMenu() {
  const sv = load(LS.save, null), rc = $('resume-card');
  rc.classList.toggle('hidden', !sv);
  if (sv) { const filled = sv.val.filter(Boolean).length; $('resume-info').textContent = `${sv.daily ? 'Судоку дня' : DIFF[sv.diff]} · ${fmt(sv.time)} · заполнено ${filled} из 81`; }
  const tk = todayKey(), d = stats.daily;
  $('daily-info').innerHTML = d.results[tk] != null ? `Решено сегодня за ${fmt(d.results[tk])} ✓ · серия: ${d.streak}` : (d.streak && d.last === dayBefore(tk) ? `Не прерывайте серию: ${d.streak} дн. подряд` : 'Одна и та же головоломка для всех, каждый день новая');
  $('daily-btn').textContent = d.results[tk] != null ? 'Ещё раз' : 'Играть';
  $('level-hint').textContent = HINTS[level];
  document.querySelectorAll('#levels button').forEach((b) => b.classList.toggle('on', b.dataset.d === level));
  $('stats').innerHTML = '<tr><th>Сложность</th><th>Решено</th><th>Лучшее время</th></tr>' + Object.keys(DIFF).map((k) => `<tr><td>${DIFF[k]}</td><td>${stats.solved[k] || 0}</td><td>${stats.best[k] != null ? fmt(stats.best[k]) : '—'}</td></tr>`).join('');
}
document.querySelectorAll('#levels button').forEach((b) => { b.onclick = () => { level = b.dataset.d; try { localStorage.setItem('sudokuLevel', level); } catch (e) {} renderMenu(); }; });
$('new-btn').onclick = () => startNew(level, false);
$('daily-btn').onclick = () => startNew('medium', true);
$('resume-btn').onclick = () => { if (!resume()) renderMenu(); };
try { const l = localStorage.getItem('sudokuLevel'); if (DIFF[l]) level = l; } catch (e) {}
// Данные пришли из облака (другое устройство): перечитываем настройки и статистику
window.addEventListener('pgsync-applied', (e) => {
  const k = e.detail && e.detail.key;
  if (k === 'sudokuStats') stats = readStats(); else if (k === 'sudokuPrefs') { prefs = readPrefs(); if (S) render(); } else if (k === 'sudokuLevel') { try { const l = localStorage.getItem('sudokuLevel'); if (DIFF[l]) level = l; } catch (err) {} }
  if ($('game').classList.contains('hidden')) renderMenu();
});
if (window.PGSync) PGSync.mountRow($('sync-row'), true);

/* ---------- настройки ---------- */
$('open-prefs').onclick = () => {
  if ($('prefs-ov')) return; const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'prefs-ov';
  const rows = [['autoCheck', 'Показывать ошибки сразу', 'Неверная цифра подсвечивается красным, как только вы её поставили'], ['hlSame', 'Подсвечивать одинаковые цифры', 'Выберите клетку с цифрой — такие же цифры на поле выделятся'], ['hlPeers', 'Подсвечивать ряд, столбец и блок', 'Помогает не пропустить конфликт'], ['autoNotes', 'Убирать заметки автоматически', 'Когда вы ставите цифру, она пропадает из заметок соседних клеток']];
  function paint() {
    const th = window.PGS ? PGS.THEMES : {}, cur = window.PGS ? PGS.get().board : 'classic';
    ov.innerHTML = `<div class="panel"><h3>Настройки</h3><div id="pg-theme-row"></div><div id="pg-install-row"></div>${rows.map(([k, t, d]) => `<div class="srow"><div><b>${t}</b><span class="d">${d}</span></div><button class="sw ${prefs[k] ? 'on' : ''}" data-k="${k}"></button></div>`).join('')}
      <div style="padding:14px 24px 0;font-size:14px;font-weight:600">Оформление</div><div class="themes">${Object.entries(th).map(([k, t]) => `<button class="th ${cur === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
      <button class="big" id="prefs-close" style="width:calc(100% - 48px);margin:6px 24px 22px;box-shadow:none">Готово</button></div>`;
    ov.querySelectorAll('.sw').forEach((b) => { b.onclick = () => { prefs[b.dataset.k] = !prefs[b.dataset.k]; store(LS.prefs, prefs); paint(); render(); }; });
    ov.querySelectorAll('.th').forEach((b) => { b.onclick = () => { PGS.set({ board: b.dataset.b }); paint(); }; });
    if (window.PGS && PGS.mountThemeRow) PGS.mountThemeRow(ov.querySelector('#pg-theme-row')); if (window.PGS && PGS.install) PGS.install.mountRow(ov.querySelector('#pg-install-row'));
    $('prefs-close').onclick = () => ov.remove();
  }
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); }); document.body.appendChild(ov); paint();      // сначала в страницу, потом рисуем: иначе $() не найдёт кнопки панели
};

/* ---------- PWA и тестовые хуки ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('service-worker.js').catch(() => {});
if (window.PGRec) PGRec.config({
  boards: () => { const tk = todayKey(), yk = dayBefore(tk); return [{ id: 'sd_' + tk, title: 'Сегодня', sub: 'Судоку дня · ' + tk }, { id: 'sd_' + yk, title: 'Вчера', sub: 'Судоку дня · ' + yk }]; },
  pending: () => { const d = stats.daily, out = [], lim = keyOf(new Date(Date.now() - 14 * 86400000)); for (const k of Object.keys(d.results || {})) if (k >= lim && d.hints && d.hints[k] != null) out.push({ id: 'sd_' + k, time: d.results[k], hints: d.hints[k] }); return out; },
  local: (id) => { const k = id.slice(3), d = stats.daily; return d && d.results[k] != null && d.hints && d.hints[k] != null ? { time: d.results[k], hints: d.hints[k] } : null; } });
window.__sdk = { get S() { return S; }, SDK, startNew, select, setDigit, erase, undo, redo, hint, check, fillNotes, toggleNotes, get prefs() { return prefs; }, get stats() { return stats; }, todayKey, showMenu, setPause };
renderMenu();
})();
</script>
</body>
