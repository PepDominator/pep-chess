* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; }
body { font-family:'Noto Sans',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; min-height:100dvh; display:flex; justify-content:center; align-items:center; padding:12px; }
body.playing { align-items:stretch; padding:8px; overflow:hidden; height:100dvh; }
.serif { font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif; }
.hidden { display:none !important; }
button { font-family:inherit; }
/* ---------- меню ---------- */
.modal { position:relative; background:var(--k-panel); width:560px; max-width:calc(100vw - 24px); border:1px solid var(--border); box-shadow:0 18px 50px rgba(42,46,36,.10),0 2px 8px rgba(42,46,36,.06); padding-bottom:22px; }
.back-hub { position:absolute; top:14px; left:16px; font-size:12px; color:var(--muted); text-decoration:none; } .back-hub:hover { color:var(--text); }
.rec-btn { display:block; width:100%; margin:-2px 0 14px; padding:8px; background:none; border:1px dashed var(--border); color:var(--muted); font:600 13px inherit; cursor:pointer; } .rec-btn:hover { color:var(--text); background:var(--k-hover); }
.gear { position:absolute; top:10px; right:12px; background:none; border:none; font-size:20px; color:var(--k-mu2); cursor:pointer; padding:4px 8px; } .gear:hover { color:var(--text); background:var(--k-hover); }
.brand { text-align:center; font-size:13px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--green); padding-top:30px; display:flex; align-items:center; justify-content:center; gap:10px; }
.brand::before,.brand::after { content:''; width:24px; height:1px; background:var(--border); }
h2 { font-weight:400; font-style:italic; font-size:27px; margin:0; padding:8px 0 20px; text-align:center; }
.content { padding:0 28px; }
.title { font-size:13px; color:var(--muted); margin:18px 0 8px; text-align:center; }
.big { display:block; width:100%; padding:15px; border:none; font-size:16px; font-weight:700; cursor:pointer; background:var(--green); color:#fff; box-shadow:0 6px 16px rgba(59,93,74,.25); } .big:hover { filter:brightness(1.08); }
.big.light { background:var(--k-surf); color:var(--text); box-shadow:none; border:1px solid var(--border); margin-top:10px; font-size:14px; padding:12px; }
.card { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border); background:var(--k-surf); padding:12px 14px; margin-bottom:10px; }
.card b { font-size:15px; } .card small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.card button { background:var(--navy); color:#fff; border:none; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; } .card button:hover { filter:brightness(1.12); }
.stats { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px; } .stats th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 6px; } .stats td { padding:6px; border-top:1px solid var(--k-line); } .stats th:nth-child(n+2), .stats td:nth-child(n+2) { text-align:right; }
.ver { font-size:11px; color:var(--k-mu2); text-align:center; margin-top:14px; }
.sbox { border:1px solid var(--border); background:var(--k-surf); padding:12px 14px; }
.shead { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; } .shead b { font-size:16px; } .shead span { font-size:12.5px; color:var(--muted); }
.srange { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); margin:6px 0; } .srange label { width:68px; } .srange output { width:70px; text-align:right; font-weight:600; color:var(--text); }
input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:3px; background:var(--k-line); outline:none; } input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--k-panel); border:2px solid var(--green); cursor:pointer; } input[type=range]::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--k-panel); border:2px solid var(--green); cursor:pointer; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; } .chips button { flex:1 1 auto; min-width:46px; border:1px solid var(--border); background:var(--k-panel); padding:7px 4px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; } .chips button.on { background:var(--green); color:#fff; border-color:var(--green); } .chips button:hover:not(.on) { background:var(--k-hover); }
.link-row { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-top:8px; cursor:pointer; user-select:none; }
select { width:100%; padding:11px 12px; border:1px solid var(--border); background:var(--k-surf); font-size:14px; color:var(--text); font-family:inherit; }
/* ---------- игра ---------- */
#game { display:flex; flex-direction:column; width:100%; max-width:1280px; margin:0 auto; min-height:0; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px 8px; flex-shrink:0; }
.topbar .lv { font-weight:700; font-size:14px; text-align:center; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .topbar .lv small { color:var(--muted); font-weight:400; margin-left:6px; }
.tb { border:1px solid var(--border); background:var(--k-panel); color:var(--text); padding:6px 11px; font-size:13px; font-weight:600; cursor:pointer; } .tb:hover { background:var(--k-hover); } .tb:disabled { opacity:.4; cursor:default; } .tb.on { background:var(--green); color:#fff; border-color:var(--green); }
#timer { font-family:'Roboto Mono',ui-monospace,Menlo,monospace; font-size:19px; letter-spacing:1px; min-width:60px; text-align:center; }
#stage { position:relative; flex:1; min-height:0; border:1px solid var(--border); background:var(--k-panel); overflow:hidden; touch-action:none; }
#cv { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
#minimap { position:absolute; right:8px; bottom:8px; border:1px solid rgba(42,46,36,.55); background:rgba(253,253,250,.9); box-shadow:0 4px 14px rgba(42,46,36,.25); cursor:pointer; touch-action:none; z-index:5; }
#pause-ov { position:absolute; inset:0; z-index:8; background:rgba(253,253,250,.97); display:none; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:22px; font-weight:700; cursor:pointer; } #pause-ov small { font-size:13px; font-weight:400; color:var(--muted); }
.tools { display:flex; gap:6px; padding-top:8px; flex-shrink:0; flex-wrap:wrap; justify-content:center; }
.tool { display:flex; flex-direction:column; align-items:center; gap:2px; min-width:58px; padding:6px 8px; border:1px solid var(--border); background:var(--k-panel); font-size:11.5px; font-weight:600; color:var(--text); cursor:pointer; } .tool .i { font-size:18px; line-height:1.1; } .tool:hover:not(:disabled) { background:var(--k-hover); } .tool:disabled { opacity:.35; cursor:default; } .tool.on { background:var(--green); color:#fff; border-color:var(--green); }
.stat-row { display:flex; gap:14px; justify-content:center; font-size:13px; color:var(--muted); padding-top:6px; flex-shrink:0; } .stat-row b { color:var(--text); }
#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2F3A56; color:#fff; padding:10px 18px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .2s; z-index:300; } #toast.on { opacity:1; }
.ov { position:fixed; inset:0; z-index:200; background:rgba(42,46,36,.4); display:flex; align-items:center; justify-content:center; padding:16px; }
.win { background:var(--k-panel); border:1px solid var(--border); width:100%; max-width:400px; text-align:center; padding:26px 26px 22px; box-shadow:0 30px 80px rgba(42,46,36,.3); animation:pop .35s cubic-bezier(.3,1.4,.5,1); } @keyframes pop { from { transform:scale(.88); opacity:0; } to { transform:none; opacity:1; } }
.win h3 { margin:0 0 4px; font:italic 400 28px Georgia,serif; } .win .big-t { font-family:'Roboto Mono',monospace; font-size:36px; font-weight:700; margin:8px 0 4px; } .win .sub { color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:14px; }
.win canvas { display:block; margin:6px auto 10px; border:1px solid var(--border); max-width:100%; image-rendering:pixelated; }
.panel { background:var(--k-panel); border:1px solid var(--border); width:100%; max-width:400px; box-shadow:0 30px 80px rgba(42,46,36,.3); max-height:calc(100dvh - 32px); overflow-y:auto; }
.panel h3 { margin:0; padding:20px 24px 6px; font:italic 400 24px Georgia,serif; }
.srow { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 24px; border-bottom:1px solid var(--k-line); } .srow b { font-size:14px; font-weight:600; display:block; } .srow span.d { font-size:12.5px; color:var(--muted); display:block; margin-top:2px; }
.sw { width:44px; height:24px; flex-shrink:0; background:var(--k-line2); border:none; position:relative; cursor:pointer; padding:0; } .sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:var(--k-panel); transition:left .15s; } .sw.on { background:var(--green); } .sw.on::after { left:23px; }
.loading { position:fixed; inset:0; z-index:250; background:rgba(238,240,231,.9); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; font-size:15px; color:var(--muted); }
.loading::before { content:''; width:34px; height:34px; border-radius:50%; border:3px solid var(--k-line); border-top-color:#3B5D4A; animation:spin .8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:640px) { .content { padding:0 16px; } .tool { min-width:50px; padding:5px 6px; font-size:11px; } }
/*PGDARK-VARS*/
:root{--k-bg:#EEF0E7;--k-panel:#FDFDFA;--k-surf:#F3F2EA;--k-hover:#EAEADF;--k-line:#D9DBCC;--k-line2:#B7BAA5;--k-tx:#2A2E24;--k-mu:#6E7568;--k-mu2:#9A9D8E;--k-gt:#3B5D4A;--k-rt:#A23B33;--k-nt:#2F3A56;--k-warm:#F3EEDD;color-scheme:light}
html[data-theme="dark"]{--k-bg:#131815;--k-panel:#1C221E;--k-surf:#252C27;--k-hover:#2E372F;--k-line:#39443C;--k-line2:#4D5A50;--k-tx:#E5E9DE;--k-mu:#A5AC9B;--k-mu2:#7E8677;--k-gt:#8CC3A0;--k-rt:#E8887E;--k-nt:#A9B9E0;--k-warm:#2B291E;--bg:#131815;--panel:#1C221E;--side-bg:#1C221E;--text:#E5E9DE;--muted:#A5AC9B;--ink-muted:#A5AC9B;--border:#39443C;--highlight:#2B3A2E;--green2:#8CC3A0;color-scheme:dark}

/* кнопки-переключатели и «светлые острова» в тёмной теме */
html[data-theme="dark"] .pg-sw::after, html[data-theme="dark"] .sw::after, html[data-theme="dark"] .toggle::after { background:#F1F3EA !important; }
html[data-theme="dark"] img.piece, html[data-theme="dark"] .piece img { filter:none; }
html[data-theme="dark"] ::selection { background:#3E6B52; color:#fff; }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { color-scheme:dark; }
/* судоку: тёмные клетки вместо палитры светлой доски */
html[data-theme="dark"] .cell { background:#1F2622; border-right-color:#38443B; border-bottom-color:#38443B; }
html[data-theme="dark"] .cell.alt { background:#262E29; }
html[data-theme="dark"] .cell.peer { background:color-mix(in srgb, #4C7A5C 34%, #1F2622); }
html[data-theme="dark"] .cell.alt.peer { background:color-mix(in srgb, #4C7A5C 34%, #262E29); }
html[data-theme="dark"] .cell.same { background:color-mix(in srgb, #5878B8 42%, #1F2622) !important; }
html[data-theme="dark"] .cell.sel { background:color-mix(in srgb, #C49A36 46%, #1F2622) !important; }
html[data-theme="dark"] .cell.wrong { background:color-mix(in srgb, #C0463C 48%, #1F2622) !important; }
/* кроссворд */
html[data-theme="dark"] .c.l { background:#222A25; border-color:rgba(229,233,222,.38); box-shadow:0 1px 1px rgba(0,0,0,.4); }
html[data-theme="dark"] .c.l.aw { background:color-mix(in srgb, #C49A36 30%, #222A25); border-color:rgba(214,180,90,.6); }
html[data-theme="dark"] .c.l.ac { background:color-mix(in srgb, #C49A36 56%, #222A25); box-shadow:0 0 0 2px #8CC3A0, 0 2px 4px rgba(0,0,0,.45); }
html[data-theme="dark"] .c.l.bad { background:color-mix(in srgb, #C0463C 46%, #222A25); }
html[data-theme="dark"] { --navy:#5B76B8; }
html[data-theme="dark"] .cell .v, html[data-theme="dark"] .c.l .ch { color:#9DB4EE; }
html[data-theme="dark"] .cell.given .v { color:#EEF1E6; font-weight:700; }
html[data-theme="dark"] .cell.wrong .v { color:#FF9A8E; }
html[data-theme="dark"] .cell.hinted .v { color:#8CC3A0; }
html[data-theme="dark"] #pad button, html[data-theme="dark"] #kb button { background:#252C27; border-color:#39443C; color:#CBD6F2; }
html[data-theme="dark"] #pad button:disabled, html[data-theme="dark"] #kb button:disabled { color:#5A6760; }
html[data-theme="dark"] #minimap { background:rgba(28,34,30,.93); border-color:rgba(229,233,222,.45); box-shadow:0 4px 14px rgba(0,0,0,.5); }
/* шахматная и шашечная доски чуть приглушены, чтобы не слепили */
html[data-theme="dark"] #board, html[data-theme="dark"] .board, html[data-theme="dark"] #chessboard { filter:brightness(.86) contrast(1.02); }
/* кружок «чёрных» шашек и подобные тёмные значки не должны сливаться с тёмным фоном */
html[data-theme="dark"] .side i.b { box-shadow:0 0 0 1px #6B766D; }
</style>
</head>

<script type="text/plain" id="ng-engine">
// ============ Японские кроссворды: движок ============
// Решатель строк и столбцов, генератор головоломок с гарантированным решением «логикой» и библиотека картинок.
// Картинки и генератор используют только сложение, умножение и деление (без sin/cos), поэтому одна и та же головоломка
// получается одинаковой на любом устройстве: это нужно для «задания дня».
const NG = (function () {
  'use strict';
  // ---------- случайные числа ----------
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- решатель одной строки ----------
  // clue — длины блоков, known[i]: -1 неизвестно, 0 пусто, 1 закрашено. Возвращает false при противоречии; out[i] — выведенное значение.
  let PRE = new Uint8Array(64 * 128), SUF = new Uint8Array(64 * 128), DIF = new Int32Array(130), CNT_F = new Int32Array(130), CNT_E = new Int32Array(130);
  function solveLine(clue, known, n, out) {
    const k = clue.length, W = n + 2;
    if ((k + 2) * W > PRE.length) { PRE = new Uint8Array((k + 2) * W); SUF = new Uint8Array((k + 2) * W); }
    if (n + 2 > DIF.length) { DIF = new Int32Array(n + 2); CNT_F = new Int32Array(n + 2); CNT_E = new Int32Array(n + 2); }
    const f = CNT_F, e = CNT_E; f[0] = 0; e[0] = 0;
    for (let i = 0; i < n; i++) { f[i + 1] = f[i] + (known[i] === 1 ? 1 : 0); e[i + 1] = e[i] + (known[i] === 0 ? 1 : 0); }
    const pre = PRE, suf = SUF; pre.fill(0, 0, (k + 1) * W); suf.fill(0, 0, (k + 1) * W);
    // pre[j*W+i]: блоки 0..j-1 помещаются в клетках [0,i)
    pre[0] = 1; for (let i = 1; i <= n; i++) pre[i] = pre[i - 1] && known[i - 1] !== 1 ? 1 : 0;
    for (let j = 1; j <= k; j++) {
      const b = clue[j - 1], base = j * W, prev = (j - 1) * W;
      for (let i = 0; i <= n; i++) {
        let ok = i > 0 && known[i - 1] !== 1 && pre[base + i - 1] ? 1 : 0;
        if (!ok) { const s = i - b; if (s >= 0 && e[i] - e[s] === 0) ok = (j === 1 ? pre[prev + s] : (s >= 1 && known[s - 1] !== 1 && pre[prev + s - 1])) ? 1 : 0; }
        pre[base + i] = ok;
      }
    }
    // suf[j*W+i]: блоки j..k-1 помещаются в клетках [i,n)
    const kb = k * W; suf[kb + n] = 1; for (let i = n - 1; i >= 0; i--) suf[kb + i] = suf[kb + i + 1] && known[i] !== 1 ? 1 : 0;
    for (let j = k - 1; j >= 0; j--) {
      const b = clue[j], base = j * W, next = (j + 1) * W;

function setCell(i, to, changes) { const from = S.cells[i]; if (from === to || S.given[i]) return false; S.cells[i] = to; changes.push([i, from, to]); if (from === 1) { S.fill--; if (S.sol[i]) S.ok--; else S.bad--; } if (to === 1) { S.fill++; if (S.sol[i]) S.ok++; else S.bad++; } return true; }
function autoCross(lines, changes) {
  if (!prefs.autoX) return; for (const l of lines) { const isRow = l < S.R, idx = isRow ? l : l - S.R; if (!lineDone(isRow, idx)) continue; const n = isRow ? S.C : S.R; for (let k = 0; k < n; k++) { const i = isRow ? idx * S.C + k : k * S.C + idx; if (S.cells[i] === 0) setCell(i, 2, changes); } }
}
function commit(changes, lines) {
  if (!changes.length) return; if (lines) autoCross(lines, changes); S.hist.push(changes); if (S.hist.length > 500) S.hist.shift(); S.redo = []; S.wrong = null; draw(); checkWin();
}
function undo() { if (!S || S.paused || S.done || !S.hist.length) return; const ch = S.hist.pop(); for (let k = ch.length - 1; k >= 0; k--) { const [i, from, to] = ch[k]; S.cells[i] = from; } S.redo.push(ch); countFill(); S.wrong = null; draw(); }
function redo() { if (!S || S.paused || S.done || !S.redo.length) return; const ch = S.redo.pop(); for (const [i, from, to] of ch) S.cells[i] = to; S.hist.push(ch); countFill(); draw(); checkWin(); }
$('t-undo').onclick = undo; $('t-redo').onclick = redo;

/* ---------- ввод: мышь, палец, масштаб ---------- */
const ptrs = new Map(); let stroke = null, gesture = null, spaceDown = false;
const cellAt = (px, py) => { const m = metrics(); px -= m.ox; py -= m.oy; const c = Math.floor((px - m.LW - view.x) / m.cell), r = Math.floor((py - m.TH - view.y) / m.cell); return (px >= m.LW && py >= m.TH && c >= 0 && c < m.C && r >= 0 && r < m.R) ? { r, c } : null; };
const evPos = (e) => { const b = stage.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
function zoomAt(px, py, factor) { const m = metrics(), old = view.cell, nc = Math.max(CELL_MIN, Math.min(CELL_MAX, old * factor)); if (Math.abs(nc - old) < 0.01) return; const gx = (px - m.ox - m.LW - view.x) / old, gy = (py - m.oy - m.TH - view.y) / old; view.cell = nc; const m2 = metrics(); view.x = px - m2.ox - m2.LW - gx * nc; view.y = py - m2.oy - m2.TH - gy * nc; draw(); }
function beginStroke(cellPos, tool) {

}

  if (st.act === 0) { if (v === st.from && v !== 0) { if (setCell(i, 0, st.changes)) { st.lines.add(r); st.lines.add(S.R + c); } } }
  else if (v === 0 || (r === st.r0 && c === st.c0)) { if (setCell(i, st.act, st.changes)) { st.lines.add(r); st.lines.add(S.R + c); } }
}
function applyStroke(pos) {

  if (!st.axis && (r !== st.r0 || c !== st.c0)) st.axis = Math.abs(r - st.r0) >= Math.abs(c - st.c0) ? 'col' : 'row';

stage.addEventListener('contextmenu', (e) => e.preventDefault());
stage.addEventListener('pointerdown', (e) => {
  if (!S || S.paused || S.done || e.target === mm) return; stage.setPointerCapture(e.pointerId); const p = evPos(e); ptrs.set(e.pointerId, { x: p.x, y: p.y, type: e.pointerType });

  const cp = cellAt(p.x, p.y); const panning = S.pan || e.button === 1 || spaceDown || !cp || (e.pointerType === 'mouse' && e.button === 1);

});
stage.addEventListener('pointermove', (e) => {
  if (!S) return; const p = evPos(e); const rec = ptrs.get(e.pointerId); if (rec) { rec.x = p.x; rec.y = p.y; }

});
const up = (e) => { ptrs.delete(e.pointerId); if (ptrs.size < 2) { if (gesture && gesture.d != null) gesture = null; } if (ptrs.size === 0) { gesture = null; endStroke(); } };

stage.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !stroke) { hover = { r: -1, c: -1 }; draw(); } });
stage.addEventListener('wheel', (e) => { if (!S || S.paused) return; e.preventDefault(); const p = evPos(e); if (e.ctrlKey || e.metaKey) zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.01)); else { view.x -= e.shiftKey ? e.deltaY : e.deltaX; view.y -= e.shiftKey ? 0 : e.deltaY; draw(); } }, { passive: false });
$('t-fill').onclick = () => { if (S) { S.tool = 'fill'; S.pan = false; draw(); } }; $('t-cross').onclick = () => { if (S) { S.tool = 'cross'; S.pan = false; draw(); } }; $('t-pan').onclick = () => { if (S) { S.pan = !S.pan; draw(); } };
$('t-zin').onclick = () => zoomAt(VW / 2, VH / 2, 1.25); $('t-zout').onclick = () => zoomAt(VW / 2, VH / 2, 0.8); $('t-fit').onclick = () => fitView();

/* ---------- подсказки, проверка, победа ---------- */
function hint() { if (!S || S.paused || S.done) return; const pl = new Int8Array(S.cells.length); for (let i = 0; i < pl.length; i++) pl[i] = S.cells[i] === 1 ? 1 : 0; const i = NG.hint(S.sol, pl, S.R, S.C); if (i < 0) { toast('Все закрашенные клетки верны'); return; }
  const ch = [], to = S.sol[i] ? 1 : 2; S.given[i] = 0; setCell(i, to, ch); S.hinted[i] = 1; S.given[i] = 0; S.hints++; commit(ch, [(i / S.C) | 0, S.R + i % S.C]); const r = (i / S.C) | 0, c = i % S.C; view.x += 0; hover = { r, c }; toast(S.sol[i] ? 'Эту клетку нужно закрасить' : 'Тут должна быть пустая клетка'); persist(); }
function check() { if (!S || S.paused || S.done) return; const w = new Uint8Array(S.cells.length); let n = 0; for (let i = 0; i < w.length; i++) if (S.cells[i] === 1 && !S.sol[i]) { w[i] = 1; n++; } if (!n) { toast('Ошибок нет — всё закрашенное верно'); return; } S.wrong = w; S.checks++; S.hints++; draw(); toast('Неверно закрашено клеток: ' + n); persist(); }
$('t-hint').onclick = hint; $('t-check').onclick = check;
function checkWin() { if (!S || S.done) return; if (S.ok === S.total && S.bad === 0) win(); }
function pictureCanvas() { const c = document.createElement('canvas'), k = Math.max(2, Math.min(8, Math.floor(260 / Math.max(S.R, S.C)))); c.width = S.C * k; c.height = S.R * k; const x = c.getContext('2d'); x.fillStyle = COL.surf; x.fillRect(0, 0, c.width, c.height); x.fillStyle = COL.nt; for (let r = 0; r < S.R; r++) for (let q = 0; q < S.C; q++) if (S.sol[r * S.C + q]) x.fillRect(q * k, r * k, k, k); return c; }
function win() {
  S.done = true; localStorage.removeItem(LS.save); const t = S.time, cat = catOf(S.R, S.C); stats.solved[cat] = (stats.solved[cat] || 0) + 1; const newBest = !stats.best[cat] || t < stats.best[cat]; if (newBest) stats.best[cat] = t;
  let extra = '', first = false; if (S.daily) { const d = stats.daily; d.hints = d.hints || {}; if (!d.results[S.dateKey]) { first = true; d.hints[S.dateKey] = S.hints; d.streak = d.last === dayBefore(S.dateKey) ? d.streak + 1 : 1; d.last = S.dateKey; d.results[S.dateKey] = t; } extra = `<br>Серия дней подряд: <b>${d.streak}</b>` + (first ? '<div class="pgr-line" id="pgr-win"></div>' : ''); }
  store(LS.stats, stats); fitView(); draw();
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'win-ov';
  ov.innerHTML = `<div class="win"><h3>Картинка готова!</h3><div id="win-pic"></div><div class="big-t">${fmt(t)}</div><div class="sub">${S.names && S.names.length > 1 ? 'Получилась картина: ' + S.names.join(', ') : 'Получилось: <b>' + S.name + '</b>'}<br>${S.C} × ${S.R}${newBest ? ' — <b>новый рекорд!</b>' : ''} · Подсказок: <b>${S.hints}</b>${extra}</div>
    <button class="big" id="w-again">Ещё одну</button><button class="big light" id="w-menu">В меню</button></div>`;
  document.body.appendChild(ov); $('win-pic').appendChild(pictureCanvas());
  $('w-again').onclick = () => { ov.remove(); startNew(S.daily ? currentOpts() : { rows: S.R, cols: S.C, cat: catFilter(), mode: modeFilter() }); }; $('w-menu').onclick = () => { ov.remove(); showMenu(); };
  if (window.PGA) PGA.event('nonogram', { rows: S.R, cols: S.C, time: t, hints: S.hints, daily: S.daily, streak: stats.daily.streak });
  if (first && window.PGRec) PGRec.winLine(document.getElementById('pgr-win'), 'jd_' + S.dateKey, { time: t, hints: S.hints });
}

/* ---------- таймер и пауза ---------- */
setInterval(() => { const now = performance.now(); if (S && !S.paused && !S.done && !$('game').classList.contains('hidden')) { S.time += now - lastTick; $('timer').textContent = fmt(S.time); } lastTick = now; }, 250);
setInterval(() => { if (S && !S.done && !$('game').classList.contains('hidden')) persist(); }, 5000);
function setPause(p) { if (!S || S.done) return; S.paused = p; $('pause-ov').style.display = p ? 'flex' : 'none'; $('pause-btn').textContent = p ? 'Играть' : 'Пауза'; if (!p) lastTick = performance.now(); persist(); }
$('pause-btn').onclick = () => setPause(!S.paused); $('pause-ov').onclick = () => setPause(false);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.done && !$('game').classList.contains('hidden')) setPause(true); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') spaceDown = true; if (!S || $('game').classList.contains('hidden') || document.querySelector('.ov')) return;
  if (S.paused) { if (e.key === ' ' || e.key === 'Enter') setPause(false); return; }
  if (e.ctrlKey || e.metaKey) { const k = e.key.toLowerCase(); if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); } else if (k === 'y') { e.preventDefault(); redo(); } return; }
  const k = e.key.toLowerCase(); if (k === 'x' || k === 'ч') { S.tool = S.tool === 'fill' ? 'cross' : 'fill'; S.pan = false; draw(); } else if (k === 'h' || k === 'р') hint(); else if (k === '+' || k === '=') zoomAt(VW / 2, VH / 2, 1.25); else if (k === '-') zoomAt(VW / 2, VH / 2, 0.8); else if (e.key === ' ') { e.preventDefault(); setPause(true); }
});
document.addEventListener('keyup', (e) => { if (e.code === 'Space') spaceDown = false; });

/* ---------- меню ---------- */
const catFilter = () => (['Предметы', 'Природа', 'Животные'].includes(prefs.cat) ? prefs.cat : 'Всё'), modeFilter = () => (prefs.cat === 'Узоры' ? 'blobs' : undefined);
const currentOpts = () => ({ rows: prefs.h, cols: prefs.w, cat: catFilter(), mode: modeFilter() });
function openGame() { document.body.classList.add('playing'); $('menu').classList.add('hidden'); $('game').classList.remove('hidden'); $('pause-ov').style.display = S.paused ? 'flex' : 'none'; $('pause-btn').textContent = S.paused ? 'Играть' : 'Пауза'; $('timer').textContent = fmt(S.time); lastTick = performance.now(); readColors(); hover = { r: -1, c: -1 };
  if (S.R * S.C >= 2500 && !S.hintShown && !S.time) { S.hintShown = true; setTimeout(() => toast('Большое поле: Ctrl + колесо или два пальца меняют масштаб, карта в углу помогает не заблудиться'), 600); }
  $('lv').innerHTML = (S.daily ? 'Кроссворд дня' : S.C + ' × ' + S.R) + (S.daily ? '<small>' + S.dateKey + '</small>' : ''); requestAnimationFrame(() => { resize(); fitView(); draw(); }); }
function showMenu() { if (S && !S.done) persist(); document.body.classList.remove('playing'); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
$('menu-btn').onclick = showMenu;
function renderMenu() {
  const sv = load(LS.save, null), rc = $('resume-card'); rc.classList.toggle('hidden', !sv);
  if (sv) { let f = 0; for (let i = 0; i < sv.cells.length; i++) if (sv.cells[i] === '1') f++; $('resume-info').textContent = `${sv.daily ? 'Кроссворд дня' : sv.C + ' × ' + sv.R} · ${fmt(sv.time)} · закрашено ${f}`; }
  const tk = todayKey(), d = stats.daily; $('daily-info').innerHTML = d.results[tk] != null ? `Решён сегодня за ${fmt(d.results[tk])} ✓ · серия: ${d.streak}` : (d.streak && d.last === dayBefore(tk) ? `Не прерывайте серию: ${d.streak} дн. подряд` : 'Одна и та же картинка для всех, 15 × 15, каждый день новая'); $('daily-btn').textContent = d.results[tk] != null ? 'Ещё раз' : 'Играть';
  $('w-range').value = prefs.w; $('h-range').value = prefs.h; $('w-out').textContent = prefs.w; $('h-out').textContent = prefs.h; $('square').checked = prefs.square; $('cat').value = prefs.cat;
  const cells = prefs.w * prefs.h; $('size-name').textContent = prefs.w + ' × ' + prefs.h; $('size-info').textContent = cells <= 100 ? 'для разминки' : cells <= 625 ? 'на 5–20 минут' : cells <= 2500 ? 'на час и больше' : cells <= 6400 ? 'на несколько часов' : 'марафон: сохраняется, решайте частями';
  document.querySelectorAll('#size-presets button').forEach((b) => b.classList.toggle('on', prefs.w === prefs.h && +b.dataset.n === prefs.w));
  $('stats').innerHTML = '<tr><th>Размер</th><th>Решено</th><th>Лучшее время</th></tr>' + Object.keys(CAT).map((k) => `<tr><td>${CAT[k]}</td><td>${stats.solved[k] || 0}</td><td>${stats.best[k] != null ? fmt(stats.best[k]) : '—'}</td></tr>`).join('');
}
const setSize = (w, h) => { prefs.w = w; prefs.h = h; store(LS.prefs, prefs); renderMenu(); };
$('w-range').oninput = () => { const v = +$('w-range').value; setSize(v, prefs.square ? v : prefs.h); }; $('h-range').oninput = () => { const v = +$('h-range').value; setSize(prefs.square ? v : prefs.w, v); };
$('square').onchange = () => { prefs.square = $('square').checked; if (prefs.square) prefs.h = prefs.w; store(LS.prefs, prefs); renderMenu(); };
document.querySelectorAll('#size-presets button').forEach((b) => { b.onclick = () => { prefs.square = true; setSize(+b.dataset.n, +b.dataset.n); }; });
$('cat').onchange = () => { prefs.cat = $('cat').value; store(LS.prefs, prefs); };
$('new-btn').onclick = () => startNew(currentOpts());
$('daily-btn').onclick = () => { const dk = todayKey(); startNew({ rows: 15, cols: 15, seed: (Number(dk.replace(/-/g, '')) ^ 0x4e6f6e6f) >>> 0, tries: 10, deterministic: true, daily: true, dateKey: dk }); };
$('resume-btn').onclick = () => { if (!resume()) renderMenu(); };
window.addEventListener('pgsync-applied', (e) => { const k = e.detail && e.detail.key; if (k === 'nonogramStats') stats = readStats(); else if (k === 'nonogramPrefs') { prefs = readPrefs(); if (S) draw(); } if ($('game').classList.contains('hidden')) renderMenu(); });

/* ---------- настройки ---------- */
$('open-prefs').onclick = () => {

    ov.querySelectorAll('.sw').forEach((b) => { b.onclick = () => { prefs[b.dataset.k] = !prefs[b.dataset.k]; store(LS.prefs, prefs); paint(); if (S) draw(); }; });
    if (window.PGS && PGS.mountThemeRow) PGS.mountThemeRow(ov.querySelector('#pg-theme-row')); if (window.PGS && PGS.install) PGS.install.mountRow(ov.querySelector('#pg-install-row')); $('prefs-close').onclick = () => ov.remove();
  }

/* ---------- PWA и тестовые хуки ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('service-worker.js').catch(() => {});
if (window.PGRec) PGRec.config({
  boards: () => { const tk = todayKey(), yk = dayBefore(tk); return [{ id: 'jd_' + tk, title: 'Сегодня', sub: 'Кроссворд дня · ' + tk }, { id: 'jd_' + yk, title: 'Вчера', sub: 'Кроссворд дня · ' + yk }]; },
  pending: () => { const d = stats.daily, out = [], lim = keyOf(new Date(Date.now() - 14 * 86400000)); for (const k of Object.keys(d.results || {})) if (k >= lim && d.hints && d.hints[k] != null) out.push({ id: 'jd_' + k, time: d.results[k], hints: d.hints[k] }); return out; },
  local: (id) => { const k = id.slice(3), d = stats.daily; return d && d.results[k] != null && d.hints && d.hints[k] != null ? { time: d.results[k], hints: d.hints[k] } : null; } });

readColors(); renderMenu();
})();
</script>
