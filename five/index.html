<style>
:root { --bg:#EEF0E7; --panel:#FDFDFA; --border:#D9DBCC; --text:#2A2E24; --muted:#6E7568; --green:#3B5D4A; --navy:#2F3A56;
  --hit:#3B7D4F; --near:#C49A36; --miss:#8C9083; --key:#E3E5DA; --tile:58px; --keyh:56px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font-family:'Noto Sans',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; overflow:hidden;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
header { width:100%; max-width:560px; display:flex; align-items:center; gap:8px; padding:10px 12px 4px; }
header a.back { color:var(--muted); text-decoration:none; font-size:13.5px; white-space:nowrap; }
header h1 { flex:1; text-align:center; margin:0; font:italic 400 26px Georgia,serif; letter-spacing:.01em; }
.ibtn { border:1px solid var(--border); background:var(--panel); color:var(--text); width:36px; height:36px; font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.modes { display:flex; gap:6px; width:100%; max-width:380px; padding:6px 12px 0; }
.modes button { flex:1; border:1px solid var(--border); background:var(--panel); padding:8px 6px; font:700 13px 'Noto Sans',sans-serif; color:var(--text); cursor:pointer; }
.modes button.on { background:var(--green); color:#fff; border-color:var(--green); }
.modes button small { display:block; font-weight:500; font-size:11px; opacity:.8; }
main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; min-height:0; padding:8px 0; }
#grid { display:grid; grid-template-rows:repeat(6, var(--tile)); gap:6px; }
.row { display:grid; grid-template-columns:repeat(5, var(--tile)); gap:6px; }
.row.shake { animation:shake .42s; }
@keyframes shake { 10%, 90% { transform:translateX(-2px); } 20%, 80% { transform:translateX(4px); } 30%, 50%, 70% { transform:translateX(-7px); } 40%, 60% { transform:translateX(7px); } }
.tile { width:var(--tile); height:var(--tile); border:2px solid var(--border); background:var(--panel); display:flex; align-items:center; justify-content:center;
  font:700 calc(var(--tile) * .5) 'Noto Sans',sans-serif; text-transform:uppercase; color:var(--text); user-select:none; }
.tile.filled { border-color:#9A9D8E; animation:pop .1s; }
@keyframes pop { 50% { transform:scale(1.08); } }
.tile.hit, .tile.near, .tile.miss { color:#fff; border-color:transparent; }
.tile.hit { background:var(--hit); } .tile.near { background:var(--near); } .tile.miss { background:var(--miss); }
.tile.flip { animation:flip .5s ease forwards; }
@keyframes flip { 0% { transform:rotateX(0); } 50% { transform:rotateX(90deg); } 100% { transform:rotateX(0); } }
.tile.win { animation:jump .5s; } @keyframes jump { 40% { transform:translateY(-14px); } 70% { transform:translateY(3px); } }
#kb { width:100%; max-width:560px; padding:6px 6px 10px; display:flex; flex-direction:column; gap:6px; user-select:none; }
.krow { display:flex; gap:5px; justify-content:center; }
.key { flex:1 1 0; max-width:46px; height:var(--keyh); border:none; background:var(--key); color:var(--text); font:700 calc(var(--keyh) * .32) 'Noto Sans',sans-serif; text-transform:uppercase; cursor:pointer; padding:0; border-radius:4px; }
.key.wide { flex:1.6 1 0; max-width:74px; font-size:calc(var(--keyh) * .24); }
.key.hit { background:var(--hit); color:#fff; } .key.near { background:var(--near); color:#fff; } .key.miss { background:var(--miss); color:#fff; opacity:.75; }
.key:active { filter:brightness(.92); }
#toast { position:fixed; top:84px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20; max-width:90vw; text-align:center; }
#toast.on { opacity:1; }
.ov { position:fixed; inset:0; background:rgba(20,24,20,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:30; }
.ov.hidden { display:none; }
.card { background:var(--panel); border:1px solid var(--border); width:100%; max-width:400px; padding:22px 24px; box-shadow:0 30px 80px rgba(0,0,0,.3); max-height:calc(100dvh - 32px); overflow-y:auto; text-align:center; }
.card h2 { margin:0 0 4px; font:italic 400 28px Georgia,serif; }
.card .word { font:700 30px 'Noto Sans',sans-serif; letter-spacing:.18em; text-transform:uppercase; margin:6px 0 2px; color:var(--green); }
.card .sub { color:var(--muted); font-size:13.5px; margin-bottom:14px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:6px 0 14px; }
.stats b { display:block; font-size:24px; } .stats span { font-size:11.5px; color:var(--muted); line-height:1.2; display:block; }
.dist { text-align:left; margin-bottom:16px; } .dist div { display:flex; align-items:center; gap:6px; margin:3px 0; font-size:13px; }

.dist i.me { background:var(--hit); }
.btns { display:flex; flex-direction:column; gap:8px; } .big { border:none; background:var(--green); color:#fff; padding:12px; font:700 15px 'Noto Sans',sans-serif; cursor:pointer; }
.big.light { background:var(--panel); color:var(--text); border:1px solid var(--border); }
.next { font-size:13px; color:var(--muted); margin-top:10px; }

/* кнопки-переключатели и «светлые острова» в тёмной теме */
html[data-theme="dark"] .pg-sw::after, html[data-theme="dark"] .sw::after, html[data-theme="dark"] .toggle::after { background:#F1F3EA !important; }
html[data-theme="dark"] img.piece, html[data-theme="dark"] .piece img { filter:none; }
html[data-theme="dark"] ::selection { background:#3E6B52; color:#fff; }
html[data-theme="dark"] input, html[data-theme="dark"] select, html[data-theme="dark"] textarea { color-scheme:dark; }
/* судоку: тёмные клетки вместо палитры светлой доски */
html[data-theme="dark"] .cell { background:#1F2622; border-right-color:#38443B; border-bottom-color:#38443B; }

html[data-theme="dark"] .cell.same { background:color-mix(in srgb, #5878B8 42%, #1F2622) !important; }
html[data-theme="dark"] .cell.sel { background:color-mix(in srgb, #C49A36 46%, #1F2622) !important; }
html[data-theme="dark"] .cell.wrong { background:color-mix(in srgb, #C0463C 48%, #1F2622) !important; }
/* кроссворд */
html[data-theme="dark"] .c.l { background:#222A25; border-color:rgba(229,233,222,.38); box-shadow:0 1px 1px rgba(0,0,0,.4); }

html[data-theme="dark"] .c.l.ac { background:color-mix(in srgb, #C49A36 56%, #222A25); box-shadow:0 0 0 2px #8CC3A0, 0 2px 4px rgba(0,0,0,.45); }
html[data-theme="dark"] .c.l.bad { background:color-mix(in srgb, #C0463C 46%, #222A25); }
html[data-theme="dark"] { --navy:#5B76B8; }
html[data-theme="dark"] .cell .v, html[data-theme="dark"] .c.l .ch { color:#9DB4EE; }
html[data-theme="dark"] .cell.given .v { color:#EEF1E6; font-weight:700; }
html[data-theme="dark"] .cell.wrong .v { color:#FF9A8E; }
html[data-theme="dark"] .cell.hinted .v { color:#8CC3A0; }

}
async function share() {

}
