<title>Pep Crossword</title>
<script>
// ============ Общие настройки Pep Games (одни и те же во всех трёх страницах: общее меню, шахматы, шашки) ============
(function () {
  if (window.PGS) return;
  const KEY = 'pgSettings';
  const THEMES = {
    classic: { n: 'Классика', l: '#F6F4EB', d: '#C7CAB4' },
    green: { n: 'Зелёная', l: '#EEEED2', d: '#769656' },
    blue: { n: 'Голубая', l: '#DEE3E6', d: '#8CA2AD' },
    wood: { n: 'Дерево', l: '#F0D9B5', d: '#B58863' }
  };
  const DEFAULTS = { sound: true, confirm: false, board: 'classic', nums: true, chat: true, showGames: true };
  function get() { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return Object.assign({}, DEFAULTS); } }
  function apply() {
    const s = get(), t = THEMES[s.board] || THEMES.classic, r = document.documentElement;
    r.style.setProperty('--sq-light', t.l); r.style.setProperty('--sq-dark', t.d); r.classList.toggle('no-nums', !s.nums);
  }
  function set(patch) { const v = Object.assign(get(), patch); try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} apply(); window.dispatchEvent(new Event('pgs-change')); return v; }
  window.PGS = { get, set, apply, THEMES };
  // Звук: одно место, через которое проходят все звуки приложения.
  const origPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () { if (!get().sound) return Promise.resolve(); return origPlay.apply(this, arguments); };
  apply(); window.addEventListener('storage', (e) => { if (e.key === KEY) apply(); });

  const css = `
.pg-gear { position:absolute; top:12px; right:14px; background:none; border:none; font-size:20px; line-height:1; color:#8B8E7F; cursor:pointer; padding:4px 8px; z-index:3; font-family:inherit; }
.pg-gear:hover { color:#2A2E24; background:#EAEADF; } .pg-gear.static { position:static; }
.pg-ov { position:fixed; inset:0; z-index:400; background:rgba(42,46,36,.38); display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Noto Sans',system-ui,sans-serif; }
.pg-panel { background:#FDFDFA; border:1px solid #D9DBCC; width:100%; max-width:420px; max-height:calc(100dvh - 32px); overflow-y:auto; box-shadow:0 30px 80px rgba(42,46,36,.3); color:#2A2E24; }
.pg-panel h3 { margin:0; padding:22px 24px 6px; font:italic 400 24px Georgia,'Times New Roman',serif; }
.pg-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 24px; border-bottom:1px solid #E6E8DA; }
.pg-row b { display:block; font-size:14px; font-weight:600; } .pg-row span.d { display:block; font-size:12px; color:#6E7568; margin-top:2px; line-height:1.4; }
.pg-sw { position:relative; width:44px; height:24px; flex-shrink:0; background:#C9CCBB; border:none; cursor:pointer; transition:background .15s; padding:0; }
.pg-sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; transition:transform .15s; }
.pg-sw.on { background:#3B5D4A; } .pg-sw.on::after { transform:translateX(20px); }
.pg-themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:6px 24px 16px; }
.pg-th { border:2px solid transparent; background:none; padding:4px; cursor:pointer; font:inherit; font-size:11.5px; color:#6E7568; text-align:center; }
.pg-th.on { border-color:#3B5D4A; color:#2A2E24; font-weight:700; }
.pg-th i { display:block; aspect-ratio:1/1; margin-bottom:4px; box-shadow:0 0 0 1px rgba(42,46,36,.15); }
.pg-title2 { padding:14px 24px 0; font-size:14px; font-weight:600; }
.pg-small { background:#F3F2EA; border:1px solid #D9DBCC; padding:7px 12px; font:700 12.5px 'Noto Sans',sans-serif; color:#2A2E24; cursor:pointer; flex-shrink:0; } .pg-small:hover { background:#EAEADF; }
.pg-close { display:block; width:calc(100% - 48px); margin:18px 24px 22px; padding:12px; background:#3B5D4A; color:#fff; border:none; font:700 14px inherit; cursor:pointer; }
#pg-confirm { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:350; display:none; align-items:center; gap:10px; background:#2F3A56; color:#fff; padding:10px 12px 10px 16px; box-shadow:0 10px 30px rgba(0,0,0,.35); font:600 14px 'Noto Sans',system-ui,sans-serif; max-width:calc(100vw - 20px); }
#pg-confirm button { border:none; padding:9px 14px; font:700 13px inherit; cursor:pointer; }
#pg-confirm .ok { background:#3B5D4A; color:#fff; } #pg-confirm .no { background:#EAEADF; color:#2A2E24; }
.pg-pending { box-shadow:inset 0 0 0 1000px rgba(47,58,86,.38) !important; }
.no-nums .sq .num { display:none !important; }`;
  const st = document.createElement('style'); st.textContent = css; (document.head || document.documentElement).appendChild(st);

  // ---- панель «Настройки» ----
  window.openPgSettings = function () {
    if (document.getElementById('pg-ov')) return;
    const ov = document.createElement('div'); ov.className = 'pg-ov'; ov.id = 'pg-ov';
    const isDr = !!window.PG_DRAUGHTS;
    function paint() {
      const s = get();
      const sw = (k) => `<button class="pg-sw ${s[k] ? 'on' : ''}" data-k="${k}" role="switch" aria-checked="${s[k]}"></button>`;
      ov.innerHTML = `<div class="pg-panel" role="dialog" aria-modal="true"><h3>Настройки</h3>
        <div class="pg-row"><div><b>Звук</b><span class="d">Звуки ходов, взятий и окончания партии</span></div>${sw('sound')}</div>
        <div class="pg-row"><div><b>Подтверждать ход</b><span class="d">После хода появляется кнопка «Подтвердить» — удобно на телефоне, чтобы не ходить случайно</span></div>${sw('confirm')}</div>
        <div class="pg-row"><div><b>Чат в партии</b><span class="d">Кнопка чата и сообщения соперника в онлайн-партиях. Выключите, если не хотите видеть сообщения</span></div>${sw('chat')}</div>
        <div class="pg-row"><div><b>Показывать мои партии другим</b><span class="d">Ваши онлайн-партии (когда оба игрока вошли через Google и согласны) видны в профиле и в списке «Идущие партии». Действует на новые партии</span></div>${sw('showGames')}</div>
                ${isDr ? `<div class="pg-row"><div><b>Номера клеток</b><span class="d">Стандартная нумерация 1–50 на тёмных клетках</span></div>${sw('nums')}</div>` : ''}
        <div class="pg-row" id="pg-hide-row" style="display:none"><div><b>Скрыть прошлые партии</b><span class="d">Удалить публичные копии ваших прошлых партий (в профиле и по ссылкам)</span></div><button class="pg-small" id="pg-hide-btn">Скрыть</button></div>
        <div class="pg-title2">Оформление доски</div>
        <div class="pg-themes">${Object.entries(THEMES).map(([k, t]) => `<button class="pg-th ${s.board === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
        <button class="pg-close">Готово</button></div>`;
      ov.querySelectorAll('.pg-sw').forEach((b) => { b.onclick = () => { const k = b.dataset.k; set({ [k]: !get()[k] }); paint(); }; });
      ov.querySelectorAll('.pg-th').forEach((b) => { b.onclick = () => { set({ board: b.dataset.b }); paint(); }; });
      const hideRow = ov.querySelector('#pg-hide-row'); if (hideRow && typeof window.pgHideMine === 'function') { hideRow.style.display = 'flex'; ov.querySelector('#pg-hide-btn').onclick = async (e) => { const b = e.target; b.disabled = true; b.textContent = '…'; try { const n = await window.pgHideMine(); b.textContent = n ? 'Скрыто: ' + n : 'Нечего скрывать'; } catch (err) { console.error(err); b.textContent = 'Не удалось'; } }; }
      ov.querySelector('.pg-close').onclick = close;
    }
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); }); document.addEventListener('keydown', onKey);
    paint(); document.body.appendChild(ov);
  };

  // ---- плашка «Подтвердить ход» ----
  let bar = null;
  window.pgConfirm = {
    show(text, ok, cancel) {
      if (!bar) { bar = document.createElement('div'); bar.id = 'pg-confirm'; document.body.appendChild(bar); }
      bar.innerHTML = '<span></span><button class="ok">✓ Подтвердить</button><button class="no">✕</button>';
      bar.firstChild.textContent = text; bar.style.display = 'flex';
      bar.querySelector('.ok').onclick = () => { ok(); }; bar.querySelector('.no').onclick = () => { cancel(); };
    },
    hide() { if (bar) bar.style.display = 'none'; },
    get visible() { return !!bar && bar.style.display !== 'none'; }
  };
})();

</script>
<link rel="manifest" href="manifest.json">

<style>
:root { --bg:#EEF0E7; --panel:#FBFBF8; --green:#3B5D4A; --navy:#2F3A56; --text:#2A2E24; --muted:#6E7568; --border:#D9DBCC; --sq-light:#F6F4EB; --sq-dark:#C7CAB4; --cw:34px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; }

.serif { font-family:Georgia,'Iowan Old Style','Palatino Linotype','Times New Roman',serif; }
.hidden { display:none !important; }

/* ---------- меню ---------- */
#menu { margin-top:max(0px, calc(50vh - 360px)); }
.modal { position:relative; background:#FDFDFA; width:560px; max-width:calc(100vw - 24px); border:1px solid var(--border); box-shadow:0 18px 50px rgba(42,46,36,.10),0 2px 8px rgba(42,46,36,.06); padding-bottom:22px; }
.back-hub { position:absolute; top:14px; left:16px; font-size:12px; color:var(--muted); text-decoration:none; } .back-hub:hover { color:var(--text); }
.gear { position:absolute; top:10px; right:12px; background:none; border:none; font-size:20px; color:#8B8E7F; cursor:pointer; padding:4px 8px; } .gear:hover { color:var(--text); background:#EAEADF; }
.brand { text-align:center; font-size:13px; font-weight:600; letter-spacing:3px; text-transform:uppercase; color:var(--green); padding-top:30px; display:flex; align-items:center; justify-content:center; gap:10px; }
.brand::before,.brand::after { content:''; width:24px; height:1px; background:var(--border); }
h2 { font-weight:400; font-style:italic; font-size:27px; margin:0; padding:8px 0 20px; text-align:center; }
.content { padding:0 28px; }
.title { font-size:13px; color:var(--muted); margin:18px 0 8px; text-align:center; }
.big { display:block; width:100%; padding:15px; border:none; font-size:16px; font-weight:700; cursor:pointer; background:var(--green); color:#fff; box-shadow:0 6px 16px rgba(59,93,74,.25); } .big:hover { filter:brightness(1.08); }
.big.light { background:#F3F2EA; color:var(--text); box-shadow:none; border:1px solid var(--border); margin-top:10px; font-size:14px; padding:12px; }
.levels { display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--border); background:#F3F2EA; }
.levels button { border:none; border-right:1px solid var(--border); background:none; padding:10px 4px; font-size:13.5px; font-weight:700; color:var(--muted); cursor:pointer; line-height:1.25; } .levels button:last-child { border-right:none; } .levels button small { display:block; font-weight:400; font-size:11.5px; }
.levels button.on { background:var(--green); color:#fff; } .levels button:hover:not(.on) { background:#EAEADF; }
select { width:100%; padding:11px 12px; background:#F3F2EA; border:1px solid var(--border); font-size:14.5px; color:var(--text); }
select:focus { outline:none; border-color:var(--green); }
.card { display:flex; align-items:center; justify-content:space-between; gap:12px; border:1px solid var(--border); background:#F8F7F1; padding:12px 14px; margin-bottom:10px; }
.card b { font-size:15px; } .card small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.card button { background:var(--navy); color:#fff; border:none; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; } .card button:hover { filter:brightness(1.12); }
.stats { width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px; } .stats th { text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 6px; } .stats td { padding:6px; border-top:1px solid var(--border); } .stats td:not(:first-child), .stats th:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.ver { font-size:11px; color:#9A9D8E; text-align:center; margin-top:14px; }

/* ---------- игра ---------- */
#game { display:flex; gap:22px; align-items:flex-start; justify-content:center; width:100%; max-width:1180px; }
#main { display:flex; flex-direction:column; min-width:0; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 2px 8px; }
.topbar .lv { font-weight:700; font-size:14px; text-align:center; } .topbar .lv small { display:block; color:var(--muted); font-weight:400; font-size:12px; }
.tb { border:1px solid var(--border); background:#FDFDFA; color:var(--text); padding:6px 11px; font-size:13px; font-weight:600; cursor:pointer; } .tb:hover { background:#EAEADF; }
#timer { font-family:'Roboto Mono',ui-monospace,Menlo,monospace; font-size:19px; letter-spacing:1px; min-width:56px; text-align:center; }
#clue-bar { display:flex; align-items:stretch; border:1px solid var(--border); background:#FDFDFA; margin-bottom:8px; min-height:54px; }
#clue-bar button { background:#F3F2EA; border:none; border-right:1px solid var(--border); width:40px; font-size:20px; cursor:pointer; color:var(--text); } #clue-bar button:last-child { border-right:none; border-left:1px solid var(--border); } #clue-bar button:hover { background:#EAEADF; }
#clue-text { flex:1; padding:8px 12px; font-size:15px; line-height:1.35; display:flex; flex-direction:column; justify-content:center; } #clue-text small { color:var(--muted); font-size:12px; margin-bottom:1px; }
#grid-wrap { position:relative; overflow:auto; max-width:100%; max-height:calc(100dvh - 190px); padding:2px; background:transparent; }
#cgrid { display:grid; gap:0; user-select:none; touch-action:manipulation; width:max-content; margin:0 auto; }
.c { position:relative; width:var(--cw); height:var(--cw); }
.c.l { background:var(--sq-light); border:1.5px solid #2A2E24; margin:-.75px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.c.l .ch { font-size:calc(var(--cw)*.58); font-weight:600; text-transform:uppercase; color:var(--navy); pointer-events:none; line-height:1; }
.c.l .num { position:absolute; top:1px; left:2px; font-size:calc(var(--cw)*.27); line-height:1; color:#4a4f43; font-weight:600; pointer-events:none; }
.c.l.aw { background:color-mix(in srgb, #C49A36 24%, var(--sq-light)); }
.c.l.ac { background:color-mix(in srgb, #C49A36 62%, var(--sq-light)); }
.c.l.bad .ch { color:#A23B33; } .c.l.bad { background:color-mix(in srgb, #A23B33 22%, var(--sq-light)); }
.c.l.hint .ch { color:var(--green); }
.c.l.flash { animation:flash .6s; } @keyframes flash { 0%,100% { filter:none; } 50% { filter:brightness(1.2); } }
#pause-ov { position:absolute; inset:0; background:rgba(238,240,231,.98); display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; cursor:pointer; font-size:18px; z-index:5; } #pause-ov small { color:var(--muted); font-size:13px; }
.tools { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:8px; }
.tool { background:#FDFDFA; border:1px solid var(--border); padding:8px 2px 6px; cursor:pointer; font-size:11.5px; color:var(--text); display:flex; flex-direction:column; align-items:center; gap:3px; } .tool .i { font-size:18px; line-height:1; } .tool:hover { background:#EAEADF; } .tool.on { background:var(--green); color:#fff; border-color:var(--green); }
.stat-row { display:flex; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); margin-top:8px; } .stat-row b { color:var(--text); }
#kb { display:none; margin-top:8px; flex-direction:column; gap:5px; align-items:center; }
#kb.on { display:flex; }
#kb .row { display:flex; gap:4px; justify-content:center; width:100%; }
#kb button { flex:1 1 0; max-width:42px; height:44px; background:#FDFDFA; border:1px solid var(--border); font-size:18px; font-weight:500; color:var(--navy); padding:0; cursor:pointer; text-transform:uppercase; touch-action:manipulation; } #kb button:active { background:#EAEADF; }
#kb button.wide { max-width:64px; font-size:17px; color:var(--text); }
#clues { width:360px; flex-shrink:0; display:flex; flex-direction:column; gap:10px; max-height:calc(100dvh - 24px); }
.cl { background:#FDFDFA; border:1px solid var(--border); display:flex; flex-direction:column; min-height:0; flex:1; }
.cl h4 { margin:0; padding:9px 12px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--green); border-bottom:1px solid var(--border); background:#F3F2EA; position:sticky; top:0; }
.cl ol { list-style:none; margin:0; padding:0; overflow-y:auto; }
.cl li { display:flex; gap:8px; padding:7px 12px; font-size:13.5px; line-height:1.35; cursor:pointer; border-bottom:1px solid #EEF0E5; } .cl li:hover { background:#F6F5EE; }
.cl li b { color:var(--muted); min-width:22px; text-align:right; font-weight:700; }
.cl li.act { background:color-mix(in srgb, #C49A36 30%, #FDFDFA); } .cl li.cross { background:color-mix(in srgb, #C49A36 12%, #FDFDFA); }
.cl li.filled { color:#9A9D8E; } .cl li.filled b { color:#B5B8A8; }
.cl li em { font-style:normal; color:var(--muted); font-size:12px; white-space:nowrap; }
#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#2F3A56; color:#fff; padding:10px 18px; font-size:14px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .25s; z-index:300; max-width:calc(100vw - 24px); text-align:center; } #toast.on { opacity:1; }
.ov { position:fixed; inset:0; z-index:200; background:rgba(42,46,36,.4); display:flex; align-items:center; justify-content:center; padding:16px; }
.win { background:#FDFDFA; border:1px solid var(--border); width:100%; max-width:380px; text-align:center; padding:28px 26px 24px; box-shadow:0 30px 80px rgba(42,46,36,.3); animation:pop .35s cubic-bezier(.3,1.4,.5,1) both; } @keyframes pop { from { transform:scale(.85); opacity:0; } }
.win h3 { margin:0 0 4px; font:italic 400 30px Georgia,serif; } .win .big-t { font-family:'Roboto Mono',monospace; font-size:38px; font-weight:700; margin:10px 0 4px; } .win .sub { color:var(--muted); font-size:13.5px; line-height:1.6; margin-bottom:16px; }
.panel { background:#FDFDFA; border:1px solid var(--border); width:100%; max-width:400px; box-shadow:0 30px 80px rgba(42,46,36,.3); max-height:calc(100dvh - 32px); overflow-y:auto; }
.panel h3 { margin:0; padding:20px 24px 6px; font:italic 400 24px Georgia,serif; }
.srow { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:13px 24px; border-bottom:1px solid #E6E8DA; } .srow b { font-size:14px; font-weight:600; display:block; } .srow span.d { font-size:12px; color:var(--muted); display:block; margin-top:2px; }
.sw { width:44px; height:24px; flex-shrink:0; background:#C9CCBB; border:none; position:relative; cursor:pointer; padding:0; } .sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; transition:transform .15s; } .sw.on { background:var(--green); } .sw.on::after { transform:translateX(20px); }
.seg3 { display:flex; border:1px solid var(--border); background:#F3F2EA; flex-shrink:0; } .seg3 button { border:none; border-right:1px solid var(--border); background:none; padding:7px 11px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; } .seg3 button:last-child { border-right:none; } .seg3 button.on { background:var(--green); color:#fff; }
.themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:8px 24px 14px; } .th { border:2px solid transparent; background:none; padding:4px; cursor:pointer; font-size:11.5px; color:var(--muted); } .th.on { border-color:var(--green); color:var(--text); font-weight:700; } .th i { display:block; aspect-ratio:1/1; margin-bottom:4px; box-shadow:0 0 0 1px rgba(42,46,36,.15); }

@media (max-width:900px) {
  body { padding:8px; }
  #game { flex-direction:column; align-items:stretch; gap:10px; max-width:640px; }
  #clues { width:100%; max-height:none; display:none; flex-direction:column; } #clues.open { display:flex; }
  .cl ol { max-height:30vh; }
  #grid-wrap { max-height:calc(100dvh - 396px); min-height:150px; }
  .content { padding:0 16px; }
}

<body>

<div id="menu" class="modal">
  <a class="back-hub" href="../">← Все игры</a>

<script type="text/plain" id="cw-engine">
// ============ Кроссворд: генератор сетки по словарю ============
// Слова расставляются по одному: каждое новое пересекается с уже стоящими по общей букве, не касаясь других слов боками.
var CW = (function () {
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  const SIZES = { small: { words: 9, box: 11, minLen: 3 }, medium: { words: 15, box: 15, minLen: 3 }, large: { words: 22, box: 19, minLen: 3 } };

  // Одна попытка построения. Возвращает { cells: Map, words: [...] } или null
  function attempt(pool, theme, S, rnd) {
    const M = 2 * S.box + 4, grid = Array.from({ length: M }, () => new Array(M).fill('')), dirs = Array.from({ length: M }, () => new Array(M).fill(0));
    const placed = [], used = new Set(); let minR = M, maxR = -1, minC = M, maxC = -1;
    const byLetter = {};
    pool.forEach((e, idx) => { for (let j = 0; j < e.w.length; j++) { const L = e.w[j]; (byLetter[L] = byLetter[L] || []).push([idx, j]); } });
    function bboxWith(r, c, dir, len) { const r2 = dir ? r + len - 1 : r, c2 = dir ? c : c + len - 1; return [Math.min(minR, r), Math.max(maxR, r2), Math.min(minC, c), Math.max(maxC, c2)]; }
    // проверка размещения; возвращает число пересечений или -1
    function check(w, r, c, dir) {
      const dr = dir ? 1 : 0, dc = dir ? 0 : 1, len = w.length;
      if (r < 1 || c < 1 || r + dr * (len - 1) >= M - 1 || c + dc * (len - 1) >= M - 1) return -1;
      const bb = bboxWith(r, c, dir, len); if (bb[1] - bb[0] + 1 > S.box || bb[3] - bb[2] + 1 > S.box) return -1;
      if (grid[r - dr][c - dc] || grid[r + dr * len][c + dc * len]) return -1;
      let cross = 0;
      for (let k = 0; k < len; k++) {
        const rr = r + dr * k, cc = c + dc * k, cur = grid[rr][cc];
        if (cur) { if (cur !== w[k]) return -1; if (dirs[rr][cc] & (dir ? 2 : 1)) return -1; cross++; }
        else { if (grid[rr - dc][cc - dr] || grid[rr + dc][cc + dr]) return -1; }      // боковые соседи свободной клетки должны быть пусты
      }
      return cross;
    }
    function put(e, r, c, dir) {
      const dr = dir ? 1 : 0, dc = dir ? 0 : 1;
      for (let k = 0; k < e.w.length; k++) { grid[r + dr * k][c + dc * k] = e.w[k]; dirs[r + dr * k][c + dc * k] |= dir ? 2 : 1; }
      const bb = bboxWith(r, c, dir, e.w.length); minR = bb[0]; maxR = bb[1]; minC = bb[2]; maxC = bb[3];
      placed.push({ e, r, c, dir }); used.add(e.w);
    }
    // первое слово: длинное, по горизонтали, в центре
    const firsts = pool.filter((e) => e.w.length >= 6 && e.w.length <= Math.min(S.box - 2, 9) && (!theme || e.t === theme));
    const f = (firsts.length ? firsts : pool)[(rnd() * (firsts.length || pool.length)) | 0];
    put(f, (M / 2) | 0, ((M - f.w.length) / 2) | 0, 0);
    let fails = 0;
    while (placed.length < S.words && fails < 3) {
      const cand = []; const order = shuffle(placed.map((_, i) => i), rnd);
      outer: for (const pi of order) {
        const pw = placed[pi], dir = pw.dir ? 0 : 1;
        for (const ci of shuffle(Array.from({ length: pw.e.w.length }, (_, i) => i), rnd)) {
          const L = pw.e.w[ci], pr = pw.r + (pw.dir ? ci : 0), pc = pw.c + (pw.dir ? 0 : ci), opts = byLetter[L] || [];
          const start = (rnd() * opts.length) | 0;
          for (let q = 0; q < Math.min(opts.length, 40); q++) {
            const [idx, j] = opts[(start + q) % opts.length], e = pool[idx]; if (used.has(e.w)) continue;
            const r = dir ? pr - j : pr, c = dir ? pc : pc - j, cross = check(e.w, r, c, dir); if (cross < 0) continue;
            const bb = bboxWith(r, c, dir, e.w.length), area = (bb[1] - bb[0] + 1) * (bb[3] - bb[2] + 1);
            cand.push({ e, r, c, dir, score: cross * 4 - area / 25 + (theme && e.t === theme ? 2.5 : 0) + rnd() * 1.5 });
            if (cand.length >= 40) break outer;
          }
        }
      }
      if (!cand.length) { fails++; continue; }
      cand.sort((a, b) => b.score - a.score); const pick = cand[Math.min(cand.length - 1, (rnd() * rnd() * 4) | 0)]; put(pick.e, pick.r, pick.c, pick.dir);
    }
    return { grid, placed, box: [minR, maxR, minC, maxC] };
  }

  // Строит готовый кроссворд: обрезает поле, нумерует слова, выбирает вопросы
  function finalize(res, rnd, size, theme) {
    const [r0, r1, c0, c1] = res.box, rows = r1 - r0 + 1, cols = c1 - c0 + 1;
    const grid = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => res.grid[r0 + r][c0 + c]));
    const startAt = {}; res.placed.forEach((p, i) => { startAt[(p.r - r0) + ',' + (p.c - c0) + ',' + p.dir] = i; });
    let n = 0; const words = [], numAt = {};
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (!grid[r][c]) continue;
      const a = startAt[r + ',' + c + ',0'], d = startAt[r + ',' + c + ',1']; if (a === undefined && d === undefined) continue;
      n++; numAt[r + ',' + c] = n;
      for (const [idx, dir] of [[a, 0], [d, 1]]) if (idx !== undefined) { const p = res.placed[idx], clues = p.e.clues; words.push({ n, dir: dir ? 'down' : 'across', r, c, len: p.e.w.length, answer: p.e.w, clue: clues[(rnd() * clues.length) | 0], theme: p.e.t }); }
    }
    return { rows, cols, grid, words, numAt, size, theme: theme || null };
  }

  // Главная функция. dict — массив {w, t, clues}; opts: { size, theme, rnd, attempts }
  function generate(dict, opts) {
    const size = opts.size || 'medium', S = SIZES[size], rnd = opts.rnd || Math.random, theme = opts.theme || null; let best = null;
    const pool = dict.filter((e) => e.w.length >= S.minLen && e.w.length <= S.box - 1);
    const themed = theme ? pool.filter((e) => e.t === theme) : [];
    const stages = theme && themed.length >= 30 ? [{ p: themed, n: 30 }, { p: pool, n: 40 }] : [{ p: pool, n: 40 }];   // сначала только слова темы, потом — с добавкой других
    for (const st of stages) {
      for (let a = 0; a < (opts.attempts || st.n); a++) {
        const res = attempt(st.p, theme, S, rnd); if (!res) continue;
        const crossings = res.placed.reduce((sum, p) => sum + p.e.w.length, 0) - new Set(res.grid.flatMap((row, r) => row.map((v, c) => (v ? r + ',' + c : null)).filter(Boolean))).size;
        const area = (res.box[1] - res.box[0] + 1) * (res.box[3] - res.box[2] + 1), score = res.placed.length * 100 + crossings * 3 - area * 0.2;
        if (!best || score > best.score) best = { res, score };
        if (res.placed.length >= S.words && crossings >= Math.floor(S.words * 0.6)) break;
      }
      if (best && best.res.placed.length >= S.words) break;      // цели достигли на словах темы — смешивать не нужно
    }
    if (!best) return null; const out = finalize(best.res, rnd, size, theme); out.target = S.words; return out;
  }

  // Независимая проверка готового кроссворда (для тестов): возвращает список проблем
  function validate(p, dictMap) {
    const bad = []; const { grid, rows, cols, words } = p;
    const runs = [];
    for (let r = 0; r < rows; r++) { let c = 0; while (c < cols) { if (grid[r][c]) { let e = c; while (e < cols && grid[r][e]) e++; if (e - c >= 2) runs.push({ dir: 'across', r, c, len: e - c, s: grid[r].slice(c, e).join('') }); c = e; } else c++; } }
    for (let c = 0; c < cols; c++) { let r = 0; while (r < rows) { if (grid[r][c]) { let e = r; while (e < rows && grid[e][c]) e++; if (e - r >= 2) runs.push({ dir: 'down', r, c, len: e - r, s: grid.slice(r, e).map((row) => row[c]).join('') }); r = e; } else r++; } }
    if (runs.length !== words.length) bad.push(`слов в списке ${words.length}, а отрезков на поле ${runs.length}`);
    for (const w of words) {
      const run = runs.find((x) => x.dir === w.dir && x.r === w.r && x.c === w.c);
      if (!run) bad.push(`слово «${w.answer}» не совпадает с отрезком на поле`); else if (run.s !== w.answer || run.len !== w.len) bad.push(`на поле «${run.s}», а в списке «${w.answer}»`);
      if (dictMap && !dictMap[w.answer]) bad.push(`слова «${w.answer}» нет в словаре`);
      if (!w.clue) bad.push(`нет вопроса к «${w.answer}»`);
    }
    const ans = words.map((w) => w.answer); if (new Set(ans).size !== ans.length) bad.push('есть повторяющиеся слова');
    // связность
    const cells = []; grid.forEach((row, r) => row.forEach((v, c) => v && cells.push(r + ',' + c))); const seen = new Set([cells[0]]), q = [cells[0]];
    while (q.length) { const [r, c] = q.pop().split(',').map(Number); for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (r + a) + ',' + (c + b); if (grid[r + a] && grid[r + a][c + b] && !seen.has(k)) { seen.add(k); q.push(k); } } }
    if (seen.size !== cells.length) bad.push('поле несвязное');
    // нумерация: номера идут по порядку чтения, у пары слов с общим стартом номер одинаковый
    let last = 0; for (const w of words) { if (w.n < last) bad.push('нумерация нарушена'); last = w.n; }
    return bad;
  }
  return { generate, validate, mulberry32, shuffle, SIZES };
})();
if (typeof module !== 'undefined') module.exports = CW;

</script>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);

$('ver').textContent = 'Версия ' + BUILD;
const THEMES = [...new Set(DICT.map((e) => e.t))];
$('theme').innerHTML = '<option value="">Любая тема (всё вперемешку)</option>' + THEMES.map((t) => `<option value="${t}">${t}</option>`).join('');

const pad2 = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const dayBefore = (key) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d - 1)); };
const fmt = (ms) => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + ':' + pad2(m) : m) + ':' + pad2(s % 60); };
let toastT = null; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2000); }
const plural = (n, a, b, c) => (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? b : c);

/* ---------- размеры ---------- */
function resize() {
  if (!S) return; const P = S.puz, stacked = innerWidth <= 900;
  const availW = stacked ? innerWidth - 20 : innerWidth - 24 - 360 - 24, availH = stacked ? innerHeight - 396 : innerHeight - 24 - 52 - 62 - 130 - (kbOn() ? 0 : 0);
  const cell = Math.floor(Math.min(availW / P.cols, availH / P.rows, 46));
  document.documentElement.style.setProperty('--cw', Math.max(stacked ? 26 : 24, cell) + 'px');
}
addEventListener('resize', () => { resize(); });

/* ---------- состояние партии ---------- */
function indexPuzzle(P) {
  P.cellWords = {}; const key = (r, c) => r * P.cols + c;
  P.words.forEach((w, i) => { for (let k = 0; k < w.len; k++) { const r = w.r + (w.dir === 'down' ? k : 0), c = w.c + (w.dir === 'across' ? k : 0), e = (P.cellWords[key(r, c)] = P.cellWords[key(r, c)] || { across: -1, down: -1 }); e[w.dir] = i; } });
}
function newState(puz, meta) {
  indexPuzzle(puz);
  const first = puz.words[0];
  return Object.assign({ puz, val: new Array(puz.rows * puz.cols).fill(''), hinted: new Array(puz.rows * puz.cols).fill(false), sel: first.r * puz.cols + first.c, dir: first.dir, time: 0, hints: 0, paused: false, done: false, checkAll: false, checkWord: -1 }, meta);
}
function startNew(size, theme, daily) {
  const dateKey = daily ? todayKey() : null; let p;
  const rnd = daily ? CW.mulberry32((Number(dateKey.replace(/-/g, '')) ^ 0x2545F491) >>> 0) : Math.random;
  p = CW.generate(DICT, { size: daily ? 'medium' : size, theme: daily ? null : (theme || null), rnd });
  if (!p) { toast('Не удалось составить кроссворд, попробуйте ещё раз'); return; }
  S = newState(p, { size: daily ? 'medium' : size, theme: daily ? null : (theme || null), daily: !!daily, dateKey }); openGame(); persist();
}
function persist() { if (!S || S.done) return; const P = S.puz; store(LS.save, { v: 1, size: S.size, theme: S.theme, daily: S.daily, dateKey: S.dateKey, puz: { rows: P.rows, cols: P.cols, grid: P.grid, words: P.words, numAt: P.numAt, size: P.size, theme: P.theme }, val: S.val, hinted: S.hinted, time: S.time, hints: S.hints, sel: S.sel, dir: S.dir }); }
function resume() { const d = load(LS.save, null); if (!d || !d.puz) return false; indexPuzzle(d.puz); S = Object.assign({ paused: false, done: false, checkAll: false, checkWord: -1 }, d); openGame(); return true; }

/* ---------- геометрия ---------- */
const P_ = () => S.puz;
const ansAt = (i) => { const P = S.puz; return P.grid[(i / P.cols) | 0][i % P.cols]; };
const isCell = (r, c) => S.puz.grid[r] && S.puz.grid[r][c];
const wordCells = (w) => { const P = S.puz, out = []; for (let k = 0; k < w.len; k++) out.push((w.r + (w.dir === 'down' ? k : 0)) * P.cols + w.c + (w.dir === 'across' ? k : 0)); return out; };
const activeIdx = () => { const e = S.puz.cellWords[S.sel]; if (!e) return -1; return e[S.dir] >= 0 ? e[S.dir] : (e[S.dir === 'across' ? 'down' : 'across']); };
function fixDir() { const e = S.puz.cellWords[S.sel]; if (e && e[S.dir] < 0) S.dir = S.dir === 'across' ? 'down' : 'across'; }

/* ---------- построение поля ---------- */
function buildGrid() {
  const P = S.puz, g = $('cgrid'); g.innerHTML = ''; g.style.gridTemplateColumns = `repeat(${P.cols}, var(--cw))`; g.style.gridTemplateRows = `repeat(${P.rows}, var(--cw))`; S.cells = [];
  for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) {
    const d = document.createElement('div'), i = r * P.cols + c;
    if (P.grid[r][c]) { d.className = 'c l'; const n = P.numAt[r + ',' + c]; d.innerHTML = (n ? `<span class="num">${n}</span>` : '') + '<span class="ch"></span>'; d.onclick = () => clickCell(i); }
    else d.className = 'c';
    g.appendChild(d); S.cells.push(d);
  }
  const A = $('cl-a'), D = $('cl-d'); A.innerHTML = D.innerHTML = '';
  P.words.forEach((w, i) => { const li = document.createElement('li'); li.dataset.i = i; li.innerHTML = `<b>${w.n}</b><span>${w.clue} <em>(${w.len})</em></span>`; li.onclick = () => selectWord(i, true); (w.dir === 'across' ? A : D).appendChild(li); w.li = li; });
}

/* ---------- ввод ---------- */
function clickCell(i) { if (S.paused) return; const e = S.puz.cellWords[i]; if (i === S.sel && e && e.across >= 0 && e.down >= 0) S.dir = S.dir === 'across' ? 'down' : 'across'; else { S.sel = i; fixDir(); } render(); persist(); }
function selectWord(wi, focusEmpty) {
  if (S.paused) return; const w = S.puz.words[wi], cells = wordCells(w); S.dir = w.dir; S.sel = (focusEmpty && cells.find((i) => !S.val[i])) || cells[0]; if (window.matchMedia('(max-width:900px)').matches) $('clues').classList.remove('open'); render(); persist();
}
function stepInWord(delta) { const wi = activeIdx(); if (wi < 0) return; const cells = wordCells(S.puz.words[wi]), p = cells.indexOf(S.sel), n = p + delta; if (n >= 0 && n < cells.length) S.sel = cells[n]; }
function typeLetter(ch) {
  if (!S || S.done || S.paused) return; ch = ch.toLowerCase().replace('ё', 'е'); if (!/^[а-я]$/.test(ch)) return;
  S.val[S.sel] = ch; S.checkAll = false; S.checkWord = -1; stepInWord(1); after();
}
function backspace() {
  if (!S || S.done || S.paused) return; S.checkAll = false; S.checkWord = -1;
  if (S.val[S.sel]) { if (S.hinted[S.sel]) { stepInWord(-1); } else S.val[S.sel] = ''; } else { stepInWord(-1); if (!S.hinted[S.sel]) S.val[S.sel] = ''; }
  after();
}
function after() { render(); persist(); const P = S.puz; let ok = true; for (let r = 0; r < P.rows; r++) for (let c = 0; c < P.cols; c++) if (P.grid[r][c] && S.val[r * P.cols + c] !== P.grid[r][c]) ok = false; if (ok) win(); }
function moveArrow(dr, dc) {
  const P = S.puz; let r = (S.sel / P.cols) | 0, c = S.sel % P.cols; const nd = dr ? 'down' : 'across';
  let nr = r + dr, nc = c + dc; while (nr >= 0 && nr < P.rows && nc >= 0 && nc < P.cols && !P.grid[nr][nc]) { nr += dr; nc += dc; }
  if (nr < 0 || nr >= P.rows || nc < 0 || nc >= P.cols) return; S.sel = nr * P.cols + nc; if (S.puz.cellWords[S.sel][nd] >= 0) S.dir = nd; fixDir(); render(); persist();
}
function nextWord(delta) { const wi = activeIdx(), n = S.puz.words.length; selectWord(((wi < 0 ? 0 : wi) + delta + n) % n, true); }

/* ---------- подсказки и проверка ---------- */
function revealLetter() { if (!S || S.done || S.paused) return; if (S.val[S.sel] === ansAt(S.sel)) { toast('Эта буква уже верная'); return; } S.val[S.sel] = ansAt(S.sel); S.hinted[S.sel] = true; S.hints++; flash(S.sel); stepInWord(1); after(); }
function revealWord() { if (!S || S.done || S.paused) return; const wi = activeIdx(); if (wi < 0) return; let n = 0; for (const i of wordCells(S.puz.words[wi])) if (S.val[i] !== ansAt(i)) { S.val[i] = ansAt(i); S.hinted[i] = true; n++; } if (!n) { toast('Слово уже отгадано'); return; } S.hints += n; after(); }
function checkWord() { if (!S || S.done || S.paused) return; const wi = activeIdx(); if (wi < 0) return; const bad = wordCells(S.puz.words[wi]).filter((i) => S.val[i] && S.val[i] !== ansAt(i)).length; S.checkWord = wi; S.checkAll = false; render(); toast(bad ? `В этом слове неверных букв: ${bad}` : 'Ошибок в этом слове нет'); }
function checkAll() { if (!S || S.done || S.paused) return; const P = S.puz; let bad = 0; S.val.forEach((v, i) => { if (v && P.grid[(i / P.cols) | 0][i % P.cols] && v !== ansAt(i)) bad++; }); S.checkAll = true; S.checkWord = -1; render(); toast(bad ? `Неверных букв: ${bad}` : 'Ошибок нет — всё, что вписано, верно'); }
function flash(i) { const el = S.cells[i]; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

/* ---------- победа ---------- */
function win() {
  S.done = true; localStorage.removeItem(LS.save); const t = S.time; render();
  stats.solved[S.size] = (stats.solved[S.size] || 0) + 1; if (!stats.best[S.size] || t < stats.best[S.size]) stats.best[S.size] = t; let extra = '';
  if (S.daily) { const d = stats.daily; if (!d.results[S.dateKey]) { d.streak = d.last === dayBefore(S.dateKey) ? d.streak + 1 : 1; d.last = S.dateKey; d.results[S.dateKey] = t; } extra = `<br>Серия дней подряд: <b>${d.streak}</b>`; }
  store(LS.stats, stats);
  const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'win-ov';
  ov.innerHTML = `<div class="win"><h3>Кроссворд разгадан!</h3><div class="big-t">${fmt(t)}</div><div class="sub">${S.daily ? 'Кроссворд дня' : SIZE[S.size]}${S.theme ? ' · ' + S.theme : ''}${stats.best[S.size] === t ? ' — <b>новый рекорд!</b>' : ''}<br>Подсказок: <b>${S.hints}</b>${extra}</div><button class="big" id="w-again">Ещё один</button><button class="big light" id="w-menu">В меню</button></div>`;
  document.body.appendChild(ov);
  $('w-again').onclick = () => { ov.remove(); startNew(S.daily ? prefs.size : S.size, S.daily ? prefs.theme : S.theme, false); }; $('w-menu').onclick = () => { ov.remove(); showMenu(); };
}

/* ---------- отрисовка ---------- */
function render() {
  if (!S) return; const P = S.puz, wi = activeIdx(), aw = wi >= 0 ? new Set(wordCells(P.words[wi])) : new Set(), cw = S.puz.cellWords[S.sel] || {}, other = wi >= 0 && cw[P.words[wi].dir === 'across' ? 'down' : 'across'] >= 0 ? cw[P.words[wi].dir === 'across' ? 'down' : 'across'] : -1;
  const chkSet = S.checkWord >= 0 ? new Set(wordCells(P.words[S.checkWord])) : null; let filled = 0;
  for (let i = 0; i < S.cells.length; i++) {
    const el = S.cells[i]; if (!P.grid[(i / P.cols) | 0][i % P.cols]) continue; const v = S.val[i]; if (v) filled++;
    let cls = 'c l'; if (aw.has(i)) cls += ' aw'; if (i === S.sel) cls += ' ac'; if (S.hinted[i]) cls += ' hint';
    if (v && v !== ansAt(i) && (prefs.autoCheck || S.checkAll || (chkSet && chkSet.has(i)))) cls += ' bad';
    if (el.className !== cls) el.className = cls; el.lastChild.textContent = v;
  }
  $('fill-n').textContent = filled + ' / ' + document.querySelectorAll('#cgrid .c.l').length; $('hints').textContent = S.hints; $('words-n').textContent = P.words.length;
  if (wi >= 0) { const w = P.words[wi]; $('clue-text').innerHTML = `<small>${w.n} ${w.dir === 'across' ? 'по горизонтали' : 'по вертикали'} · ${w.len} ${plural(w.len, 'буква', 'буквы', 'букв')}</small>${w.clue}`; }
  P.words.forEach((w, i) => { const fl = wordCells(w).every((k) => S.val[k]); w.li.className = (i === wi ? 'act ' : i === other ? 'cross ' : '') + (fl ? 'filled' : ''); });
  if (wi >= 0) { const li = P.words[wi].li, box = li.parentNode; if (li.offsetTop < box.scrollTop || li.offsetTop + li.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = Math.max(0, li.offsetTop - 40); }
  $('lv').innerHTML = (S.daily ? 'Кроссворд дня' : SIZE[S.size]) + `<small>${S.daily ? S.dateKey : (S.theme || 'Любая тема')}</small>`; $('timer').textContent = fmt(S.time);
  const sc = S.cells[S.sel], wrap = $('grid-wrap'); if (sc) { const l = sc.offsetLeft, t = sc.offsetTop; if (l < wrap.scrollLeft || l + sc.offsetWidth > wrap.scrollLeft + wrap.clientWidth) wrap.scrollLeft = l - wrap.clientWidth / 2; if (t < wrap.scrollTop || t + sc.offsetHeight > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = t - wrap.clientHeight / 2; }
}

/* ---------- таймер и пауза ---------- */
setInterval(() => { const now = performance.now(); if (S && !S.paused && !S.done && !$('game').classList.contains('hidden')) { S.time += now - lastTick; $('timer').textContent = fmt(S.time); } lastTick = now; }, 250);
setInterval(() => { if (S && !S.done && !$('game').classList.contains('hidden')) persist(); }, 5000);
function setPause(p) { if (!S || S.done) return; S.paused = p; $('pause-ov').style.display = p ? 'flex' : 'none'; $('pause-btn').textContent = p ? 'Играть' : 'Пауза'; if (!p) lastTick = performance.now(); persist(); }
$('pause-btn').onclick = () => setPause(!S.paused); $('pause-ov').onclick = () => setPause(false);
document.addEventListener('visibilitychange', () => { if (document.hidden && S && !S.done && !$('game').classList.contains('hidden')) setPause(true); });

/* ---------- клавиатура: русская и (на английской раскладке) по положению клавиш ---------- */
const CODE2RU = { KeyQ: 'й', KeyW: 'ц', KeyE: 'у', KeyR: 'к', KeyT: 'е', KeyY: 'н', KeyU: 'г', KeyI: 'ш', KeyO: 'щ', KeyP: 'з', BracketLeft: 'х', BracketRight: 'ъ', KeyA: 'ф', KeyS: 'ы', KeyD: 'в', KeyF: 'а', KeyG: 'п', KeyH: 'р', KeyJ: 'о', KeyK: 'л', KeyL: 'д', Semicolon: 'ж', Quote: 'э', KeyZ: 'я', KeyX: 'ч', KeyC: 'с', KeyV: 'м', KeyB: 'и', KeyN: 'т', KeyM: 'ь', Comma: 'б', Period: 'ю', Backquote: 'е' };
document.addEventListener('keydown', (e) => {
  if (!S || $('game').classList.contains('hidden') || document.querySelector('.ov')) return;
  if (S.paused) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setPause(false); } return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[а-яёА-ЯЁ]$/.test(e.key)) { e.preventDefault(); typeLetter(e.key); return; }
  if (/^[a-zA-Z\[\]\\;',.`]$/.test(e.key) && CODE2RU[e.code]) { e.preventDefault(); typeLetter(CODE2RU[e.code]); return; }
  const arrows = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
  if (arrows[e.key]) { e.preventDefault(); moveArrow(...arrows[e.key]); return; }
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); } else if (e.key === 'Delete') { e.preventDefault(); if (S.val[S.sel] && !S.hinted[S.sel]) { S.val[S.sel] = ''; S.checkAll = false; S.checkWord = -1; after(); } }
  else if (e.key === ' ') { e.preventDefault(); clickCell(S.sel); } else if (e.key === 'Tab') { e.preventDefault(); nextWord(e.shiftKey ? -1 : 1); } else if (e.key === 'Enter') { e.preventDefault(); nextWord(1); }
});
$('prev-clue').onclick = () => S && nextWord(-1); $('next-clue').onclick = () => S && nextWord(1);
$('t-check').onclick = checkWord; $('t-checkall').onclick = checkAll; $('t-letter').onclick = revealLetter; $('t-word').onclick = revealWord; $('t-list').onclick = () => $('clues').classList.toggle('open');

/* ---------- экранная клавиатура ---------- */
(function buildKb() {
  const rows = ['йцукенгшщзхъ', 'фывапролджэ', 'ячсмитьбю'], kb = $('kb');
  rows.forEach((r, ri) => { const d = document.createElement('div'); d.className = 'row'; for (const ch of r) { const b = document.createElement('button'); b.textContent = ch; b.dataset.ch = ch; b.onclick = () => typeLetter(ch); d.appendChild(b); } if (ri === 2) { const bs = document.createElement('button'); bs.className = 'wide'; bs.textContent = '⌫'; bs.setAttribute('aria-label', 'Стереть'); bs.onclick = backspace; d.appendChild(bs); } kb.appendChild(d); });
})();
const kbOn = () => prefs.kb === 'on' || (prefs.kb === 'auto' && (window.matchMedia('(pointer: coarse)').matches || innerWidth <= 900));
function applyKb() { $('kb').classList.toggle('on', kbOn()); resize(); }
addEventListener('resize', applyKb);

/* ---------- меню ---------- */
function openGame() { $('menu').classList.add('hidden'); $('game').classList.remove('hidden'); buildGrid(); $('pause-ov').style.display = S.paused ? 'flex' : 'none'; $('pause-btn').textContent = S.paused ? 'Играть' : 'Пауза'; lastTick = performance.now(); fixDir(); applyKb(); render(); }
function showMenu() { if (S && !S.done) persist(); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
$('menu-btn').onclick = showMenu;
function renderMenu() {
  const sv = load(LS.save, null); $('resume-card').classList.toggle('hidden', !sv);
  if (sv) { const filled = sv.val.filter(Boolean).length, total = sv.puz.grid.flat().filter(Boolean).length; $('resume-info').textContent = `${sv.daily ? 'Кроссворд дня' : SIZE[sv.size] + (sv.theme ? ' · ' + sv.theme : '')} · ${fmt(sv.time)} · заполнено ${filled} из ${total}`; }
  const tk = todayKey(), d = stats.daily;
  $('daily-info').innerHTML = d.results[tk] != null ? `Разгадан сегодня за ${fmt(d.results[tk])} ✓ · серия: ${d.streak}` : (d.streak && d.last === dayBefore(tk) ? `Не прерывайте серию: ${d.streak} дн. подряд` : 'Один и тот же кроссворд для всех, каждый день новый');
  $('daily-btn').textContent = d.results[tk] != null ? 'Ещё раз' : 'Играть';
  document.querySelectorAll('#sizes button').forEach((b) => b.classList.toggle('on', b.dataset.s === prefs.size)); $('theme').value = prefs.theme;
  $('stats').innerHTML = '<tr><th>Размер</th><th>Разгадано</th><th>Лучшее время</th></tr>' + Object.keys(SIZE).map((k) => `<tr><td>${SIZE[k]}</td><td>${stats.solved[k] || 0}</td><td>${stats.best[k] != null ? fmt(stats.best[k]) : '—'}</td></tr>`).join('');
}
document.querySelectorAll('#sizes button').forEach((b) => { b.onclick = () => { prefs.size = b.dataset.s; store(LS.prefs, prefs); renderMenu(); }; });
$('theme').onchange = () => { prefs.theme = $('theme').value; store(LS.prefs, prefs); };
$('new-btn').onclick = () => startNew(prefs.size, prefs.theme, false);
$('daily-btn').onclick = () => startNew('medium', null, true);
$('resume-btn').onclick = () => { if (!resume()) renderMenu(); };

/* ---------- настройки ---------- */
$('open-prefs').onclick = () => {
  if ($('prefs-ov')) return; const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'prefs-ov';
  function paint() {
    const th = window.PGS ? PGS.THEMES : {}, cur = window.PGS ? PGS.get().board : 'classic';
    ov.innerHTML = `<div class="panel"><h3>Настройки</h3>
      <div class="srow"><div><b>Показывать ошибки сразу</b><span class="d">Неверные буквы подсвечиваются красным по мере ввода</span></div><button class="sw ${prefs.autoCheck ? 'on' : ''}" id="p-auto"></button></div>
      <div class="srow"><div><b>Экранная клавиатура</b><span class="d">Авто — только на телефонах и планшетах</span></div><div class="seg3" id="p-kb"><button data-v="auto" class="${prefs.kb === 'auto' ? 'on' : ''}">Авто</button><button data-v="on" class="${prefs.kb === 'on' ? 'on' : ''}">Вкл</button><button data-v="off" class="${prefs.kb === 'off' ? 'on' : ''}">Выкл</button></div></div>
      <div style="padding:14px 24px 0;font-size:14px;font-weight:600">Оформление</div><div class="themes">${Object.entries(th).map(([k, t]) => `<button class="th ${cur === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
      <button class="big" id="prefs-close" style="width:calc(100% - 48px);margin:6px 24px 22px;box-shadow:none">Готово</button></div>`;
    $('p-auto').onclick = () => { prefs.autoCheck = !prefs.autoCheck; store(LS.prefs, prefs); paint(); render(); };
    ov.querySelectorAll('#p-kb button').forEach((b) => { b.onclick = () => { prefs.kb = b.dataset.v; store(LS.prefs, prefs); paint(); applyKb(); }; });
    ov.querySelectorAll('.th').forEach((b) => { b.onclick = () => { PGS.set({ board: b.dataset.b }); paint(); }; }); $('prefs-close').onclick = () => ov.remove();
  }
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); }); paint(); document.body.appendChild(ov);
};

/* ---------- PWA и тестовые хуки ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('service-worker.js').catch(() => {});
window.__cw = { get S() { return S; }, CW, DICT, startNew, typeLetter, backspace, clickCell, selectWord, revealLetter, revealWord, checkWord, checkAll, get prefs() { return prefs; }, get stats() { return stats; }, showMenu, setPause, todayKey, activeIdx };
renderMenu();
})();
</script>
</body>
</html>
