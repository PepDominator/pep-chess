<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF0E7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pep Crossword</title>
<script>
// ============ Общие настройки Pep Games (одни и те же во всех трёх страницах: общее меню, шахматы, шашки) ============
(function () {
  if (window.PGS) return;
  const KEY = 'pgSettings';
  const THEMES = {
    classic: { n: 'Классика', l: '#F6F4EB', d: '#C7CAB4' },
    green: { n: 'Зелёная', l: '#EEEED2', d: '#769656' },
    blue: { n: 'Голубая', l: '#DEE3E6', d: '#8CA2AD' },
    wood: { n: 'Дерево', l: '#F0D9B5', d: '#B58863' }
  };
  const DEFAULTS = { sound: true, confirm: false, board: 'classic', nums: true, chat: true, showGames: true };
  function get() { try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { return Object.assign({}, DEFAULTS); } }
  function apply() {
    const s = get(), t = THEMES[s.board] || THEMES.classic, r = document.documentElement;
    r.style.setProperty('--sq-light', t.l); r.style.setProperty('--sq-dark', t.d); r.classList.toggle('no-nums', !s.nums);
  }
  function set(patch) { const v = Object.assign(get(), patch); try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} apply(); window.dispatchEvent(new Event('pgs-change')); return v; }
  window.PGS = { get, set, apply, THEMES };
  // Звук: одно место, через которое проходят все звуки приложения.
  const origPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () { if (!get().sound) return Promise.resolve(); return origPlay.apply(this, arguments); };
  apply(); window.addEventListener('storage', (e) => { if (e.key === KEY) apply(); });
  window.addEventListener('pgsync-applied', (e) => { if (e.detail && e.detail.key === KEY) { apply(); window.dispatchEvent(new Event('pgs-change')); } });

  const css = `
.pg-gear { position:absolute; top:12px; right:14px; background:none; border:none; font-size:20px; line-height:1; color:#8B8E7F; cursor:pointer; padding:4px 8px; z-index:3; font-family:inherit; }
.pg-gear:hover { color:#2A2E24; background:#EAEADF; } .pg-gear.static { position:static; }
.pg-ov { position:fixed; inset:0; z-index:400; background:rgba(42,46,36,.38); display:flex; align-items:center; justify-content:center; padding:16px; font-family:'Noto Sans',system-ui,sans-serif; }
.pg-panel { background:#FDFDFA; border:1px solid #D9DBCC; width:100%; max-width:420px; max-height:calc(100dvh - 32px); overflow-y:auto; box-shadow:0 30px 80px rgba(42,46,36,.3); color:#2A2E24; }
.pg-panel h3 { margin:0; padding:22px 24px 6px; font:italic 400 24px Georgia,'Times New Roman',serif; }
.pg-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 24px; border-bottom:1px solid #E6E8DA; }
.pg-row b { display:block; font-size:14px; font-weight:600; } .pg-row span.d { display:block; font-size:12px; color:#6E7568; margin-top:2px; line-height:1.4; }
.pg-sw { position:relative; width:44px; height:24px; flex-shrink:0; background:#C9CCBB; border:none; cursor:pointer; transition:background .15s; padding:0; }
.pg-sw::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff; transition:transform .15s; }
.pg-sw.on { background:#3B5D4A; } .pg-sw.on::after { transform:translateX(20px); }
.pg-themes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:6px 24px 16px; }
.pg-th { border:2px solid transparent; background:none; padding:4px; cursor:pointer; font:inherit; font-size:11.5px; color:#6E7568; text-align:center; }
.pg-th.on { border-color:#3B5D4A; color:#2A2E24; font-weight:700; }
.pg-th i { display:block; aspect-ratio:1/1; margin-bottom:4px; box-shadow:0 0 0 1px rgba(42,46,36,.15); }
.pg-title2 { padding:14px 24px 0; font-size:14px; font-weight:600; }
.pg-small { background:#F3F2EA; border:1px solid #D9DBCC; padding:7px 12px; font:700 12.5px 'Noto Sans',sans-serif; color:#2A2E24; cursor:pointer; flex-shrink:0; } .pg-small:hover { background:#EAEADF; }
.pg-close { display:block; width:calc(100% - 48px); margin:18px 24px 22px; padding:12px; background:#3B5D4A; color:#fff; border:none; font:700 14px inherit; cursor:pointer; }
#pg-confirm { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:350; display:none; align-items:center; gap:10px; background:#2F3A56; color:#fff; padding:10px 12px 10px 16px; box-shadow:0 10px 30px rgba(0,0,0,.35); font:600 14px 'Noto Sans',system-ui,sans-serif; max-width:calc(100vw - 20px); }
#pg-confirm button { border:none; padding:9px 14px; font:700 13px inherit; cursor:pointer; }
#pg-confirm .ok { background:#3B5D4A; color:#fff; } #pg-confirm .no { background:#EAEADF; color:#2A2E24; }
.snd-btn { background:none; border:none; font-size:15px; line-height:1; color:#6E7568; cursor:pointer; width:28px; height:28px; padding:0; border-radius:2px; } .snd-btn:hover { background:#EAEADF; color:#2A2E24; }
.pg-pending { box-shadow:inset 0 0 0 1000px rgba(47,58,86,.38) !important; }
.no-nums .sq .num { display:none !important; }`;
  const st = document.createElement('style'); st.textContent = css; (document.head || document.documentElement).appendChild(st);

  // ---- кнопка звука внутри партии: любая кнопка с классом snd-btn включает и выключает звук ----
  function paintSnd() { const on = get().sound; document.querySelectorAll('.snd-btn').forEach((b) => { b.textContent = on ? '🔊' : '🔇'; b.title = on ? 'Звук включён. Нажмите, чтобы выключить' : 'Звук выключен. Нажмите, чтобы включить'; b.setAttribute('aria-pressed', String(on)); }); }
  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('.snd-btn'); if (b) set({ sound: !get().sound }); });
  window.addEventListener('pgs-change', paintSnd); window.addEventListener('storage', (e) => { if (e.key === KEY) paintSnd(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paintSnd); else paintSnd();

  // ---- панель «Настройки» ----
  window.openPgSettings = function () {
    if (document.getElementById('pg-ov')) return;
    const ov = document.createElement('div'); ov.className = 'pg-ov'; ov.id = 'pg-ov';
    const isDr = !!window.PG_DRAUGHTS;
    function paint() {
      const s = get();
      const sw = (k) => `<button class="pg-sw ${s[k] ? 'on' : ''}" data-k="${k}" role="switch" aria-checked="${s[k]}"></button>`;
      ov.innerHTML = `<div class="pg-panel" role="dialog" aria-modal="true"><h3>Настройки</h3>
        <div class="pg-row"><div><b>Звук</b><span class="d">Звуки ходов, взятий и окончания партии</span></div>${sw('sound')}</div>
        <div class="pg-row"><div><b>Подтверждать ход</b><span class="d">После хода появляется кнопка «Подтвердить» — удобно на телефоне, чтобы не ходить случайно</span></div>${sw('confirm')}</div>
        <div class="pg-row"><div><b>Чат в партии</b><span class="d">Кнопка чата и сообщения соперника в онлайн-партиях. Выключите, если не хотите видеть сообщения</span></div>${sw('chat')}</div>
        <div id="pg-sync-row"></div>
        <div class="pg-row"><div><b>Показывать мои партии другим</b><span class="d">Ваши онлайн-партии (когда оба игрока вошли через Google и согласны) видны в профиле и в списке «Идущие партии». Действует на новые партии</span></div>${sw('showGames')}</div>
                ${isDr ? `<div class="pg-row"><div><b>Номера клеток</b><span class="d">Стандартная нумерация 1–50 на тёмных клетках</span></div>${sw('nums')}</div>` : ''}
        <div class="pg-row" id="pg-hide-row" style="display:none"><div><b>Скрыть прошлые партии</b><span class="d">Удалить публичные копии ваших прошлых партий (в профиле и по ссылкам)</span></div><button class="pg-small" id="pg-hide-btn">Скрыть</button></div>
        <div class="pg-title2">Оформление доски</div>
        <div class="pg-themes">${Object.entries(THEMES).map(([k, t]) => `<button class="pg-th ${s.board === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
        <button class="pg-close">Готово</button></div>`;
      if (window.PGSync) window.PGSync.mountRow(ov.querySelector('#pg-sync-row'));
      ov.querySelectorAll('.pg-sw').forEach((b) => { b.onclick = () => { const k = b.dataset.k; set({ [k]: !get()[k] }); paint(); }; });
      ov.querySelectorAll('.pg-th').forEach((b) => { b.onclick = () => { set({ board: b.dataset.b }); paint(); }; });
      const hideRow = ov.querySelector('#pg-hide-row'); if (hideRow && typeof window.pgHideMine === 'function') { hideRow.style.display = 'flex'; ov.querySelector('#pg-hide-btn').onclick = async (e) => { const b = e.target; b.disabled = true; b.textContent = '…'; try { const n = await window.pgHideMine(); b.textContent = n ? 'Скрыто: ' + n : 'Нечего скрывать'; } catch (err) { console.error(err); b.textContent = 'Не удалось'; } }; }
      ov.querySelector('.pg-close').onclick = close;
    }
    function close() { ov.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); }); document.addEventListener('keydown', onKey);
    paint(); document.body.appendChild(ov);
  };

  // ---- плашка «Подтвердить ход» ----
  let bar = null;
  window.pgConfirm = {
    show(text, ok, cancel) {
      if (!bar) { bar = document.createElement('div'); bar.id = 'pg-confirm'; document.body.appendChild(bar); }
      bar.innerHTML = '<span></span><button class="ok">✓ Подтвердить</button><button class="no">✕</button>';
      bar.firstChild.textContent = text; bar.style.display = 'flex';
      bar.querySelector('.ok').onclick = () => { ok(); }; bar.querySelector('.no').onclick = () => { cancel(); };
    },
    hide() { if (bar) bar.style.display = 'none'; },
    get visible() { return !!bar && bar.style.display !== 'none'; }
  };
})();

</script>
<script>
// ============ Синхронизация данных между устройствами (вход через Google, хранилище — Firestore) ============
// Принципы: данные по-прежнему лежат в браузере (всё работает офлайн), а облако — копия.
// Настройки и незавершённые партии: побеждает более поздняя правка. Статистика и история партий сливаются без потерь.
(function () {
  if (window.PGSync) return;
  const SDK = 'https://www.gstatic.com/firebasejs/10.13.0/';
  const CFG = { apiKey: 'AIzaSyDpce_OyUUijQajza3tIKQjcTBzAtGbQrY', authDomain: 'pep-chess-2026.firebaseapp.com', projectId: 'pep-chess-2026', storageBucket: 'pep-chess-2026.firebasestorage.app', messagingSenderId: '170856560854', appId: '1:170856560854:web:d9b6b766cbd56780ecf177' };
  // Что синхронизируем: m — способ слияния, slow — не чаще раза в 15 секунд (часто перезаписываемые сохранения)
  const REG = {
    pgSettings: { m: 'lww' }, draughtsSettings: { m: 'lww' }, draughtsNickname: { m: 'lww' }, chessNickname: { m: 'lww' },
    sudokuPrefs: { m: 'lww' }, sudokuLevel: { m: 'lww' }, crosswordPrefs: { m: 'lww' },
    sudokuSave: { m: 'lww', slow: true }, crosswordSave: { m: 'lww', slow: true }, crosswordWeekSave: { m: 'lww', slow: true },
    sudokuStats: { m: 'stats' }, crosswordStats: { m: 'stats' },
    chessGameHistory: { m: 'history', limit: 100 }, draughtsHistory: { m: 'history', limit: 100 }
  };
  const META = 'pgSyncMeta', UIDK = 'pgSyncUid', DEVK = 'pgDevId';
  const ls = window.localStorage, rawSet = Storage.prototype.setItem, rawRem = Storage.prototype.removeItem;
  const getL = (k) => { try { return ls.getItem(k); } catch (e) { return null; } };
  const st = { status: 'off', user: null, last: 0, error: '' };
  let backend = null, uid = null, unsub = null, applying = false, timers = {}, started = false, firstDone = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms || 9000))]);
  const emit = () => window.dispatchEvent(new CustomEvent('pgsync-state', { detail: Object.assign({}, st) }));
  const setSt = (patch) => { Object.assign(st, patch); emit(); };
  const devId = () => { let d = getL(DEVK); if (!d) { d = Math.random().toString(36).slice(2, 10); try { rawSet.call(ls, DEVK, d); } catch (e) {} } return d; };
  const getMeta = () => { try { return JSON.parse(getL(META) || '{}'); } catch (e) { return {}; } };
  const putMeta = (m) => { try { rawSet.call(ls, META, JSON.stringify(m)); } catch (e) {} };
  const parse = (s) => { try { return s ? JSON.parse(s) : null; } catch (e) { return null; } };

  // ---------- слияние ----------
  const pad2 = (n) => String(n).padStart(2, '0'), keyOf = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  const dayBefore = (key) => { const [y, m, d] = key.split('-').map(Number); return keyOf(new Date(y, m - 1, d - 1)); };
  function mergeHistory(a, b, limit) {
    const map = new Map(); [].concat(parse(b) || [], parse(a) || []).forEach((r) => { if (r && r.date && !map.has(r.date)) map.set(r.date, r); });
    return JSON.stringify(Array.from(map.values()).sort((x, y) => (y.date > x.date ? 1 : y.date < x.date ? -1 : 0)).slice(0, limit || 100));
  }
  function mergeStats(a, b) {
    const A = parse(a) || {}, B = parse(b) || {}, out = JSON.parse(JSON.stringify(A));
    out.solved = {}; for (const k of new Set(Object.keys(A.solved || {}).concat(Object.keys(B.solved || {})))) out.solved[k] = Math.max((A.solved || {})[k] || 0, (B.solved || {})[k] || 0);
    out.best = {}; for (const k of new Set(Object.keys(A.best || {}).concat(Object.keys(B.best || {})))) { const x = (A.best || {})[k], y = (B.best || {})[k]; out.best[k] = x == null ? y : y == null ? x : Math.min(x, y); }
    const ra = (A.daily && A.daily.results) || {}, rb = (B.daily && B.daily.results) || {}, res = {};
    for (const k of new Set(Object.keys(ra).concat(Object.keys(rb)))) res[k] = ra[k] == null ? rb[k] : rb[k] == null ? ra[k] : Math.min(ra[k], rb[k]);
    const last = Object.keys(res).sort().pop() || null; let streak = 0;
    if (last) { let d = last; while (res[d] != null) { streak++; d = dayBefore(d); } }
    out.daily = { last, streak, results: res };
    const wa = (A.weekly && A.weekly.results) || {}, wb = (B.weekly && B.weekly.results) || {}, wr = {};            // суперкроссворд недели: результаты объединяются
    for (const k of new Set(Object.keys(wa).concat(Object.keys(wb)))) wr[k] = wa[k] == null ? wb[k] : wb[k] == null ? wa[k] : Math.min(wa[k], wb[k]);
    if (Object.keys(wr).length) out.weekly = { results: wr };
    return JSON.stringify(out);
  }
  // Решает, что делать с ключом при сравнении локальных данных с облачными
  function reconcile(k, cloud) {
    const spec = REG[k], local = getL(k), m = getMeta()[k] || {}, lt = m.t || (local != null ? 1 : 0);
    if (!cloud) return local != null ? { push: true, val: local } : {};
    const cv = cloud.del ? null : cloud.v, ct = cloud.t || 0;
    if (spec.m === 'lww') {
      if (cv === local) return { t: Math.max(ct, lt) };
      if (ct > lt) return { apply: true, val: cv, t: ct };
      return { push: true, val: local };
    }
    const merged = spec.m === 'history' ? mergeHistory(local, cv, spec.limit) : mergeStats(local, cv);
    return { apply: merged !== local, val: merged, push: merged !== cv, t: Math.max(ct, lt) };
  }
  function applyLocal(k, val, t) {
    applying = true; try { if (val == null) rawRem.call(ls, k); else rawSet.call(ls, k, val); } catch (e) {} applying = false;
    const m = getMeta(); m[k] = { t: t || Date.now() }; putMeta(m);
    window.dispatchEvent(new CustomEvent('pgsync-applied', { detail: { key: k } }));
  }

  // ---------- облако ----------
  async function pushKey(k, forced) {
    if (!backend || !uid) return; const spec = REG[k]; let val = getL(k), t = (getMeta()[k] || {}).t || Date.now();
    try {
      if (spec.m !== 'lww') {                                            // слияние: сначала смотрим, что в облаке
        const cloud = await withTimeout(backend.get(uid, k)); const r = reconcile(k, cloud); if (r.apply) applyLocal(k, r.val, r.t); val = r.val != null ? r.val : val; if (cloud && !r.push) { setSt({ status: 'ok', last: Date.now() }); return; }
      }
      await withTimeout(backend.set(uid, k, { k, v: val == null ? '' : val, del: val == null, t, dev: devId() }));
      const m = getMeta(); m[k] = { t }; putMeta(m); setSt({ status: 'ok', last: Date.now(), error: '' });
    } catch (e) { setSt({ status: 'error', error: String(e && e.message || e) }); }
  }
  function schedule(k) {
    if (!uid || !backend) return; clearTimeout(timers[k]); const slow = REG[k].slow && getL(k) != null;      // удаление (партию закончили) отправляем сразу
    timers[k] = setTimeout(() => { setSt({ status: 'syncing' }); pushKey(k); }, slow ? (window.__pgSyncSlowMs || 15000) : 1200);
  }
  function flush() { Object.keys(timers).forEach((k) => { clearTimeout(timers[k]); delete timers[k]; if (uid && backend) pushKey(k); }); }
  function onLocalChange(k) { const m = getMeta(); m[k] = { t: Date.now() }; putMeta(m); schedule(k); }

  // Любая запись в наши ключи localStorage в этой вкладке отправляется в облако
  Storage.prototype.setItem = function (k, v) { const prev = this === ls && REG[k] ? getL(k) : undefined; rawSet.apply(this, arguments); if (this === ls && REG[k] && !applying && prev !== String(v)) onLocalChange(k); };
  Storage.prototype.removeItem = function (k) { const had = this === ls && REG[k] ? getL(k) !== null : false; rawRem.apply(this, arguments); if (this === ls && REG[k] && !applying && had) onLocalChange(k); };
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); }); window.addEventListener('pagehide', flush);
  window.addEventListener('online', () => { if (uid) syncNow(); });

  async function handleChanges(changes, isFirst) {
    const seen = new Set();
    for (const ch of changes) {
      const k = ch.key; if (!REG[k]) continue; seen.add(k); const r = reconcile(k, ch.data);
      if (r.apply) applyLocal(k, r.val, r.t); else if (r.t) { const m = getMeta(); m[k] = { t: r.t }; putMeta(m); }
      if (r.push) pushKey(k, true);
    }
    if (isFirst) { for (const k of Object.keys(REG)) if (!seen.has(k) && getL(k) != null) pushKey(k, true); firstDone = true; }
    setSt({ status: 'ok', last: Date.now(), error: '' });
  }
  async function connect(user) {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    uid = user ? user.uid : null; setSt({ user: user ? { uid: user.uid, name: user.name } : null, status: user ? 'syncing' : 'off', error: '' });
    if (!user) return;
    const prev = getL(UIDK);
    if (prev && prev !== user.uid) {                                   // на этом устройстве вошёл другой человек: чужие данные не смешиваем
      applying = true; Object.keys(REG).forEach((k) => { try { rawRem.call(ls, k); } catch (e) {} }); applying = false; putMeta({});
      Object.keys(REG).forEach((k) => window.dispatchEvent(new CustomEvent('pgsync-applied', { detail: { key: k } })));
    }
    try { rawSet.call(ls, UIDK, user.uid); } catch (e) {}
    try { unsub = backend.listen(user.uid, (changes, isFirst) => handleChanges(changes, isFirst)); } catch (e) { setSt({ status: 'error', error: String(e) }); }
  }
  async function syncNow() {
    if (!uid || !backend) return; setSt({ status: 'syncing' });
    try { for (const k of Object.keys(REG)) { const cloud = await withTimeout(backend.get(uid, k)); const r = reconcile(k, cloud); if (r.apply) applyLocal(k, r.val, r.t); if (r.push) await pushKey(k, true); } setSt({ status: 'ok', last: Date.now(), error: '' }); }
    catch (e) { setSt({ status: 'error', error: String(e && e.message || e) }); }
  }

  // ---------- подключение к Firebase ----------
  async function firebaseBackend() {
    const [A, Au, F] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')]);
    let app = null; for (let i = 0; i < 60 && !app; i++) { const apps = A.getApps(); if (apps.length) app = apps[0]; else await sleep(50); }
    if (!app) app = A.initializeApp(CFG);
    const auth = Au.getAuth(app), db = F.getFirestore(app), col = (u) => F.collection(db, 'userData', u, 'docs');
    return {
      onUser(cb) { Au.onAuthStateChanged(auth, (u) => cb(u && !u.isAnonymous ? { uid: u.uid, name: u.displayName || u.email || 'Игрок' } : null)); },
      async get(u, key) { const s = await F.getDoc(F.doc(db, 'userData', u, 'docs', key)); return s.exists() ? s.data() : null; },
      async set(u, key, data) { await F.setDoc(F.doc(db, 'userData', u, 'docs', key), Object.assign({}, data, { at: F.serverTimestamp() })); },
      listen(u, cb) { let first = true; return F.onSnapshot(col(u), (snap) => { const ch = snap.docChanges().filter((c) => c.type !== 'removed' && !c.doc.metadata.hasPendingWrites).map((c) => ({ key: c.doc.id, data: c.doc.data() })); const f = first; first = false; cb(ch, f); }, (e) => setSt({ status: 'error', error: String(e && e.code || e) })); },

      if (!s.user) wrap.innerHTML = '<div><b style="font-size:14px;font-weight:600;display:block">Синхронизация между устройствами</b><span style="font-size:12px;color:#6E7568;display:block;margin-top:2px;line-height:1.4">Войдите через Google — настройки, незавершённые партии, судоку, кроссворды и статистика будут на всех ваших устройствах.' + (s.error ? ' <span style="color:#A23B33">' + s.error + '</span>' : '') + '</span></div><button data-a="in" style="' + btnCss + '">Войти</button>';

<style>

.c.l .num { position:absolute; top:1px; left:3px; font-size:max(8px, calc(var(--cw)*.26)); line-height:1; color:#555a4c; font-weight:600; pointer-events:none; }
.c.l.aw { background:color-mix(in srgb, #C49A36 26%, var(--sq-light)); border-color:rgba(122,92,24,.65); }
.c.l.ac { background:color-mix(in srgb, #C49A36 64%, var(--sq-light)); box-shadow:0 0 0 2px #3B5D4A, 0 2px 4px rgba(42,46,36,.25); z-index:2; }
.c.l.bad .ch { color:#A23B33; } .c.l.bad { background:color-mix(in srgb, #A23B33 22%, var(--sq-light)); }
.c.l.hint .ch { color:var(--green); }

#pause-ov { position:absolute; inset:0; background:rgba(238,240,231,.98); display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; cursor:pointer; font-size:18px; z-index:5; } #pause-ov small { color:var(--muted); font-size:13px; }

.cl li.act { background:color-mix(in srgb, #C49A36 30%, #FDFDFA); } .cl li.cross { background:color-mix(in srgb, #C49A36 12%, #FDFDFA); }
.cl li.filled { color:#9A9D8E; } .cl li.filled b { color:#B5B8A8; }

.seg3 { display:flex; border:1px solid var(--border); background:#F3F2EA; flex-shrink:0; } .seg3 button { border:none; border-right:1px solid var(--border); background:none; padding:7px 11px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; } .seg3 button:last-child { border-right:none; } .seg3 button.on { background:var(--green); color:#fff; }

<body>

<div id="menu" class="modal">
  <a class="back-hub" href="../">← Все игры</a>
  <button class="gear" id="open-prefs" title="Настройки" aria-label="Настройки">⚙</button>
  <div class="brand">Pep Crossword</div>
  <h2 class="serif">Кроссворды</h2>
  <div class="content">
    <div id="resume-card" class="card hidden"><div><b>Продолжить кроссворд</b><small id="resume-info"></small></div><button id="resume-btn">Играть</button></div>
    <div id="daily-card" class="card"><div><b>Кроссворд дня</b><small id="daily-info"></small></div><button id="daily-btn">Играть</button></div>
    <div id="week-card" class="card week"><div><b>Суперкроссворд недели</b><small id="week-info"></small></div><button id="week-btn">Играть</button></div>
    <div class="title">Размер кроссворда</div>
    <div class="sbox"><div class="shead"><b id="size-name">Средний</b><span id="size-info"></span></div>

      <div class="ticks"><span>6 слов</span><span>150 слов</span></div>
      <div class="presets" id="size-presets"><button data-n="9">Малый</button><button data-n="15">Средний</button><button data-n="26">Большой</button><button data-n="40">Огромный</button><button data-n="56">Супер</button><button data-n="150">Суперкроссворд</button></div></div>
    <div class="title">Сложность</div>
    <div class="sbox"><div class="shead"><b id="lvl-name">Средний</b><span id="lvl-info"></span></div>
      <input type="range" id="lvl-range" min="1" max="5" step="1" value="3" aria-label="Сложность">
      <div class="ticks"><span>лёгкий</span><span>эксперт</span></div></div>
    <div class="title">Тема</div>
    <select id="theme"></select>
    <button class="big" id="new-btn" style="margin-top:18px">Новый кроссворд</button>
    <div class="title">Ваша статистика</div>
    <table class="stats" id="stats"></table>
    <div id="sync-row" style="margin-top:16px"></div>
    <div class="ver" id="ver"></div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="main">
    <div class="topbar">

<script type="text/plain" id="cw-engine">
// ============ Кроссворд: генератор сетки по словарю ============
// Слова расставляются по одному: каждое новое пересекается с уже стоящими по общей букве, не касаясь других слов боками.
var CW = (function () {
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, rnd) { for (let i = arr.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
  // Размер: число слов (6..60) -> сторона поля; категория для статистики
  const LEGACY = { small: 9, medium: 15, large: 22 };
  const BOX_PTS = [[6, 9], [9, 11], [15, 15], [22, 19], [35, 25], [50, 30], [60, 33], [100, 38], [150, 42]];
  function boxFor(n) { n = Math.max(6, Math.min(150, n)); for (let i = 1; i < BOX_PTS.length; i++) { const [a, ba] = BOX_PTS[i - 1], [b, bb] = BOX_PTS[i]; if (n <= b) return Math.round(ba + (bb - ba) * (n - a) / (b - a)); } return 42; }
  function sizeCat(n) { return n <= 12 ? 'small' : n <= 22 ? 'medium' : n <= 34 ? 'large' : n <= 48 ? 'huge' : n <= 99 ? 'super' : 'mega'; }
  const SIZES = { small: { words: 9, box: 11, minLen: 3 }, medium: { words: 15, box: 15, minLen: 3 }, large: { words: 22, box: 19, minLen: 3 } };
  // Сложность 1..5: какие слова берём и какие вопросы выбираем
  const CENTER = { 1: 1.2, 2: 1.9, 3: 2.8, 4: 3.7, 5: 4.4 };
  const POOLF = { 1: (l) => l <= 3, 2: (l) => l <= 4, 3: () => true, 4: (l) => l >= 2, 5: (l) => l >= 3 };
  const HARD_P = { 1: 0, 2: 0, 3: 0.15, 4: 0.7, 5: 0.95 };
  // Знакомое слово с хитрым вопросом на высоких уровнях считается трудным (как в настоящих трудных кроссвордах)
  const hasHard = (x) => !!(x.h && x.h.length);
  const effLevel = (x, lvl) => (lvl >= 4 && hasHard(x) ? Math.max(x.l || 3, CENTER[lvl] - 0.8) : (x.l || 3));

  // Одна попытка построения. Возвращает { cells: Map, words: [...] } или null
  function attempt(pool, theme, S, rnd, lvl) {
    const M = 2 * S.box + 4, grid = Array.from({ length: M }, () => new Array(M).fill('')), dirs = Array.from({ length: M }, () => new Array(M).fill(0));

    // проверка размещения; возвращает число пересечений или -1
    function check(w, r, c, dir) {
      const dr = dir ? 1 : 0, dc = dir ? 0 : 1, len = w.length;
      if (r < 1 || c < 1 || r + dr * (len - 1) >= M - 1 || c + dc * (len - 1) >= M - 1) return -1;
      const bb = bboxWith(r, c, dir, len); if (bb[1] - bb[0] + 1 > S.box || bb[3] - bb[2] + 1 > S.box) return -1;

        if (cur) { if (cur !== w[k]) return -1; if (dirs[rr][cc] & (dir ? 2 : 1)) return -1; cross++; }
        else { if (grid[rr - dc][cc - dr] || grid[rr + dc][cc + dr]) return -1; }      // боковые соседи свободной клетки должны быть пусты
      }
      return cross;
    }
    function put(e, r, c, dir) {
      const dr = dir ? 1 : 0, dc = dir ? 0 : 1;
      for (let k = 0; k < e.w.length; k++) { grid[r + dr * k][c + dc * k] = e.w[k]; dirs[r + dr * k][c + dc * k] |= dir ? 2 : 1; }
      const bb = bboxWith(r, c, dir, e.w.length); minR = bb[0]; maxR = bb[1]; minC = bb[2]; maxC = bb[3];
      placed.push({ e, r, c, dir }); used.add(e.w);
    }
    // первое слово: длинное, по горизонтали, в центре
    const near = (e) => Math.abs(effLevel(e, lvl) - CENTER[lvl]) <= 1.3;
    let firsts = pool.filter((e) => e.w.length >= 6 && e.w.length <= Math.min(S.box - 2, 9) && (!theme || e.t === theme) && near(e));
    if (!firsts.length) firsts = pool.filter((e) => e.w.length >= 6 && e.w.length <= Math.min(S.box - 2, 9));
    const f = (firsts.length ? firsts : pool)[(rnd() * (firsts.length || pool.length)) | 0];
    put(f, (M / 2) | 0, ((M - f.w.length) / 2) | 0, 0);
    let fails = 0;
    while (placed.length < S.words && fails < 3) {
      const cand = []; const order = shuffle(placed.map((_, i) => i), rnd);
      outer: for (const pi of order) {
        const pw = placed[pi], dir = pw.dir ? 0 : 1;
        for (const ci of shuffle(Array.from({ length: pw.e.w.length }, (_, i) => i), rnd)) {
          const L = pw.e.w[ci], pr = pw.r + (pw.dir ? ci : 0), pc = pw.c + (pw.dir ? 0 : ci), opts = byLetter[L] || [];
          const start = (rnd() * opts.length) | 0;
          for (let q = 0; q < Math.min(opts.length, 40); q++) {
            const [idx, j] = opts[(start + q) % opts.length], e = pool[idx]; if (used.has(e.w)) continue;
            const r = dir ? pr - j : pr, c = dir ? pc : pc - j, cross = check(e.w, r, c, dir); if (cross < 0) continue;
            const bb = bboxWith(r, c, dir, e.w.length), area = (bb[1] - bb[0] + 1) * (bb[3] - bb[2] + 1);
            cand.push({ e, r, c, dir, score: cross * 4 - area / 25 + (theme && e.t === theme ? 2.5 : 0) - Math.abs(effLevel(e, lvl) - CENTER[lvl]) * 1.7 + (lvl >= 4 && hasHard(e) ? 1.6 + (lvl - 4) * 0.8 : 0) + rnd() * 1.5 });
            if (cand.length >= 40) break outer;
          }
        }
      }
      if (!cand.length) { fails++; continue; }
      cand.sort((a, b) => b.score - a.score); const pick = cand[Math.min(cand.length - 1, (rnd() * rnd() * 4) | 0)]; put(pick.e, pick.r, pick.c, pick.dir);
    }
    return { grid, placed, box: [minR, maxR, minC, maxC] };
  }

  // Строит готовый кроссворд: обрезает поле, нумерует слова, выбирает вопросы
  function pickClue(e, lvl, rnd) {
    if (hasHard(e) && rnd() < HARD_P[lvl]) return { text: e.h[(rnd() * e.h.length) | 0], hard: true };
    const c = e.clues; return { text: c[(rnd() * c.length) | 0], hard: false };
  }
  function finalize(res, rnd, size, theme, lvl, nWords) {
    const [r0, r1, c0, c1] = res.box, rows = r1 - r0 + 1, cols = c1 - c0 + 1;
    const grid = Array.from({ length: rows }, (_, r) => Array.from({ length: cols }, (_, c) => res.grid[r0 + r][c0 + c]));
    const startAt = {}; res.placed.forEach((p, i) => { startAt[(p.r - r0) + ',' + (p.c - c0) + ',' + p.dir] = i; });
    let n = 0; const words = [], numAt = {};
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (!grid[r][c]) continue;
      const a = startAt[r + ',' + c + ',0'], d = startAt[r + ',' + c + ',1']; if (a === undefined && d === undefined) continue;
      n++; numAt[r + ',' + c] = n;
      for (const [idx, dir] of [[a, 0], [d, 1]]) if (idx !== undefined) { const p = res.placed[idx], clues = p.e.clues; const pc = pickClue(p.e, lvl, rnd); words.push({ n, dir: dir ? 'down' : 'across', r, c, len: p.e.w.length, answer: p.e.w, clue: pc.text, hard: pc.hard, theme: p.e.t, lvl: p.e.l || 3 }); }
    }
    return { rows, cols, grid, words, numAt, size, theme: theme || null, level: lvl, target: nWords };
  }

  // Главная функция. dict — массив {w, t, clues}; opts: { size, theme, rnd, attempts }
  function generate(dict, opts) {
    let n = opts.words; if (!n) n = LEGACY[opts.size] || 15; n = Math.max(6, Math.min(150, Math.round(n)));
    const lvl = Math.max(1, Math.min(5, Math.round(opts.level || 3))), S = { words: n, box: boxFor(n), minLen: 3 }, rnd = opts.rnd || Math.random, theme = opts.theme || null; let best = null;
    const base = dict.filter((x) => x.w.length >= S.minLen && x.w.length <= S.box - 1);
    const lvPool = base.filter((x) => POOLF[lvl](x.l || 3) || (lvl >= 4 && hasHard(x))), pool = lvPool.length >= 400 ? lvPool : base;
    let themed = theme ? pool.filter((x) => x.t === theme) : []; if (theme && themed.length < 30) themed = base.filter((x) => x.t === theme);
    const stages = theme && themed.length >= 30 ? [{ p: themed, n: 30 }, { p: pool, n: 40 }] : [{ p: pool, n: 40 }];   // сначала только слова темы, потом — с добавкой других
    for (const st of stages) {
      for (let a = 0; a < (opts.attempts || st.n); a++) {
        const res = attempt(st.p, theme, S, rnd, lvl); if (!res) continue;
        const crossings = res.placed.reduce((sum, p) => sum + p.e.w.length, 0) - new Set(res.grid.flatMap((row, r) => row.map((v, c) => (v ? r + ',' + c : null)).filter(Boolean))).size;
        const area = (res.box[1] - res.box[0] + 1) * (res.box[3] - res.box[2] + 1), score = res.placed.length * 100 + crossings * 3 - area * 0.2;
        if (!best || score > best.score) best = { res, score };
        if (res.placed.length >= S.words && crossings >= Math.floor(S.words * 0.6)) break;
      }
      if (best && best.res.placed.length >= S.words) break;      // цели достигли на словах темы — смешивать не нужно
    }
    if (!best) return null; const out = finalize(best.res, rnd, sizeCat(n), theme, lvl, n); return out;
  }

  // Независимая проверка готового кроссворда (для тестов): возвращает список проблем
  function validate(p, dictMap) {
    const bad = []; const { grid, rows, cols, words } = p;
    const runs = [];
    for (let r = 0; r < rows; r++) { let c = 0; while (c < cols) { if (grid[r][c]) { let e = c; while (e < cols && grid[r][e]) e++; if (e - c >= 2) runs.push({ dir: 'across', r, c, len: e - c, s: grid[r].slice(c, e).join('') }); c = e; } else c++; } }
    for (let c = 0; c < cols; c++) { let r = 0; while (r < rows) { if (grid[r][c]) { let e = r; while (e < rows && grid[e][c]) e++; if (e - r >= 2) runs.push({ dir: 'down', r, c, len: e - r, s: grid.slice(r, e).map((row) => row[c]).join('') }); r = e; } else r++; } }
    if (runs.length !== words.length) bad.push(`слов в списке ${words.length}, а отрезков на поле ${runs.length}`);
    for (const w of words) {
      const run = runs.find((x) => x.dir === w.dir && x.r === w.r && x.c === w.c);
      if (!run) bad.push(`слово «${w.answer}» не совпадает с отрезком на поле`); else if (run.s !== w.answer || run.len !== w.len) bad.push(`на поле «${run.s}», а в списке «${w.answer}»`);
      if (dictMap && !dictMap[w.answer]) bad.push(`слова «${w.answer}» нет в словаре`);
      if (!w.clue) bad.push(`нет вопроса к «${w.answer}»`);
    }
    const ans = words.map((w) => w.answer); if (new Set(ans).size !== ans.length) bad.push('есть повторяющиеся слова');
    // связность
    const cells = []; grid.forEach((row, r) => row.forEach((v, c) => v && cells.push(r + ',' + c))); const seen = new Set([cells[0]]), q = [cells[0]];
    while (q.length) { const [r, c] = q.pop().split(',').map(Number); for (const [a, b] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (r + a) + ',' + (c + b); if (grid[r + a] && grid[r + a][c + b] && !seen.has(k)) { seen.add(k); q.push(k); } } }
    if (seen.size !== cells.length) bad.push('поле несвязное');
    // нумерация: номера идут по порядку чтения, у пары слов с общим стартом номер одинаковый
    let last = 0; for (const w of words) { if (w.n < last) bad.push('нумерация нарушена'); last = w.n; }
    return bad;
  }
  return { generate, validate, mulberry32, shuffle, SIZES, boxFor, sizeCat, LEGACY };
})();
if (typeof module !== 'undefined') module.exports = CW;

  c.classList.toggle('open', open); S.autoList = open && S.listPref !== 'open';
  c.querySelectorAll('ol').forEach((o) => { o.style.maxHeight = open ? Math.max(90, (S.listPref === 'open' ? 0.3 * innerHeight : free - 40)) + 'px' : ''; });
}
addEventListener('resize', applyKb);

/* ---------- меню ---------- */
function openGame() { $('menu').classList.add('hidden'); $('game').classList.remove('hidden'); buildGrid(); $('pause-ov').style.display = S.paused ? 'flex' : 'none'; $('pause-btn').textContent = S.paused ? 'Играть' : 'Пауза'; lastTick = performance.now(); fixDir(); applyKb(); render(); fitClues(); }
function showMenu() { if (S && !S.done) persist(); $('game').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); }
$('menu-btn').onclick = showMenu;
function renderMenu() {
  const sv = load(LS.save, null); $('resume-card').classList.toggle('hidden', !sv);
  if (sv) { const filled = sv.val.filter(Boolean).length, total = sv.puz.grid.flat().filter(Boolean).length; $('resume-info').textContent = `${sv.daily ? 'Кроссворд дня' : SIZE[sv.size] + ' · ' + (LVL[sv.level || 3]) + (sv.theme ? ' · ' + sv.theme : '')} · ${fmt(sv.time)} · заполнено ${filled} из ${total}`; }
  const tk = todayKey(), d = stats.daily;
  $('daily-info').innerHTML = d.results[tk] != null ? `Разгадан сегодня за ${fmt(d.results[tk])} ✓ · серия: ${d.streak}` : (d.streak && d.last === dayBefore(tk) ? `Не прерывайте серию: ${d.streak} дн. подряд` : 'Один и тот же кроссворд для всех, каждый день новый');
  $('daily-btn').textContent = d.results[tk] != null ? 'Ещё раз' : 'Играть';
  const wk = weekKey(), wsv = load(LS.week, null), wres = stats.weekly.results[wk], wcur = wsv && wsv.week === wk && wsv.puz;
  if (wcur) { const tot = wsv.puz.grid.flat().filter(Boolean).length, fl = wsv.val.filter(Boolean).length; $('week-info').textContent = `Идёт решение: заполнено ${Math.round(100 * fl / tot)}% · ${fmt(wsv.time)}`; }
  else $('week-info').textContent = wres != null ? `Разгадан за ${fmt(wres)} ✓ — новый будет в понедельник` : '150 слов, поле до 42×42. Один и тот же для всех, решайте хоть всю неделю';
  $('week-btn').textContent = wcur ? 'Продолжить' : wres != null ? 'Ещё раз' : 'Играть';
  syncSliders(); $('theme').value = prefs.theme;
  $('stats').innerHTML = '<tr><th>Размер</th><th>Разгадано</th><th>Лучшее время</th></tr>' + Object.keys(SIZE).map((k) => `<tr><td>${SIZE[k]}</td><td>${stats.solved[k] || 0}</td><td>${stats.best[k] != null ? fmt(stats.best[k]) : '—'}</td></tr>`).join('');
}
function syncSliders() {
  const n = prefs.words, cat = CW.sizeCat(n), box = CW.boxFor(n), tt = w2t(n);
  $('size-range').value = tt; $('size-range').style.setProperty('--fill', tt + '%'); $('size-name').textContent = SIZE[cat]; $('size-info').textContent = `${n} ${plural(n, 'слово', 'слова', 'слов')} · поле до ${box}×${box}`;
  document.querySelectorAll('#size-presets button').forEach((b) => b.classList.toggle('on', Math.abs(+b.dataset.n - n) <= (+b.dataset.n >= 100 ? 8 : 2)));
  $('lvl-range').value = prefs.level; $('lvl-range').style.setProperty('--fill', ((prefs.level - 1) / 4 * 100) + '%'); $('lvl-name').textContent = LVL[prefs.level]; $('lvl-info').textContent = LVL_INFO[prefs.level];
}
// Шкала нелинейная: левая часть ползунка подробнее (6…60 слов), правый край — суперкроссворд (до 150)
const w2t = (w) => Math.round(Math.log(Math.max(6, w) / 6) / Math.log(25) * 100);
const t2w = (t) => Math.max(6, Math.min(150, Math.round(6 * Math.pow(25, t / 100))));
$('size-range').oninput = () => { prefs.words = t2w(+$('size-range').value); store(LS.prefs, prefs); syncSliders(); };
$('lvl-range').oninput = () => { prefs.level = +$('lvl-range').value; store(LS.prefs, prefs); syncSliders(); };
document.querySelectorAll('#size-presets button').forEach((b) => { b.onclick = () => { prefs.words = +b.dataset.n; store(LS.prefs, prefs); syncSliders(); }; });
$('theme').onchange = () => { prefs.theme = $('theme').value; store(LS.prefs, prefs); };
$('new-btn').onclick = () => startNew(prefs.words, prefs.level, prefs.theme, false);
$('daily-btn').onclick = () => startNew(15, 3, null, true);
$('week-btn').onclick = () => startWeek();
$('resume-btn').onclick = () => { if (!resume()) renderMenu(); };

/* ---------- настройки ---------- */
$('open-prefs').onclick = () => {
  if ($('prefs-ov')) return; const ov = document.createElement('div'); ov.className = 'ov'; ov.id = 'prefs-ov';
  function paint() {
    const th = window.PGS ? PGS.THEMES : {}, cur = window.PGS ? PGS.get().board : 'classic';
    ov.innerHTML = `<div class="panel"><h3>Настройки</h3>
      <div class="srow"><div><b>Показывать ошибки сразу</b><span class="d">Неверные буквы подсвечиваются красным по мере ввода</span></div><button class="sw ${prefs.autoCheck ? 'on' : ''}" id="p-auto"></button></div>
      <div class="srow"><div><b>Экранная клавиатура</b><span class="d">Авто — только на телефонах и планшетах</span></div><div class="seg3" id="p-kb"><button data-v="auto" class="${prefs.kb === 'auto' ? 'on' : ''}">Авто</button><button data-v="on" class="${prefs.kb === 'on' ? 'on' : ''}">Вкл</button><button data-v="off" class="${prefs.kb === 'off' ? 'on' : ''}">Выкл</button></div></div>
      <div style="padding:14px 24px 0;font-size:14px;font-weight:600">Оформление</div><div class="themes">${Object.entries(th).map(([k, t]) => `<button class="th ${cur === k ? 'on' : ''}" data-b="${k}"><i style="background:linear-gradient(135deg,${t.l} 50%,${t.d} 50%)"></i>${t.n}</button>`).join('')}</div>
      <button class="big" id="prefs-close" style="width:calc(100% - 48px);margin:6px 24px 22px;box-shadow:none">Готово</button></div>`;
    $('p-auto').onclick = () => { prefs.autoCheck = !prefs.autoCheck; store(LS.prefs, prefs); paint(); render(); };
    ov.querySelectorAll('#p-kb button').forEach((b) => { b.onclick = () => { prefs.kb = b.dataset.v; store(LS.prefs, prefs); paint(); applyKb(); }; });
    ov.querySelectorAll('.th').forEach((b) => { b.onclick = () => { PGS.set({ board: b.dataset.b }); paint(); }; }); $('prefs-close').onclick = () => ov.remove();
  }
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); }); document.body.appendChild(ov); paint();      // сначала в страницу, потом рисуем: иначе $() не найдёт кнопки панели
};

/* ---------- PWA и тестовые хуки ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('service-worker.js').catch(() => {});
window.__cw = { get worker() { return genWorker; }, get prefs() { return prefs; }, w2t, t2w, weekKey, startWeek, nextEmpty, drawMap, syncSliders, clearWord, backspace, fitClues, get S() { return S; }, CW, DICT, startNew, typeLetter, backspace, clickCell, selectWord, revealLetter, revealWord, checkWord, checkAll, get prefs() { return prefs; }, get stats() { return stats; }, showMenu, setPause, todayKey, activeIdx };
// Данные пришли из облака (другое устройство): перечитываем настройки и статистику
window.addEventListener('pgsync-applied', (e) => {
  const k = e.detail && e.detail.key;
  if (k === 'crosswordStats') stats = readStats(); else if (k === 'crosswordPrefs') { prefs = readPrefs(); if (S) { resize(); applyKb(); render(); } }
  if ($('game').classList.contains('hidden')) renderMenu();
});
if (window.PGSync) PGSync.mountRow($('sync-row'), true);
renderMenu();
})();
</script>
